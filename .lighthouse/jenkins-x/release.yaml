apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/next-version.yaml@main
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/promote-cluster-suffixed.yaml@main
          name: ""
          resources: {}
        - name: build-agent-images
          image: gcr.io/kaniko-project/executor:v1.8.0-debug
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          script: |
            #!/busybox/sh
            set -e
            set -o pipefail
            source .jx/variables.sh
            VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0-snapshot")
            echo "=== Building leartech-agent-runtime:${VERSION} ==="
            echo "    cluster registry: ${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}"

            sed 's/"credHelpers":{[^}]*},//' /tekton/creds/.docker/config.json > /workspace/docker-config.json
            if [ -n "$GIT_TOKEN" ]; then
              GHCR_AUTH=$(printf "mikelear:%s" "$GIT_TOKEN" | base64)
              cat /workspace/docker-config.json | sed "s/\"auths\":{/\"auths\":{\"ghcr.io\":{\"auth\":\"${GHCR_AUTH}\"},/" > /kaniko/.docker/config.json
            else
              cp /workspace/docker-config.json /kaniko/.docker/config.json
            fi

            if [ -z "${CLUSTER_ID:-}" ]; then
              echo "CLUSTER_ID is empty (jx-cluster-config/CLUSTER_ID, namespace jx) — refusing to guess which cluster publishes the shared ghcr tags"
              exit 1
            fi
            LANGS="go py ng rust"

            # ONE PIN PER LANGUAGE, because the four toolsets are four images
            # with four independent version streams — they are built by
            # separate leartech-dockerfiles pipelines and their tags have never
            # advanced together.
            #
            # A single shared TOOLSET_VERSION assumed they did, and on
            # 2026-09-21 it was bumped to 0.51.13, which only agent-go-toolset
            # has. Every release since then built go, published it, then failed
            # on py and never reached ng or rust:
            #
            #   leartech-agent-go     0.50.40 @ 2026-09-27  (today)
            #   leartech-agent-py     0.50.35 @ 2026-09-18  (9 days stale)
            #   leartech-agent-ng     0.50.35 @ 2026-09-18
            #   leartech-agent-rust   0.50.35 @ 2026-09-18
            #
            # Four consecutive release pipelines reported Failed and nobody
            # noticed, because a GitHub release tag is still cut and `go` — the
            # one anyone looks at — kept working.
            #
            # AND RENOVATE KEEPS DOING IT. While this PR was open the bot
            # bumped the shared pin again — 0.51.13 -> 0.52.2 — because the
            # renovate comment above it named agent-go-toolset and 0.52.2 is
            # that image's newest tag. py, ng and rust have no 0.52.2 either,
            # so main went from broken-at-0.51.13 to broken-at-0.52.2. The
            # shared pin does not merely allow the fault; it guarantees a fresh
            # one on every go-toolset release.
            #
            # Each pin now carries its OWN renovate comment so the bot bumps
            # them separately, which is the whole point: a bump to one toolset
            # cannot name a tag the other three do not have.

            # renovate: datasource=docker depName=ghcr.io/mikelear/leartech-agent-go-toolset
            TOOLSET_GO=0.52.2
            # renovate: datasource=docker depName=ghcr.io/mikelear/leartech-agent-py-toolset
            TOOLSET_PY=0.51.10
            # renovate: datasource=docker depName=ghcr.io/mikelear/leartech-agent-ng-toolset
            TOOLSET_NG=0.51.10
            # renovate: datasource=docker depName=ghcr.io/mikelear/leartech-agent-rust-toolset
            TOOLSET_RUST=0.51.10

            toolset_for() {
              # A case, not indirect expansion: busybox sh has no ${!var}.
              case "$1" in
                go)   echo "$TOOLSET_GO" ;;
                py)   echo "$TOOLSET_PY" ;;
                ng)   echo "$TOOLSET_NG" ;;
                rust) echo "$TOOLSET_RUST" ;;
                *)    echo "" ;;
              esac
            }

            # EVERY PIN RESOLVED AND PRINTED BEFORE ANYTHING IS BUILT.
            #
            # This does NOT check that the tags exist — kaniko's image has no
            # registry client, and the build itself is the check. What it does
            # is name all four pins up front, so a log reader sees which
            # version each language is about to use rather than inferring it
            # from whichever build failed first.
            #
            # A language in LANGS with no pin is refused here, because the
            # alternative is an empty tag reference and a confusing kaniko
            # error about a manifest for ":".
            for LANG in $LANGS; do
              TS=$(toolset_for "$LANG")
              if [ -z "$TS" ]; then
                echo "no toolset pin for language ${LANG}: add TOOLSET_$(echo "$LANG" | tr a-z A-Z) above" >&2
                exit 1
              fi
              echo "==> ${LANG}: toolset ${TS}"
            done

            for LANG in $LANGS; do
              IMG="leartech-agent-${LANG}"
              DESTS="--destination=${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}/${IMG}:${VERSION} --destination=${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}/${IMG}:latest"
              if [ "$CLUSTER_ID" = "gcp" ]; then
                DESTS="$DESTS --destination=ghcr.io/mikelear/${IMG}:${VERSION} --destination=ghcr.io/mikelear/${IMG}:latest"
              else
                echo "==> CLUSTER_ID=${CLUSTER_ID}: skipping ghcr push for ${IMG} (gcp publishes the shared registry)"
              fi
              echo "=== Building ${IMG}:${VERSION} on ${IMG}-toolset:$(toolset_for "$LANG") ==="
              # shellcheck disable=SC2086 — deliberate word-split of $DESTS
              /kaniko/executor \
                --dockerfile=Dockerfile.runtime \
                --context=/workspace/source \
                $DESTS \
                --build-arg=BASE_IMAGE=ghcr.io/mikelear/${IMG}-toolset:$(toolset_for "$LANG") \
                --cache=true
            done
          workingDir: /workspace/source
        - name: trigger-renovate
          image: alpine/k8s:1.28.4
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          script: |
            #!/bin/sh
            set -e
            if [ "${CLUSTER_ID:-unknown}" != "gcp" ]; then
              echo "CLUSTER_ID=${CLUSTER_ID:-unknown}: skipping renovate trigger (the renovate cronjob is GCP-only; one cluster triggers so agentTypes.tag gets a single PR per cluster repo)"
              exit 0
            fi
            JOB="renovate-after-agent-images-$(date +%s)"
            echo "==> creating one-shot ${JOB} from cronjob/renovate-agent-images"
            kubectl -n jx create job --from=cronjob/renovate-agent-images "${JOB}" || \
              echo "::WARN renovate trigger failed (non-fatal); the scheduled cron will pick up the bump"
          workingDir: /workspace/source
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
