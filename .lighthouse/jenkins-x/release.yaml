apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/python-no-promote/release.yaml@main
          name: ""
          resources: {}
          env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          workingDir: /workspace/source
        steps:
        - name: ""
          resources: {}
        # Phase D.1: publish leartech-agent-runtime alongside the API image,
        # tagged with the same VERSION the catalog release task computed.
        #
        # ghcr.io push requires inline auth injection: the catalog auto-mounts
        # /tekton/creds/.docker/config.json with cluster-registry creds only
        # (GAR + ACR), not ghcr.io. We mirror the auth pattern from
        # leartech-dockerfiles/.lighthouse/jenkins-x/leartech-agent-base/release.yaml:
        # strip credHelpers (kaniko doesn't honour them) and inject a ghcr.io
        # auth entry built from the tekton-git PAT.
        - name: build-agent-images
          image: gcr.io/kaniko-project/executor:v1.8.0-debug
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          # Which cluster this release is running on. ghcr.io is the SHARED
          # registry and AZ owns publishing to it: per-cluster
          # jx-release-version chains compute different next-versions, and
          # GCP's chain stalled at v0.10.71-gcp, so its numbers collide with
          # tags ghcr already holds (DENIED). Canonical gate, same as
          # leartech-bus-common's tag-release step.
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          script: |
            #!/busybox/sh
            set -e
            set -o pipefail
            # Source jx-variables so PUSH_CONTAINER_REGISTRY + DOCKER_REGISTRY_ORG
            # are exported with the cluster's home-registry prefix. Without this,
            # both vars are empty and kaniko falls back to docker.io. Same pattern
            # leartech-agent-base/release.yaml uses.
            source .jx/variables.sh
            VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0-snapshot")
            echo "=== Building leartech-agent-runtime:${VERSION} ==="
            echo "    cluster registry: ${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}"

            # Build docker config: cluster-registry creds + ghcr.io auth
            # Mirrors leartech-dockerfiles/.lighthouse/jenkins-x/leartech-agent-base/release.yaml
            sed 's/"credHelpers":{[^}]*},//' /tekton/creds/.docker/config.json > /workspace/docker-config.json
            if [ -n "$GIT_TOKEN" ]; then
              GHCR_AUTH=$(printf "mikelear:%s" "$GIT_TOKEN" | base64)
              cat /workspace/docker-config.json | sed "s/\"auths\":{/\"auths\":{\"ghcr.io\":{\"auth\":\"${GHCR_AUTH}\"},/" > /kaniko/.docker/config.json
            else
              cp /workspace/docker-config.json /kaniko/.docker/config.json
            fi

            # One FINAL agent image per language: this repo's code layered onto the
            # matching toolset from leartech-dockerfiles. The toolset carries the
            # build tools for its language (what CI/CD the agent will run); this
            # layer carries the Dev Agent itself (how to take a PR to green).
            #
            # AgentTypes consume ghcr.io/mikelear/leartech-agent-<lang>, so these
            # ARE the images agents run.
            #
            # NOTE: script runs in /busybox/sh — no bash arrays.
            LANGS="go py ng rust"

            for LANG in $LANGS; do
              IMG="leartech-agent-${LANG}"
              DESTS="--destination=${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}/${IMG}:${VERSION} --destination=${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}/${IMG}:latest"
              if [ "${CLUSTER_ID:-unknown}" = "az" ]; then
                DESTS="$DESTS --destination=ghcr.io/mikelear/${IMG}:${VERSION} --destination=ghcr.io/mikelear/${IMG}:latest"
              else
                echo "==> CLUSTER_ID=${CLUSTER_ID:-unknown}: skipping ghcr push for ${IMG} (AZ owns the shared registry)"
              fi
              echo "=== Building ${IMG}:${VERSION} on ${IMG}-toolset ==="
              # shellcheck disable=SC2086 — deliberate word-split of $DESTS
              /kaniko/executor \
                --dockerfile=Dockerfile.runtime \
                --context=/workspace/source \
                $DESTS \
                --build-arg=BASE_IMAGE=ghcr.io/mikelear/${IMG}-toolset:latest \
                --cache=true
            done
          workingDir: /workspace/source
        # Kick the Renovate cronjob so the GitOps repos pick up the new agent
        # image version within minutes instead of waiting for Renovate's own
        # schedule. Renovate bumps agentTypes.tag in both clusters' configs;
        # those PRs carry the updatebot label, which Keeper's second query
        # auto-merges once the contexts pass — the same path promote PRs take.
        #
        # Non-fatal: a failed trigger delays the bump, it does not break the
        # release. The next scheduled Renovate run picks it up.
        - name: trigger-renovate
          image: gcr.io/jenkinsxio/jx-cli:latest
          resources: {}
          script: |
            #!/bin/sh
            set -e
            JOB="renovate-after-agent-images-$(date +%s)"
            echo "==> creating one-shot ${JOB} from cronjob/renovate"
            kubectl -n jx create job --from=cronjob/renovate "${JOB}" || \
              echo "::WARN renovate trigger failed (non-fatal); the scheduled cron will pick up the bump"
          workingDir: /workspace/source
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
