apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
# TEMPORARY SLIM PR-time pipeline for the architecture-sprint window
# (2026-05-28). Skips: full lint suite, pytest, image-scan, security-scan,
# dynamic-scan, preview namespace deploy. Keeps: git-clone, ai-review,
# kaniko --no-push smoke for both Dockerfiles.
#
# Why: cascade cycles take 20-40 min per PR (catalog tasks + preview deploy).
# With ~10 D-phase initiatives still ahead, the wall-clock cost is the
# main bottleneck. Stripping PR gates to the validation that catches the
# most defects (ai-review + build smoke) cuts cycle to ~5-10 min. The
# release pipeline still runs the full suite — defects that escape PR-time
# get caught there.
#
# Restore: revert this file to the prior catalog-using shape (the previous
# version on main before this commit). Or git revert this commit when the
# architecture sprint completes.
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: ai-review-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # AI review (kept — strongest quality signal at PR time, especially
        # post-Azure-OpenAI 4-reviewer aggregate).
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/ai-review/pullrequest.yaml@main
          name: ""
          resources: {}
        # API image kaniko smoke (no push). Validates Dockerfile builds end-to-end.
        - name: build-api-image-smoke
          image: gcr.io/kaniko-project/executor:debug
          command:
          - /busybox/sh
          args:
          - -c
          - |
            set -e
            set -o pipefail
            echo "=== Smoke-building Dockerfile (no push) ==="
            /kaniko/executor \
              --dockerfile=Dockerfile \
              --context=/workspace/source \
              --no-push \
              --build-arg=BASE_IMAGE=ghcr.io/mikelear/leartech-agent-runtime:0.10.24
          workingDir: /workspace/source
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
        # Runtime image kaniko smoke. Validates Dockerfile.runtime builds.
        # Override BASE_IMAGE to python:3.13-slim (no ghcr.io pull auth on
        # PR-time runs by default).
        - name: build-runtime-image-smoke
          image: gcr.io/kaniko-project/executor:debug
          command:
          - /busybox/sh
          args:
          - -c
          - |
            set -e
            set -o pipefail
            echo "=== Smoke-building Dockerfile.runtime (no push) ==="
            /kaniko/executor \
              --dockerfile=Dockerfile.runtime \
              --context=/workspace/source \
              --no-push \
              --build-arg=BASE_IMAGE=python:3.13-slim
          workingDir: /workspace/source
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
