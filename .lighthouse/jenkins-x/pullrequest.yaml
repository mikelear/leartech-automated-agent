apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/jx3-pipeline-catalog/tasks/python/pullrequest.yaml@master
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: ai-review-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - name: jx-variables
          resources: {}
        - image: python:3.13-slim
          name: build-python-test
          resources: {}
          script: |
            #!/bin/sh
            pip install uv --quiet
            uv sync --dev --frozen --no-cache 2>/dev/null || uv sync --dev --no-cache
            echo "=== Running tests ==="
            uv run coverage run -m pytest -v
            uv run coverage report
        # D3 — per-module state-machine coverage gate. Runs AFTER
        # build-python-test (Tekton runs task steps sequentially; a
        # failure above this step short-circuits the rest, so "runs
        # only on success" is the default). The step re-runs pytest
        # under --cov to produce coverage.xml, then invokes the
        # per-file checker which asserts statement >= 85% and branch
        # >= 70% on the V5-D1/D2 state-machine modules. Regressing
        # those tests blocks the PR — see
        # scripts/check_state_machine_coverage.py for the module list
        # and rationale.
        #
        # Image: python:3.13-slim (matches build-python-test). The
        # initiative spec'd ghcr.io/mikelear/leartech-agent-py:latest
        # but the kaniko comment below documents that ghcr.io pulls
        # are unauthenticated on PR runs — staying on the public
        # python image is the safe choice. `set -e` is mandatory per
        # the feedback_pr_pytest_step_must_set_e memory.
        - image: python:3.13-slim
          name: state-machine-coverage-gate
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -e
            pip install uv --quiet
            uv sync --dev --frozen --no-cache 2>/dev/null || uv sync --dev --no-cache
            echo "=== Running state-machine coverage gate ==="
            uv run pytest --cov --cov-report=xml --cov-report=term tests/
            uv run python scripts/check_state_machine_coverage.py
        - name: build-container-build
          resources: {}
        # Phase D.1: smoke-test Dockerfile.runtime on PR. We can't FROM
        # ghcr.io/mikelear/leartech-agent-base from inside a PR (no ghcr.io
        # pull auth on PR runs), so we override BASE_IMAGE=python:3.13-slim
        # to validate the COPY/RUN structure. Kaniko --no-push skips registry
        # auth entirely. Release builds use the real agent-base.
        - name: build-runtime-image-smoke
          image: gcr.io/kaniko-project/executor:debug
          command:
          - /busybox/sh
          args:
          - -c
          - |
            set -e
            echo "=== Smoke-building Dockerfile.runtime (no push) ==="
            /kaniko/executor \
              --dockerfile=Dockerfile.runtime \
              --context=/workspace/source \
              --no-push \
              --build-arg=BASE_IMAGE=python:3.13-slim
          workingDir: /workspace/source
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
        - name: promote-jx-preview
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
