name: all-pass-immediately
description: |
  Happy path. All 12 cluster/check pairs pass within 15 seconds — the
  agent should call wait_for_first_failure_or_all_pass once, get
  `status: "all_passed"`, and proceed to the final sticky.

  Use to verify the agent's stopping criterion fires cleanly when there's
  nothing to iterate on.
events:
  - at_seconds: 0
    checks:
      - {cluster: az,  check: ai-review,    state: PENDING}
      - {cluster: az,  check: lint,         state: PENDING}
      - {cluster: az,  check: pr,           state: PENDING}
      - {cluster: az,  check: image-scan,   state: PENDING}
      - {cluster: az,  check: security-scan,state: PENDING}
      - {cluster: az,  check: dynamic-scan, state: PENDING}
      - {cluster: gcp, check: ai-review,    state: PENDING}
      - {cluster: gcp, check: lint,         state: PENDING}
      - {cluster: gcp, check: pr,           state: PENDING}
      - {cluster: gcp, check: image-scan,   state: PENDING}
      - {cluster: gcp, check: security-scan,state: PENDING}
      - {cluster: gcp, check: dynamic-scan, state: PENDING}
  - at_seconds: 15
    checks:
      - {cluster: az,  check: ai-review,    state: SUCCESS}
      - {cluster: az,  check: lint,         state: SUCCESS}
      - {cluster: az,  check: pr,           state: SUCCESS}
      - {cluster: az,  check: image-scan,   state: SUCCESS}
      - {cluster: az,  check: security-scan,state: SUCCESS}
      - {cluster: az,  check: dynamic-scan, state: SUCCESS}
      - {cluster: gcp, check: ai-review,    state: SUCCESS}
      - {cluster: gcp, check: lint,         state: SUCCESS}
      - {cluster: gcp, check: pr,           state: SUCCESS}
      - {cluster: gcp, check: image-scan,   state: SUCCESS}
      - {cluster: gcp, check: security-scan,state: SUCCESS}
      - {cluster: gcp, check: dynamic-scan, state: SUCCESS}
