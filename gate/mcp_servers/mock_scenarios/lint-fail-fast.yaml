name: lint-fail-fast
description: |
  Lint fails in 10s while end2end keeps running for another 8+ minutes.
  Demonstrates the wait_for_first_failure_or_all_pass primitive's value
  — the agent should see lint=FAILURE and iterate immediately, not wait
  ~10 min for end2end to finish.

  Expected agent behaviour:
  1. push → call wait_for_first_failure_or_all_pass
  2. Returns within ~15s with first_failure={cluster: az, check: lint, ...}
  3. Agent reads failure log, classifies as code-fixable
  4. Edit → commit → push → wait again
  5. (Next cycle would use scenario `all-pass-immediately` or similar)
events:
  - at_seconds: 0
    checks:
      - {cluster: az,  check: lint,         state: PENDING}
      - {cluster: az,  check: pr,           state: PENDING}
      - {cluster: az,  check: end2end,      state: PENDING}
      - {cluster: gcp, check: lint,         state: PENDING}
      - {cluster: gcp, check: pr,           state: PENDING}
      - {cluster: gcp, check: end2end,      state: PENDING}
  - at_seconds: 10
    # AZ lint flips to FAILURE while everything else is still running.
    # This is the "fail-fast" signal the agent should pick up.
    checks:
      - {cluster: az,  check: lint,         state: FAILURE}
      - {cluster: az,  check: pr,           state: IN_PROGRESS}
      - {cluster: az,  check: end2end,      state: PENDING}
      - {cluster: gcp, check: lint,         state: IN_PROGRESS}
      - {cluster: gcp, check: pr,           state: IN_PROGRESS}
      - {cluster: gcp, check: end2end,      state: PENDING}
  - at_seconds: 600
    # If the agent hadn't fail-fast'd, this is what eventually settles.
    # Included to prove the "wait_for_terminal would have taken 10 min"
    # contrast.
    checks:
      - {cluster: az,  check: lint,         state: FAILURE}
      - {cluster: az,  check: pr,           state: SUCCESS}
      - {cluster: az,  check: end2end,      state: SUCCESS}
      - {cluster: gcp, check: lint,         state: SUCCESS}
      - {cluster: gcp, check: pr,           state: SUCCESS}
      - {cluster: gcp, check: end2end,      state: SUCCESS}
