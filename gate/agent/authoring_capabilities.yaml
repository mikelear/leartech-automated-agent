# Authorable capability surface — what the BA agent may put in a plan STEP.
#
# The BA reads this (rendered into its system prompt by ba_agent._build_system_prompt)
# so every step it authors is EXECUTABLE. Without it the BA authored phantom steps —
# e.g. an infra `provision-db-secret` that no agent action implements — which crash on
# spawn (see project_ba_agent_event_remediation 12th/13th seams).
#
# ── EXTENDING (the whole point) ────────────────────────────────────────────────
# To give the BA a new remediation power, do TWO things:
#   1. implement the action in the owning agent's entrypoint
#      (dev: gate/agent/main.py contract; infra: gate/agent/infra_agent.py ACTIONS), and
#   2. add an entry under that agent_type here (flip a `planned` action to `available`).
# The BA can author it the NEXT deploy — no ba_agent code change. Infra is the
# privileged / restricted agent, so most new cluster-side powers (config, provider
# wiring, release ops) land as new infra ACTIONS. EXCEPTION: secret VALUES are
# human-owned by design and are NOT a future infra action (see capability_gaps).
# Keep this file in sync with the controller chart's agentTypes.defaults + each
# agent entrypoint's real contract.
#
# ── ROUTING (how the BA picks an agent_type for a step) ─────────────────────────
routing:
  - "In-repo change (code, chart/values edits, tests) -> a DEV agent (leartech-agent-<lang>) as a PR. e.g. 'set database.enabled=false in the hello-go7 chart' is a dev PR."
  - "Cluster-side / privileged op (source-config, deploy-config, release verification, and — in future — config/provider wiring) -> leartech-agent-infra via an ACTION. Infra is the restricted capability-holder. NOTE: secret VALUES are human-owned, not an infra action (see capability_gaps)."
  - "If the fix needs a power that is NOT an `available` action below (e.g. provisioning a secret value): do NOT author a phantom step. Do BOTH — (1) author the executable fix that unblocks it NOW if one exists (usually a DEV PR that removes the need, e.g. database.enabled=false), AND (2) REPORT the matching capability-gap (needs-infra:<action> for a future infra power, or needs-human:<x> for human-owned work like secret provisioning). The gap is a REPORTED line in your summary, not a plan step, so it never competes with the executable fix — the plan stays paused for the human owner. If no executable fix exists at all, author only the verify step and report the gap alone."

# ── AGENT TYPES ────────────────────────────────────────────────────────────────
agent_types:
  # Dev family — same contract, one image per language. Sandboxed: opens PRs on repos.
  leartech-agent-py: &dev
    kind: dev
    purpose: "Make an in-repo change and open a PR (code, chart/values, tests). Sandboxed to the target repo."
    inputs:
      name: "step name (unique within the plan)"
      goal: "the change to make = the PR objective. Be specific and self-contained."
      repo: "owner/name of the target repo"
      branch: "feat/<slug> (required — the working branch)"
    use_for:
      - "code changes"
      - "chart / values / config edits that live IN A REPO (e.g. set database.enabled=false)"
      - "adding or extending tests / criteria"
  leartech-agent-go: *dev
  leartech-agent-ng: *dev
  leartech-agent-rust: *dev

  # Infra — the PRIVILEGED / RESTRICTED agent. Action-driven. This `actions` list is
  # the authoritative surface of what infra can do; it GROWS over time (see EXTENDING).
  leartech-agent-infra:
    kind: infra
    restricted: true
    purpose: "Cluster-side wiring + release verification. Action-driven — inputs MUST include `action`."
    inputs:
      action: "one of the `available` actions below (REQUIRED — omitting it usage-errors the agent)"
      # plus each action's own params (see below)
    actions:
      register-source-config:
        status: available
        inputs: {repo: "owner/name", cluster: "gcp|az"}
        does: "Register the repo in a cluster's source-config (one PR per cluster; idempotent, merge-gated)."
      deploy-config:
        status: available
        inputs: {repo: "owner/name", cluster: "gcp|az"}
        does: "Land the deploy/helmfile config for a cluster."
      # --- Deterministic release-verify check (kind: check) ---------------------
      # A thin, re-callable Go-MCP-tool relay (NO LLM turn-loop): calls
      # leartech-k8s.deploy_health per cluster and decides PASS/FAIL on the
      # tool's typed, VERSION-AWARE verdict (see gate/agent/release_checks.py).
      # This is the canonical FINAL verify step of a remediation plan.
      deploy-health:
        status: available
        inputs: {service: "service name", namespace: "target namespace", clusters: "list of gcp|az (default both)", version: "optional released tag (else derived from promote_status)"}
        does: "Verify the deployed service is the NEW version AND healthy per cluster (deterministic, version-aware): leartech-k8s.deploy_health returns healthy=true with >=1 available replica AND observed_version == the promoted version. Authoritative in-cluster signal — NO httpx probe, NO kubectl, NO LLM. Use as the FINAL verify step of every remediation plan."
      # --- PLANNED actions land here (status: planned) once an infra power is on
      #     the roadmap. NOTE: secret PROVISIONING is deliberately NOT here —
      #     secrets are human-owned by design (see capability_gaps), not a future
      #     infra action.

  # The BA itself — never author steps targeting leartech-agent-ba.
  leartech-agent-ba:
    kind: meta
    purpose: "(you) — do not author plan steps that target yourself."

# ── CAPABILITY GAPS ─────────────────────────────────────────────────────────────
# Remediations NO agent can perform today. Never author a phantom step for these —
# author the executable steps you CAN, and end your report with a `needs-infra` /
# `needs-human` line naming the gap. Each gap is a candidate to become an infra action
# (that's how the infra surface grows to make future remediations fully automatable).
capability_gaps:
  - id: needs-human:provision-secret
    when: "the fix requires creating/rotating a secret value in the backend (GSM/Vault/AKV)"
    today: "secrets are HUMAN-OWNED BY DESIGN — no agent provisions secret values (the value is sensitive and often depends on real infra, e.g. a DB DSN needs a real database). AUTHOR the executable fix that removes the need if one exists (e.g. a DEV PR setting database.enabled=false) AND report this gap so the secret's human owner provisions the value + the plan waits (paused) for them. Do NOT plan to automate this."
  - id: needs-human:gitops-overlay
    when: "the fix requires editing a cluster GitOps overlay directly (helmfiles / config-root) or a cloud console / IAM change"
    today: "operator/GitOps only — report it as needs-human"
