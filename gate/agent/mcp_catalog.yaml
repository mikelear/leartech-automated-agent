# MCP catalog — single source of truth for the platform's tool surface.
#
# Adopts the registry pattern from mqube-mcp-connector (see
# project_mcp_catalog_pattern memo) without the LLM-gateway layer.
# claude-agent-sdk handles the Anthropic side; this catalog only describes
# the MCP servers themselves.
#
# Three deployment modes supported (`type:` field):
#   - sdk     : in-process via claude_agent_sdk.create_sdk_mcp_server.
#               Builder is a "module:function" reference returning McpSdkServerConfig.
#   - stdio   : subprocess launched per agent session (mqube pattern).
#               `command` + `args` + optional `env` describe how to spawn.
#   - http_sse: long-running HTTP server speaking MCP over SSE.
#               `url` + optional `auth` describe how to connect.
#   - remote  : remote API speaking MCP over HTTP.
#               `url` + optional `auth` describe how to connect.
#
# Role-to-MCP mapping below selects which MCPs each agent persona gets
# at session start. Adding an MCP requires three changes: add to the
# `mcp_servers` map, add any required env to the chart's externalSecrets,
# and reference it in the right role's `mcps` list. No agent code changes.

mcp_servers:
  # Remote — served by the Go `leartech-mcp-servers/jx3_flow` deployment.
  # Exposes the aggregate PR-check surface previously reimplemented in-process
  # by the retired `gate.mcp_servers.pipeline_server` shim
  # (list_pr_checks, wait_for_terminal, wait_for_first_failure_or_all_pass).
  # Uses the same `LEARTECH_PLATFORM_MCPS_URL` env pattern as the other
  # platform-mcps entries so each cluster's chart can point at its
  # cluster-local URL.
  leartech-jx3-flow:
    type: http_sse
    url: ${LEARTECH_PLATFORM_MCPS_URL:-https://leartech-platform-mcps-jx-staging.jx.leartech.com}/mcp/jx3_flow/sse
    description: |
      PR-check status across both clusters — list_pr_checks,
      wait_for_terminal, wait_for_first_failure_or_all_pass. Served
      remotely by the Go `leartech-mcp-servers/jx3_flow` deployment; the
      former in-process SDK shim (`gate.mcp_servers.pipeline_server`) has
      been deleted. New features for the pipeline MCP land in the
      leartech-mcp-servers repo.

  leartech-criteria:
    type: sdk
    builder: gate.mcp_servers.criteria_server:build_criteria_server
    description: Discover and execute pytest gate criteria; returns structured pass/fail per criterion.

  leartech-pr-context:
    type: http_sse
    url: ${LEARTECH_PLATFORM_MCPS_URL:-https://leartech-platform-mcps-jx-staging.jx.leartech.com}/mcp/pr-context/sse
    description: |
      PR metadata + diff + changed files via platform-mcps — a long-running
      HTTP/SSE server hosted in each cluster's platform-mcps deployment.
      `LEARTECH_PLATFORM_MCPS_URL` env var lets the chart point at the
      cluster-local URL; default is the staging URL which both clusters reach
      via local DNS. The previous in-process SDK builder shipped with this
      repo has been deleted; new features for the pr-context MCP land in
      the platform-mcps repo.

  leartech-test-artifacts:
    type: sdk
    builder: gate.mcp_servers.artifacts_server:build_artifacts_server
    description: Playwright videos, traces, screenshots from GCS test-artifacts bucket.

  leartech-tekton:
    type: http_sse
    url: ${LEARTECH_PLATFORM_MCPS_URL:-https://leartech-platform-mcps-jx-staging.jx.leartech.com}/mcp/tekton/sse
    description: |
      Step-aware Tekton PipelineRun inspection served remotely. Surfaces
      WHICH STEP failed (git-clone vs ruff vs pytest), tails per-step logs,
      and cancels superseded runs on force-push. The former in-process SDK
      builder (`gate.mcp_servers.tekton`) has been deleted; the Go
      `leartech-mcp-servers/tekton` deployment now exposes the same six
      tools (list_pipelineruns_for_pr, step_status, step_logs,
      cancel_pipelinerun, cancel_superseded_for_pr, wait_first_failure).
      `LEARTECH_PLATFORM_MCPS_URL` env var lets the chart point at the
      cluster-local URL; default is the staging URL which both clusters reach
      via local DNS.

  leartech-agent-local:
    type: sdk
    builder: gate.mcp_servers.agent_local:build_agent_local_server
    description: |
      Two step-aware helpers that MUST stay in-process because they depend on
      state inside the agent pod: `classify_step_failure` (LLM-adjacent
      heuristic classifier — imports gate.agent.step_failure_diagnosis) and
      `rebase_branch_on_base` (git ops on the cloned consumer-repo workspace).
      The rest of the step-aware surface lives in the remote `leartech-tekton`
      MCP; this catalog entry is the boundary marker.

  leartech-initiatives:
    type: sdk
    builder: gate.mcp_servers.initiatives_server:build_initiatives_server
    description: |
      Fire initiatives against the deployed agent service. Exposes
      `fire_initiative(name)` for catalog-resolved firing and
      `fire_initiative_inline(body)` for one-shot firing whose YAML body is
      built at call time (e.g. orchestrator fix-up iterations whose goal
      embeds a failing PR's verdict comment).

  # Stdio (subprocess) — for external tools and future cross-process agents.
  # Marked `status: not_built` until the wrapper repo exists.
  stitch:
    type: stdio
    command: uvx
    args: [stitch-mcp]
    env:
      STITCH_API_KEY: $STITCH_API_KEY
    description: Leartech design-system catalog; component variants, token lookup.
    status: not_built

  figma:
    type: stdio
    command: npx
    args: ['@figma/mcp-server', '--readonly']
    env:
      FIGMA_TOKEN: $FIGMA_TOKEN
    description: Figma file + component access for the BA agent's design ingest.
    status: not_built

  # HTTP/SSE — when a vendor hosts the MCP themselves
  lovable:
    type: http_sse
    url: https://api.lovable.app/mcp/sse
    auth:
      type: bearer
      token_env: LOVABLE_TOKEN
    description: Lovable mockup + screen-flow access for BA-agent ingest.
    status: not_built

  github-copilot-mcp:
    type: remote
    url: https://api.githubcopilot.com/mcp/
    auth:
      type: bearer
      token_env: GITHUB_TOKEN
    description: GitHub Copilot's hosted MCP — broader repo/issue/PR queries.
    status: not_built

roles:
  initiative_agent:
    description: |
      Write-mode agent. Drives an initiative end-to-end: edit code, commit,
      push, open PR, watch the gate, iterate until green or budget exhausted.
    llm:
      backend: claude
      model: claude-opus-4-7
      max_turns: 1000
    mcps:
      - leartech-jx3-flow
      - leartech-criteria
      - leartech-pr-context
      - leartech-test-artifacts
      - leartech-tekton
      - leartech-agent-local
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep

  review_agent:
    description: |
      Read-only verdict agent. Looks at a PR, runs the gate, produces a
      structured review. Cannot write code or push — that's the build agent's job.
    mcps:
      - leartech-jx3-flow
      - leartech-pr-context
      - leartech-test-artifacts
    tools:
      - Read
      - Glob
      - Grep

  ba_agent:
    description: |
      Translates intent (Lovable mockup, docs, customer ask) into an initiative-set
      YAML for orchestrator consumption. Two-track sign-off (design + functional)
      gates whether the orchestrator picks it up.
    mcps:
      - lovable
      - stitch
      - figma
    tools:
      - Read
      - Write
      - Bash
      - Glob
      - Grep
      - WebFetch

  forensic_agent:
    description: |
      Read-mostly. Analyses post-merge regressions, generates lessons from
      qa-arch ring 2 (staging) and ring 3 (forensic) findings, writes them
      to the catalog via POST /lessons.
    mcps:
      - leartech-jx3-flow
      - leartech-pr-context
      - github-copilot-mcp
    tools:
      - Read
      - Grep
      - Bash
