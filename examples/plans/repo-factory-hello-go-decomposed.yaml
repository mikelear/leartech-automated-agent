# repo-factory-hello-go-decomposed — the DECOMPOSED Infra+Dev bootstrap (Mike 2026-07-24/25).
#
# Bootstraps a NEW service repo end-to-end, then shepherds its first release — the automation
# of the manual repo-creation + release watch. The flow is ordered so the new repo is fully
# wired BEFORE anything expects gating (fixing the first-PR chicken-and-egg where a scaffold
# PR's own .lighthouse/ triggers aren't on main yet):
#
#   create           create the repo (README on main)
#   register-gcp/az  add it to each cluster's source-config — MERGE-GATED: the step publishes
#                    its PR onto the AgentRun + auto-approves, so it stays AwaitingReview until
#                    Tide merges + reconciles (repo now known to Lighthouse/webhooks), THEN
#                    Succeeds. repo = the GitOps repo so the controller polls that PR to merge.
#   scaffold         push the template (code + .lighthouse/) STRAIGHT TO main (to_main=true) —
#                    lands triggers on main AND fires the release off the main push. repo:"" so
#                    it Succeeds on push (no PR).
#   release-monitor  the JX3 release check (release_status -> promote_status both clusters ->
#                    retest flakes / escalate gate-fails -> all_merged -> /health). dependsOn
#                    scaffold: the release fires at scaffold Succeeded. Fail-closed.
#   smoke            a trivial PR that now GATES (main has triggers) — proves the repo's PR
#                    pipelines fire. repo = the new repo so it reaches AwaitingReview.
#
# TriggeredWhen (occ-src) still applies to ongoing dev Plans (a real Dev PR -> AwaitingReview
# -> release-monitor watches merge->release); the bootstrap uses dependsOn because
# scaffold-to-main fires the release at Succeeded.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: repo-factory-hello-go-decomposed
  namespace: jx-staging
spec:
  tenant: leartech
  triggeredBy: agent
  steps:
    - name: create
      agentType: leartech-agent-infra
      repo: ""
      inputs:
        action: create-repo
        newRepo: mikelear/hello-go

    # Merge-gated: repo = the GitOps repo so the controller polls the register PR to merge.
    - name: register-gcp
      agentType: leartech-agent-infra
      dependsOn: [create]
      repo: mikelear/jx-build-cluster-gsm
      inputs:
        action: register-source-config
        service: hello-go
        cluster: gcp

    - name: register-az
      agentType: leartech-agent-infra
      dependsOn: [create]
      repo: mikelear/jx-build-cluster-akv
      inputs:
        action: register-source-config
        service: hello-go
        cluster: az

    # Bootstrap to main (no PR): lands .lighthouse/ on main + fires the release. Waits for both
    # registers to MERGE first (merge-gated) so the repo is known to Lighthouse when it pushes.
    - name: scaffold
      agentType: leartech-agent-infra
      dependsOn: [register-gcp, register-az]
      repo: ""
      inputs:
        action: scaffold-pr
        template: go
        name: hello-go

    # The JX3 release check — shepherds the release fired by scaffold-to-main through promote +
    # boot on both clusters, fail-closed. repo:"" (no PR of its own).
    - name: release-monitor
      agentType: leartech-agent-infra
      dependsOn: [scaffold]
      repo: ""
      inputs:
        action: release-health-check
        service: hello-go
        namespace: jx-staging
        healthPath: /health

    # Smoke: a trivial PR that now gates (main carries triggers) — proves PR CI works.
    # repo = the new repo so its PR is polled -> AwaitingReview.
    - name: smoke
      agentType: leartech-agent-infra
      dependsOn: [scaffold]
      repo: mikelear/hello-go
      inputs:
        action: smoke-pr
        name: hello-go
