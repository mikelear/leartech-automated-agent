# repo-factory-hello-go-decomposed — FULL Infra+Dev bootstrap + release watch (2026-07-27).
#
# Clean role split (Mike): INFRA creates the repo + wires plumbing + opens the smoke PR +
# watches the release; the DEV agent OWNS the smoke PR (adopts it, reacts to any gate failure,
# merges) — its job, no hardcoded failure list.
#
#   create           create the repo (README on main)
#   register-gcp/az  MERGE-GATED source-config (auto-approved; AwaitingReview until Tide merges
#                    + reconciles → repo known to Lighthouse) — so scaffold waits until it's real.
#   scaffold         push template (code + .lighthouse/) STRAIGHT TO main (to_main) — triggers on
#                    main + fires the bootstrap release. repo:"" (no PR).
#   smoke            Infra OPENS the smoke PR on branch smoke-hello-go (deterministic plumbing,
#                    fire-and-forget: NO run_id → no targetPR, repo:"" → Succeeds on open).
#   smoke-dev        DEV agent (leartech-agent-go) ADOPTS branch smoke-hello-go (idempotent
#                    open_pr records targetPR → AwaitingReview) and DRIVES it: watch gates, react
#                    to failures (retest flakes / fix real), MERGE. repo = the new repo.
#   release-monitor  Infra JX3 release check — triggeredWhen smoke-dev=AwaitingReview → watches
#                    that PR through merge → release → promote (both clusters) → boot → deploy,
#                    fail-closed. budgetMinutes:60 (a cold multi-cluster deploy runs 40-50 min).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: repo-factory-hello-go-decomposed
  namespace: jx-staging
spec:
  tenant: leartech
  triggeredBy: agent
  steps:
    - name: create
      agentType: leartech-agent-infra
      repo: ""
      inputs:
        action: create-repo
        newRepo: mikelear/hello-go

    - name: register-gcp
      agentType: leartech-agent-infra
      dependsOn: [create]
      repo: mikelear/jx-build-cluster-gsm
      inputs:
        action: register-source-config
        service: hello-go
        cluster: gcp

    - name: register-az
      agentType: leartech-agent-infra
      dependsOn: [create]
      repo: mikelear/jx-build-cluster-akv
      inputs:
        action: register-source-config
        service: hello-go
        cluster: az

    - name: scaffold
      agentType: leartech-agent-infra
      dependsOn: [register-gcp, register-az]
      repo: ""
      inputs:
        action: scaffold-pr
        template: go
        name: hello-go

    # Infra opens the smoke PR — deterministic plumbing, fire-and-forget (no run_id/targetPR).
    - name: smoke
      agentType: leartech-agent-infra
      dependsOn: [scaffold]
      repo: ""
      inputs:
        action: smoke-pr
        name: hello-go

    # Dev agent OWNS the smoke PR: adopt branch smoke-hello-go, drive to green, merge.
    - name: smoke-dev
      agentType: leartech-agent-go
      dependsOn: [smoke]
      repo: mikelear/hello-go
      inputs:
        name: hello-go-smoke
        repo: hello-go
        branch: smoke-hello-go
        goal: |
          A smoke PR is already OPEN on branch `smoke-hello-go` of this repo (opened by the Infra
          step). ADOPT it — the harness has checked the branch out; CALL the `open_pr` MCP tool
          (it is IDEMPOTENT: adopts the existing PR and records it onto this run). Then OWN the PR
          like any other: watch the Tekton gates, REACT to whatever fails (retest a flake, fix a
          real issue — new gate, vuln, lint), and take it GREEN through to MERGE. This proves the
          freshly-bootstrapped repo's PR pipelines work end-to-end. Do not re-do the pushed commit.

    # Infra JX3 release check — watches the smoke PR through to a deployed release, fail-closed.
    - name: release-monitor
      agentType: leartech-agent-infra
      triggeredWhen:
        step: smoke-dev
        phase: AwaitingReview
      repo: ""
      inputs:
        action: release-health-check
        service: hello-go
        namespace: jx-staging
        healthPath: /health
        budgetMinutes: 60
