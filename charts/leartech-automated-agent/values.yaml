replicaCount: 1
image:
  repository: "modernburro.azurecr.io/mikelear/leartech-automated-agent"
  tag: "0.10.13"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
# Anthropic SDK + agent loops are memory-heavy on substantial initiatives.
# 2026-05-20: mortgages-gw-add-mcp-mock-sourcing run OOMKilled at the 1 GiB
# limit during real code work (3 MCP tools + mock data + endpoint
# scaffolding). The simpler changelog-stub runs sit well under 1 GiB but
# any non-trivial refactor needs more headroom. Bumped to 4 GiB limit;
# request stays modest so the pod still bin-packs cleanly. Revisit once
# we have per-initiative memory telemetry.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
ingress:
  enabled: false
  host: ""
  tlsSecretName: ""
# Secrets — deployment references existing K8s Secret names; ExternalSecrets
# materialise them per-cluster using the auth-service pattern (same chart,
# both backends represented, cluster's GitOps configs/<chart>.yaml flips
# the right toggle on).
secrets:
  anthropicApiKey:
    secretName: ai-review-api-keys
    secretKey: CLAUDE_API_KEY
  ghToken:
    secretName: tekton-git
    secretKey: password
# ExternalSecret rendering — both clusters' shape kept here so the chart is
# multi-cluster-ready out of the box. Activate one via the cluster's
# configs/leartech-automated-agent.yaml override; never both at once.
externalSecrets:
  gcp:
    enabled: false # set true on GCP via configs/leartech-automated-agent.yaml
    projectId: product-first
    secrets:
    - name: ai-review-api-keys
      data:
      - name: CLAUDE_API_KEY
        key: claude-api-key
  azure:
    enabled: false # set true on AZ via configs/leartech-automated-agent.yaml
    vaultMountPoint: kubernetes
    vaultRole: jx-vault
    secrets:
    - name: ai-review-api-keys
      data:
      - name: CLAUDE_API_KEY
        key: secret/data/ai/claude
        property: apiKey
# tekton-git — materialises the basic-auth Secret used by `gh` / git inside
# the agent pod. Toggle via configs/<chart>.yaml. See
# templates/externalsecret-tekton-git.yaml for the convention discussion
# (long-term cleanup is to refactor ai-classifier onto the same toggle).
tektonGit:
  create: false
  backend: "" # "gsm" | "vault"
  gsm:
    projectId: product-first
    key: tf-jx-usable-bird-jx-pipeline-user
  vault:
    mountPoint: kubernetes
    role: jx-vault
    key: secret/data/jx/pipelineUser
# Where consumer-repo checkouts get mounted in cluster mode.
# The Initiative agent resolves repo paths against this prefix.
leartechRepoRoot: /workspace
# Postgres-backed initiative catalog. Mirrors auth-service's pattern:
# - CNPG Database CR provisions the per-service DB in the shared cluster
#   (leartech-staging lives in cnpg-system; Database CR sits in this
#   namespace and references the cluster cross-namespace by name alone).
# - The role + role password are owned by leartech-platform-postgres
#   (its CNPG Cluster.spec.managed.roles[] entry references a Secret
#   it materialises in cnpg-system from Vault/GSM).
# - The DSN injected into the workload is sourced separately via the
#   ExternalSecret below, NOT from the CNPG-auto `<cluster>-<role>-app`
#   secret. CNPG writes that auto-secret only into cnpg-system, and K8s
#   secrets are namespace-scoped — workloads here can't reference it.
#   Instead we keep a parallel DSN string in Vault/GSM that ESO syncs
#   into this namespace as `<dsn.secretName>` with key `<dsn.secretKey>`.
# - migrations-job applies files/migrations/*.sql as a Helm post-install
#   hook, reading the same in-namespace DSN secret.
#
# The Vault/GSM DSN password must match what leartech-platform-postgres
# uses for the role (same source key in their chart). No automatic
# rotation today — see auth-ui session's DSN guidance memo for details.
#
# Disabling the toggle (`postgresql.enabled: false`) makes the catalog
# endpoints return 503 and the agent falls back to filesystem-only YAML.
# Use that for previews or any cluster without CNPG.
postgresql:
  enabled: false # flip via configs/leartech-automated-agent.yaml on clusters with CNPG
  # DO NOT enable on preview deployments. Preview environments don't have the
  # leartech-staging CNPG cluster, the role won't exist, and the ExternalSecret
  # will 404 on the workload Vault/GSM path — pod CrashLoops on startup.
  # Long-lived staging is the only place this should be true.
  # Name of the existing shared CNPG cluster (provisioned outside this chart,
  # same one auth-service connects to). Per-service Database is owned by
  # this chart via the CR below.
  clusterName: leartech-staging
  databaseName: leartech_automated_agent
  # post-install/post-upgrade hook applies schema migrations from
  # files/migrations/*.sql in lexical order. Idempotent (IF NOT EXISTS).
  runMigrations: true
  # DSN secret materialised in this namespace by the ExternalSecret in
  # templates/externalsecret-postgres-db.yaml. Both the deployment and the
  # migrations-job read from these refs — change them and both follow.
  dsn:
    secretName: leartech-automated-agent-db
    secretKey: dsn
    # Per-cluster source paths. Active path is selected by the existing
    # externalSecrets.{gcp,azure}.enabled toggle. The DSN itself must
    # be pre-populated manually (see auth-ui session's bootstrap guide).
    gcp:
      # GSM key in `externalSecrets.gcp.projectId`. Flat string value.
      key: automated-agent-db-dsn
    azure:
      # KV-v2 path. The `/data/` segment is required by ESO's vault driver.
      key: secret/data/automated-agent/automated-agent-db
      property: dsn
jxRequirements:
  ingress:
    domain: ""
    namespaceSubDomain: ""
