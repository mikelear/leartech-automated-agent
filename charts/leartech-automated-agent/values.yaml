replicaCount: 1
image:
  repository: "us-central1-docker.pkg.dev/product-first/oci/leartech-automated-agent"
  tag: "0.10.129"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
  externalPort: 8080
# Agent runtime config. Override `model` to switch Anthropic model
# without a code change — `claude-opus-4-7` (default, balanced),
# `claude-haiku-4-5` (cheap routine work), `claude-opus-4-7`
# (complex strategic work). Empty/absent = use the in-code default
# at `gate/agent/main.py::DEFAULT_MODEL`.
agent:
  model: ""
  # Gateway repoint (Phase 1). Empty = call Anthropic directly (current
  # behaviour, unchanged). Set per-cluster in GitOps to the in-cluster gateway
  # to route every LLM call (agent loop + spec_suggester + video_review +
  # self_retrospect) through leartech-ai-gateway — metered, budgeted,
  # allowlisted. When set, `secrets.aiGatewayKey` must resolve to a gateway
  # VIRTUAL key (sk-lt-…), and the same base URL is forwarded to spawned Jobs
  # via _JOB_FORWARDED_ENV_KEYS. Proven pattern: ai-review-worker (ai-bus S13).
  #   aiGateway:
  #     baseUrl: http://leartech-ai-gateway.ai-gateway.svc:8080
  aiGateway:
    baseUrl: ""
  # Auth-hardening C1 (2026-07) — OIDC bearer validation is now REQUIRED by
  # default so every cluster (staging + previews) boots fail-closed. This is
  # the symmetric counterpart of the orchestrator's C1 flip: both services
  # now enforce audience + issuer + signature on every non-bypass request,
  # and refuse to start when issuer/audience are unset. See app/auth/middleware.py
  # for the load_settings_from_env raise contract.
  #
  # Issuer is shared with the orchestrator (same Hydra staging). Audience is
  # the well-known short name ``automated-agent`` — the orchestrator's C0
  # already mints s2s tokens with ``aud=automated-agent``, so the audience
  # value pinned here is the receiving-end match. NEVER change this to the
  # orchestrator's audience — that would let an orch-issued token be replayed
  # at the agent (the exact substitution attack the audience field exists
  # to prevent).
  #
  # Preview namespaces (jx-<repo>-pr-<N>) inherit these chart defaults so
  # their pod starts 1/1 with real auth wired. Previews only serve /healthz
  # + /readyz (bypass paths) during the smoke phase, so the middleware never
  # actually reaches Hydra — but LEARTECH_AUTH_REQUIRED=true still fires
  # the fail-closed guard, which is what proves the chart config is
  # complete before merge.
  auth:
    # Master toggle — when false, no LEARTECH_AUTH_* env vars are rendered
    # at all (the middleware then boots in optional mode via env-defaults).
    # Kept as an escape hatch for a hypothetical dev cluster that wants
    # anonymous traffic, BUT: leaving this on (the default) is what
    # implements C1's fail-closed contract.
    enabled: true
    # required=true is the point of C1. The env var LEARTECH_AUTH_REQUIRED
    # defaults to "true" in load_settings_from_env now, so even a cluster
    # that omits this field still fails closed. Keeping the field explicit
    # here documents intent + gives GitOps overlays a clean anchor.
    required: true
    # Hydra staging (shared with orchestrator + auth-service). Per-cluster
    # GitOps overlays MAY override to a per-cluster Hydra once we split;
    # the chart default targets the shared staging Hydra so previews boot
    # against a real, resolvable issuer.
    issuer: "https://hydra-jx-staging.jx.leartech.com"
    # Well-known short-name audience the orch's C0 already mints for.
    # DO NOT change to a per-cluster ingress URL — every cluster receiving
    # a token expects this exact string.
    audience: "automated-agent"
    # Claim name that carries the tenant_id in tokens minted by Hydra. The
    # leartech umbrella convention is `tenant_id` (top-level); override here
    # if a different Hydra config emits a nested or differently-named claim.
    # Tokens that don't carry this claim still pass validation — `tenant_id`
    # on request.state stays None and downstream handlers decide how to
    # treat the anonymous-tenant case (typically: reject in step 4 / step 5).
    tenantClaim: tenant_id
    # JWKS document TTL in seconds. Hydra rotates keys infrequently so 5 min
    # is comfortable; bump for high-traffic clusters where the steady-state
    # JWKS fetch is wasted bandwidth.
    jwksTtlSeconds: 300
  # Phase F.1 — default runtime is now 'job' (K8s Job per initiative; runs
  # survive API pod restarts via the orphan-killer path). Both clusters'
  # GitOps configs/leartech-automated-agent.yaml entries can drop their
  # explicit `agent.runtime: "job"` override now that the chart default
  # encodes the intent. The asyncio in-process path (pre-F code) is gone
  # — no other valid value today. Kept as a value (rather than hardcoded
  # in the template) so a future runtime variant can be introduced
  # without re-plumbing.
  runtime: "job"
  # V5 D2.1 — threshold (seconds) for the stale-progress detector in
  # gate/agent/run_driver.py::detect_pod_stuck_image_pull. When a run's
  # row is older than this AND the agent has not yet executed its first
  # SDK turn (started_executing_at IS NULL) AND the backing pod is
  # waiting in one of {ImagePullBackOff, ErrImagePull, InvalidImageName,
  # CreateContainerConfigError}, the job_reconciler short-circuits the
  # row to `failed` with `error=pod_stuck_<reason>`. 600s = 10min,
  # which keeps the V4 95-minute stall worst-case down to ~10min.
  # Lowered to 60s in preview-deploy integration tests so the broken-
  # image-tag flow finishes within the test's wait budget.
  staleProgressThresholdSeconds: 600
# Anthropic SDK + agent loops are memory-heavy on substantial initiatives.
# 2026-05-20: mortgages-gw-add-mcp-mock-sourcing run OOMKilled at the 1 GiB
# limit during real code work (3 MCP tools + mock data + endpoint
# scaffolding). The simpler changelog-stub runs sit well under 1 GiB but
# any non-trivial refactor needs more headroom. Bumped to 4 GiB limit;
# request stays modest so the pod still bin-packs cleanly. Revisit once
# we have per-initiative memory telemetry.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
ingress:
  enabled: false
  host: ""
  tlsSecretName: ""
  annotations: {}
  labels: {}
  pathType: ImplementationSpecific
# Grafana dashboards shipped with the chart (templates/grafana-dashboards.yaml +
# dashboards/*.json). Each JSON → a ConfigMap the cluster Grafana sidecar
# auto-imports (label jenkins-x.io/grafana-dashboard, searchNamespace ALL). Same
# pattern as leartech-evm-network. v1 = Agent Runs (Loki-backed run logs +
# open_pr/MCP activity + errors). Harmless in previews (just extra ConfigMaps with
# the same dashboard uid — Grafana dedups by uid); flip off there if noisy.
grafanaDashboards:
  enabled: true
  folder: "Leartech Agents"
# Secrets — deployment references existing K8s Secret names; ExternalSecrets
# materialise them per-cluster using the auth-service pattern (same chart,
# both backends represented, cluster's GitOps configs/<chart>.yaml flips
# the right toggle on).
secrets:
  # Credential the agent presents on every LLM call. When agent.aiGateway.baseUrl
  # is set this is a gateway VIRTUAL key (sk-lt-…), NOT a raw Anthropic key. The
  # deployment injects it into the env var ANTHROPIC_API_KEY — that env NAME is
  # fixed by the Anthropic / Claude Agent SDK contract (renameable only in Phase 3
  # when we own the runtime); the secret name/key below are ours and are now
  # provider-neutral. See docs/AI-GATEWAY-MIGRATION-PLAN.md ("Naming").
  aiGatewayKey:
    secretName: leartech-ai-gateway-key
    secretKey: AI_GATEWAY_API_KEY
  ghToken:
    secretName: tekton-git
    secretKey: password
# Phase B (B.3+B.4) — V2 plumbing. Admin-token gate for POST /admin/cleanup.
# Lifted out of `.Values.secrets` into a top-level block so it sits next to
# its own per-cluster ESO source-path toggles (mirroring `.Values.postgresql`).
#
# `enabled: true` makes deployment.yaml render the LEARTECH_ADMIN_TOKEN
# secretKeyRef on every cluster. The ref carries `optional: true`, so even
# preview namespaces (jx-<repo>-pr-<N>) that don't have the materialising
# ExternalSecret start cleanly — the env stays unset and the endpoint's
# `_check_admin_token` falls into the closed-by-default 401 branch. The
# `optional: true` flag is MANDATORY here — without it previews CrashLoop
# on CreateContainerConfigError. Memory:
# feedback_chart_secretref_must_be_optional_for_previews.
#
# Actual materialisation happens via templates/externalsecret-admin-token.yaml,
# gated on `adminToken.enabled` AND the active per-cluster ESO backend
# (`externalSecrets.gcp.enabled` or `externalSecrets.azure.enabled`).
# Operator-side bootstrap (seeding the GSM / Vault entry) is documented in
# the chart-plumb-admin-token-env initiative PR body; sibling per-cluster
# GitOps PRs flip the cluster's externalSecrets toggle on. Memory:
# feedback_secret_materialization_pattern.
adminToken:
  enabled: true
  secretName: leartech-automated-agent-admin-token
  secretKey: token
  # Per-cluster source paths. Active path is selected by the
  # `externalSecrets.{gcp,azure}.enabled` toggle (single backend per cluster).
  gcp:
    # GSM key in `.Values.externalSecrets.gcp.projectId`. Flat string value
    # — operator bootstrap creates it with `gcloud secrets create
    # automated-agent-admin-token --data-file=-` (see PR body).
    key: automated-agent-admin-token
  azure:
    # Vault KV-v2 path. The `/data/` segment is required by ESO's vault
    # driver. Operator bootstrap uses the cross-cluster sync pattern
    # documented in memory `reference_cross_cluster_secret_sync`.
    key: secret/data/leartech/automated-agent/admin-token
    property: token
# ExternalSecret rendering — both clusters' shape kept here so the chart is
# multi-cluster-ready out of the box. Activate one via the cluster's
# configs/leartech-automated-agent.yaml override; never both at once.
externalSecrets:
  eso:
    enabled: false # set true on AZ via configs/leartech-automated-agent.yaml (ESO -> leartech-secrets)
    storeName: leartech-secrets
  gcp:
    enabled: false # set true on GCP via configs/leartech-automated-agent.yaml
    projectId: product-first
    secrets:
    - name: leartech-ai-gateway-key
      data:
      # Materialised k8s secret key = AI_GATEWAY_API_KEY (provider-neutral).
      # The GSM SOURCE (key: claude-api-key) is unchanged for now so the
      # agent keeps working on direct Anthropic; the GitOps cutover repoints
      # this to the gateway virtual-key source when agent.aiGateway.baseUrl
      # is flipped on. See docs/AI-GATEWAY-MIGRATION-PLAN.md ("Naming").
      - name: AI_GATEWAY_API_KEY
        key: claude-api-key
  azure:
    enabled: false # set true on AZ via configs/leartech-automated-agent.yaml
    vaultMountPoint: kubernetes
    vaultRole: jx-vault
    secrets:
    - name: leartech-ai-gateway-key
      data:
      # See the gcp note: neutral k8s key; Vault SOURCE unchanged until the
      # GitOps cutover repoints it at the gateway virtual key.
      - name: AI_GATEWAY_API_KEY
        key: secret/data/ai/claude
        property: apiKey
# tekton-git — materialises the basic-auth Secret used by `gh` / git inside
# the agent pod. Toggle via configs/<chart>.yaml. See
# templates/externalsecret-tekton-git.yaml for the convention discussion
# (long-term cleanup is to refactor ai-classifier onto the same toggle).
tektonGit:
  eso:
    storeName: leartech-secrets
  create: false
  backend: "" # "gsm" | "vault"
  gsm:
    projectId: product-first
    key: tf-jx-usable-bird-jx-pipeline-user
  vault:
    mountPoint: kubernetes
    role: jx-vault
    key: secret/data/jx/pipelineUser
# Where consumer-repo checkouts get mounted in cluster mode.
# The Initiative agent resolves repo paths against this prefix.
leartechRepoRoot: /workspace
# Postgres-backed initiative catalog. Mirrors auth-service's pattern:
# - CNPG Database CR provisions the per-service DB in the shared cluster
#   (leartech-staging lives in cnpg-system; Database CR sits in this
#   namespace and references the cluster cross-namespace by name alone).
# - The role + role password are owned by leartech-platform-postgres
#   (its CNPG Cluster.spec.managed.roles[] entry references a Secret
#   it materialises in cnpg-system from Vault/GSM).
# - The DSN injected into the workload is sourced separately via the
#   ExternalSecret below, NOT from the CNPG-auto `<cluster>-<role>-app`
#   secret. CNPG writes that auto-secret only into cnpg-system, and K8s
#   secrets are namespace-scoped — workloads here can't reference it.
#   Instead we keep a parallel DSN string in Vault/GSM that ESO syncs
#   into this namespace as `<dsn.secretName>` with key `<dsn.secretKey>`.
# - The deployment's `migrations` initContainer applies
#   files/migrations/*.sql on every pod start, reading the same
#   in-namespace DSN secret. SQL files are idempotent (CREATE TABLE
#   IF NOT EXISTS / ADD COLUMN IF NOT EXISTS) so repeated application
#   is safe. This replaced a Helm post-install/post-upgrade hook
#   that didn't fire reliably under JX3's helmfile cascade.
#
# The Vault/GSM DSN password must match what leartech-platform-postgres
# uses for the role (same source key in their chart). No automatic
# rotation today — see auth-ui session's DSN guidance memo for details.
#
# Disabling the toggle (`postgresql.enabled: false`) makes the catalog
# endpoints return 503 and the agent falls back to filesystem-only YAML.
# Use that for previews or any cluster without CNPG.
postgresql:
  enabled: false # flip via configs/leartech-automated-agent.yaml on clusters with CNPG
  # DO NOT enable on preview deployments. Preview environments don't have the
  # leartech-staging CNPG cluster, the role won't exist, and the ExternalSecret
  # will 404 on the workload Vault/GSM path — pod CrashLoops on startup.
  # Long-lived staging is the only place this should be true.
  # Name of the existing shared CNPG cluster (provisioned outside this chart,
  # same one auth-service connects to). Per-service Database is owned by
  # this chart via the CR below.
  clusterName: leartech-staging
  databaseName: leartech_automated_agent
  # When true, the API Deployment renders an initContainer that applies
  # files/migrations/*.sql in lexical order on every pod start. The SQL
  # files are idempotent (IF NOT EXISTS) so repeated application is safe.
  # Replaced the prior Helm post-install/post-upgrade hook, which didn't
  # fire reliably under JX3's helmfile-based cascade.
  runMigrations: true
  # DSN secret materialised in this namespace by the ExternalSecret in
  # templates/externalsecret-postgres-db.yaml. Both the deployment and the
  # migrations-job read from these refs — change them and both follow.
  dsn:
    secretName: leartech-automated-agent-db
    secretKey: dsn
    # Per-cluster source paths. Active path is selected by the existing
    # externalSecrets.{gcp,azure}.enabled toggle. The DSN itself must
    # be pre-populated manually (see auth-ui session's bootstrap guide).
    gcp:
      # GSM key in `externalSecrets.gcp.projectId`. Flat string value.
      key: automated-agent-db-dsn
    azure:
      # KV-v2 path. The `/data/` segment is required by ESO's vault driver.
      key: secret/data/automated-agent/automated-agent-db
      property: dsn
# Phase D.2 — Job-per-run infrastructure. Enables the chart to render:
#   - ServiceAccount `<fullname>-job-runner` (spawned Job pods)
#   - ServiceAccount `<fullname>` (API pod — wired into deployment.yaml)
#   - Role + RoleBinding granting batch/jobs + pods + tekton.dev read
#   - Named template `leartech-automated-agent.job-spec` consumed by
#     job_runner.py (Phase D.3+) at Job-spawn time
#
# Disable on clusters that haven't migrated to Job-per-run yet — the chart
# stays backwards-compatible (no SA, deployment uses default SA, no Jobs).
jobs:
  enabled: true
  # Override the SA used by spawned Job pods. Empty means default to
  # `<fullname>-job-runner` (rendered by job-runner-serviceaccount.yaml).
  serviceAccountName: ""
  # Image used by spawned Job pods. release.yaml kaniko-pushes
  # `leartech-agent-runtime` to BOTH the cluster's home registry
  # (${PUSH_CONTAINER_REGISTRY}/${DOCKER_REGISTRY_ORG}) AND ghcr (backup).
  # When `defaultImage` is empty, deployment.yaml derives the registry from
  # `.Values.image.repository` — strip the API image's `/leartech-automated-agent`
  # suffix and append `/leartech-agent-runtime:{Chart.Version}`. The runtime
  # image therefore lives in the same registry as the API image (which is
  # already cluster-specific from GitOps config), so no separate per-cluster
  # registry override is needed. Phase E.1 per-language variants set
  # `defaultImage` explicitly to bypass the derivation.
  defaultImage: ""
  # Tag for E.1's per-language images (leartech-agent-py / -go / -ng / -rust).
  # These are built by leartech-dockerfiles with their OWN version stream
  # (e.g. 0.38.0) — NOT the agent chart version. Empty here means
  # deployment.yaml renders `latest` for LEARTECH_JOB_IMAGE_TAG so spawns
  # work out-of-the-box. Pin to a specific tag per cluster via GitOps when
  # immutability matters (e.g. "0.38.0").
  languageImageTag: ""
  # Image pull secret attached to the job-runner ServiceAccount. Every
  # spawned Job pod inherits this so private-registry pulls work without
  # per-pod imagePullSecrets plumbing. Cluster-default convention is
  # `tekton-container-registry-auth` (same secret Tekton tasks use).
  # Set to empty string to skip attaching (rare — only on clusters where
  # the registry doesn't need auth).
  imagePullSecretName: "tekton-container-registry-auth"
  # Default resources injected into the Job pod spec at spawn time.
  # Higher than API-pod defaults because initiative runs include Anthropic
  # SDK loops with substantial memory peaks (see resources comment above).
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4
      memory: 8Gi
  # Garbage-collect Jobs (and their Pods) this many seconds after they
  # reach a terminal state. 24 h gives humans a comfortable window to read
  # logs after a failed run before K8s cleans up.
  ttlSecondsAfterFinished: 86400
jxRequirements:
  ingress:
    domain: ""
    namespaceSubDomain: ""
