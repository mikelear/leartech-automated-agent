{{- /*
NetworkPolicy — BA agent pod egress lockdown.

Applies to pods carrying the label `leartech.io/component: ba-agent` (which
the Go controller stamps onto every Job pod spawned from the
`leartech-agent-ba` AgentType — see the AgentType manifest's `labels`
block, which the controller propagates onto pods it materialises).

## Threat model

The BA agent's ONLY legitimate egress destinations are:

  1. **leartech-ai-gateway** — every LLM call AND every web-research
     search/fetch flows through the gateway (metered, allowlisted, budget-
     capped). Web research is NOT a raw egress to `curl https://…`; the
     `leartech-ai-gateway-web` in-process MCP wraps it and POSTs to the
     same gateway `/v1/search` + `/v1/fetch` endpoints.
  2. **leartech-mcp-servers** — remote MCPs (`platform_state`,
     `control_plane`, `agent_api`, `pr_context`) the BA reads state from
     and authors plans through. All live behind the internal
     `leartech-mcp-servers` Service in the `leartech-mcp` namespace.
  3. **kube-apiserver** — the BA reads cluster state (Plans, AgentRuns,
     Deployments) via kubernetes-asyncio. The API server is reachable via
     `kubernetes.default.svc` on 443.
  4. **kube-dns** — DNS resolution for all of the above. Any pod that
     talks to a Service by name needs egress to CoreDNS on 53.

Everything else — the general internet, other tenant namespaces, the
Docker registries, etc. — is DENIED by policy. Any research request that
tries to bypass the gateway would fail at the CNI layer, not just at
gateway-policy layer. Defence in depth against a compromised or
misconfigured BA prompt.

## The absence of ingress rules

We omit the `ingress:` block entirely. The BA agent runs in a Job pod
that no other pod dials into — the Go controller watches Job status via
the k8s API, it doesn't hit the pod's ports directly. Omitting `ingress`
+ leaving `policyTypes: [Egress]` means K8s applies the CNI default
(namespace policy, typically deny) to inbound and this policy governs
outbound. If a future BA workflow ever needs to expose a port, add an
explicit `ingress:` block here — never remove `policyTypes: [Egress]`.

## Preview-safety

Gated on `.Values.baAgent.registerAgentType` +
`.Values.baAgent.networkPolicy.enabled` (both default off in previews;
staging flips them on). Previews that don't register the BA AgentType
also skip this policy — no orphan NetworkPolicy sits in a preview
namespace matching a label no pod ever wears.
*/}}
{{- if and .Values.baAgent.registerAgentType .Values.baAgent.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-ba-agent-egress
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: ba-agent
spec:
  podSelector:
    matchLabels:
      leartech.io/component: ba-agent
  policyTypes:
    - Egress
  egress:
    # 1. leartech-ai-gateway — every LLM + web search/fetch flows here.
    #    Both the API service (`leartech-ai-gateway.<ns>.svc:8080`) and
    #    any sidecars in the gateway pods are covered by the namespace +
    #    pod selector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.baAgent.networkPolicy.aiGatewayNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.baAgent.networkPolicy.aiGatewayPort }}
    # 2. leartech-mcp-servers — the BA agent's authoring + read MCPs.
    #    Same shape (namespace-scoped) so a future MCP pod added to the
    #    mcp namespace picks up policy automatically.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.baAgent.networkPolicy.mcpNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.baAgent.networkPolicy.mcpPort }}
    # 3. kube-apiserver — CIDR-based rule (Services can't select the
    #    apiserver endpoint reliably). CNI-agnostic and stable across
    #    both GKE and AKS. The `to.ipBlock` shape is standard NP.
    #    Standard Kubernetes-service CIDR block is small; if a cluster
    #    uses a non-default CIDR, override via
    #    `.Values.baAgent.networkPolicy.apiServerCIDR`.
    - to:
        - ipBlock:
            cidr: {{ .Values.baAgent.networkPolicy.apiServerCIDR | quote }}
      ports:
        - protocol: TCP
          port: 443
    # 4. kube-dns — every named egress needs DNS. Both TCP + UDP because
    #    CoreDNS supports both and clients pick per-query. The kube-system
    #    namespace selector matches whether CoreDNS or kube-dns is the
    #    resolver — the ports are identical.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
