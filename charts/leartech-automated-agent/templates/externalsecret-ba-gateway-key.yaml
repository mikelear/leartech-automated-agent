{{- /*
ExternalSecret — `leartech-ai-gateway-ba-key`.

Materialises the BA agent's OWN gateway virtual key into an in-namespace
Secret. Distinct from `leartech-ai-gateway-key` (which the API pod +
dev/infra Jobs share) so:

  - BA runs get their own metering row + budget cap in the gateway,
  - a BA `model_allowlist` change (e.g. pinning Opus 4.8, restricting to
    Claude only) doesn't affect other agents,
  - rotating the BA key doesn't force a redeploy of every service that
    references the shared key.

## Sources (per-cluster)

- **GCP** — GSM secret name `agent-ba-gateway-key`, flat string value
  containing the virtual key (`sk-lt-…`).
- **AZ (Vault KV-v2)** — path `secret/data/ai/agent-ba-gateway`, property
  `apiKey`.
- **ESO (external-secrets.io v1)** — falls out of the same source table
  keyed by the active backend, matching the existing pattern used by
  `externalsecret-admin-token.yaml`.

The materialised k8s Secret's key is `AI_GATEWAY_API_KEY` — same
provider-neutral name as `leartech-ai-gateway-key` uses. The BA
AgentType's `anthropicSecretName/Key` points here and the controller
builds the pod's `ANTHROPIC_API_KEY` env from it (the SDK contract).

## Preview-safety

Gated on `.Values.baAgent.externalSecret.enabled` (defaults to true when
the chart-level `.Values.externalSecrets.gcp/azure/eso.enabled` toggle is
also on). Preview releases that leave those cluster toggles off render no
ExternalSecret at all — the Secret is absent, and the BA pod's
secretKeyRef must be `optional: true` (controller-side, per the
AgentType manifest's comment block) to avoid CreateContainerConfigError.
Memory: `feedback_chart_secretref_must_be_optional_for_previews`.

Bootstrap (seeding the upstream value) is operator-side; the chart never
mints keys. Documented in ~/leartech/Hub/status/ai-gateway-ba-workstream.md.
*/}}
{{- if and .Values.baAgent.registerAgentType .Values.baAgent.externalSecret.enabled }}
{{- if .Values.externalSecrets.gcp.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.baAgent.secrets.aiGatewayKey.secretName }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: ba-agent
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.externalSecrets.gcp.projectId }}
  data:
    - name: {{ .Values.baAgent.secrets.aiGatewayKey.secretKey }}
      key: {{ .Values.baAgent.gcp.key }}
      version: latest
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- if .Values.externalSecrets.azure.enabled }}
---
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.baAgent.secrets.aiGatewayKey.secretName }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: ba-agent
spec:
  backendType: vault
  vaultMountPoint: {{ .Values.externalSecrets.azure.vaultMountPoint }}
  vaultRole: {{ .Values.externalSecrets.azure.vaultRole }}
  data:
    - name: {{ .Values.baAgent.secrets.aiGatewayKey.secretKey }}
      key: {{ .Values.baAgent.azure.key }}
      property: {{ .Values.baAgent.azure.property }}
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- if .Values.externalSecrets.eso.enabled }}
{{- $src := .Values.externalSecrets.eso.source | default "azure" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.baAgent.secrets.aiGatewayKey.secretName }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: ba-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.eso.storeName | default "leartech-secrets" }}
  target:
    name: {{ .Values.baAgent.secrets.aiGatewayKey.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          secret.jenkins-x.io/replica-source: "true"
  data:
    - secretKey: {{ .Values.baAgent.secrets.aiGatewayKey.secretKey }}
      remoteRef:
        key: {{ (index .Values.baAgent $src).key | trimPrefix "secret/data/" | replace "/" "-" }}
        {{- with (index .Values.baAgent $src).property }}
        property: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
