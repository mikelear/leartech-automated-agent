{{- /*
ExternalSecret for tekton-git.

Materialises the K8s Secret `tekton-git` (basic-auth, GitHub-enabled) in
this chart's namespace from the cluster's secret store. Enables the agent
service to clone/push private repos via gh / git inside its own pod.

Same toggleable pattern as externalsecret-ai-review-api-keys.yaml. Each
cluster's configs/<chart>.yaml decides whether to create it via
`tektonGit.create: true` (typical: AZ jx-staging where nothing else
materialises it). On clusters where another chart already owns it (e.g.
GCP jx-staging where leartech-ai-classifier creates one as a side-effect
of its eval cron), set `tektonGit.create: false` to avoid the
helm-release-ownership collision.

Long-term direction: ai-classifier should be refactored to use this same
pattern, then a single chart can own each tekton-git materialisation
explicitly. Until then this toggle keeps us out of conflict.
*/}}
{{- if and .Values.tektonGit.create (or (eq .Values.tektonGit.backend "gsm") (eq .Values.tektonGit.backend "vault")) }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: tekton-git
spec:
{{- if eq .Values.tektonGit.backend "gsm" }}
  backendType: gcpSecretsManager
  projectId: {{ .Values.tektonGit.gsm.projectId }}
  data:
    - name: password
      key: {{ .Values.tektonGit.gsm.key }}
      property: token
      version: latest
    - name: username
      key: {{ .Values.tektonGit.gsm.key }}
      property: username
      version: latest
{{- else if eq .Values.tektonGit.backend "vault" }}
  backendType: vault
  vaultMountPoint: {{ .Values.tektonGit.vault.mountPoint }}
  vaultRole: {{ .Values.tektonGit.vault.role }}
  data:
    - name: password
      key: {{ .Values.tektonGit.vault.key }}
      property: token  # Vault stores the PAT as `token`, not `password`. Matches the working jx-ns tekton-git ExternalSecret.
    - name: username
      key: {{ .Values.tektonGit.vault.key }}
      property: username
{{- end }}
  template:
    metadata:
      annotations:
        tekton.dev/git-0: "https://github.com"
      labels:
        secret.jenkins-x.io/replica-source: "true"
    type: kubernetes.io/basic-auth
{{- end }}
{{- if and .Values.tektonGit.create (eq .Values.tektonGit.backend "eso") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-git
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.tektonGit.eso.storeName | default "leartech-secrets" }}
  target:
    name: tekton-git
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          tekton.dev/git-0: "https://github.com"
        labels:
          secret.jenkins-x.io/replica-source: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.tektonGit.vault.key | trimPrefix "secret/data/" | replace "/" "-" }}
        property: token
    - secretKey: username
      remoteRef:
        key: {{ .Values.tektonGit.vault.key | trimPrefix "secret/data/" | replace "/" "-" }}
        property: username
{{- end }}
