{{- /*
ExternalSecret(s) materialising leartech-ai-gateway-key (the agent's LLM
credential — a gateway virtual key once the repoint is active) and any other
agent secrets in this chart's namespace.

Renamed from ai-review-api-keys as part of the ai-gateway migration so the
agent stops piggybacking ai-review's secret NAME and future sessions aren't
confused (docs/AI-GATEWAY-MIGRATION-PLAN.md "Naming"). The materialised k8s
key is AI_GATEWAY_API_KEY; the cloud SOURCE (externalSecrets.*.secrets[].key)
is unchanged for now and swaps to the virtual-key source at the GitOps cutover.

Mirrors leartech-auth-service's pattern: same chart, both clusters'
backends represented; each cluster's helmfile/configs/<chart>.yaml
toggles the right one with externalSecrets.gcp.enabled or
externalSecrets.azure.enabled.
*/}}
{{- if .Values.externalSecrets.gcp.enabled }}
{{- range .Values.externalSecrets.gcp.secrets }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  backendType: gcpSecretsManager
  projectId: {{ $.Values.externalSecrets.gcp.projectId }}
  data:
  {{- range .data }}
    - name: {{ .name }}
      key: {{ .key }}
      version: latest
  {{- end }}
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
---
{{- end }}
{{- end }}
{{- if .Values.externalSecrets.azure.enabled }}
{{- range .Values.externalSecrets.azure.secrets }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  backendType: vault
  vaultMountPoint: {{ $.Values.externalSecrets.azure.vaultMountPoint }}
  vaultRole: {{ $.Values.externalSecrets.azure.vaultRole }}
  data:
  {{- range .data }}
    - name: {{ .name }}
      key: {{ .key }}
      property: {{ .property }}
  {{- end }}
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
---
{{- end }}
{{- end }}
{{- if .Values.externalSecrets.eso.enabled }}
{{- $src := .Values.externalSecrets.eso.source | default "azure" }}
{{- range (index $.Values.externalSecrets $src).secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecrets.eso.storeName | default "leartech-secrets" }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          secret.jenkins-x.io/replica-source: "true"
  data:
  {{- range .data }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key | trimPrefix "secret/data/" | replace "/" "-" }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
  {{- end }}
---
{{- end }}
{{- end }}
