{{- if .Values.jobs.enabled }}
# Slice B: the API pod no longer spawns Jobs or scrapes pod logs — the Go control
# plane (leartech-orchestrator-controller) owns that. The API now:
#  1. creates + manages AgentRun CRs (POST creates, cancel deletes, the reconciler lists);
#  2. ensures the per-language AgentType (cluster-scoped) create-or-patch;
#  3. reads/patches Tekton PipelineRuns for the MCP tools (unchanged).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-agentruns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: agentrun-api
rules:
- apiGroups: ["agent.leartech.io"]
  resources: ["agentruns"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["agent.leartech.io"]
  resources: ["agentruns/status"]
  verbs: ["get"]
# Tekton read for MCP tools; PATCH on pipelineruns only (admin cleanup cancels
# superseded runs — Tekton cascades to taskruns).
- apiGroups: ["tekton.dev"]
  resources: ["pipelineruns", "taskruns"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["tekton.dev"]
  resources: ["pipelineruns"]
  verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-agentruns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: agentrun-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "leartech-automated-agent.fullname" . }}-agentruns
subjects:
- kind: ServiceAccount
  name: {{ include "leartech-automated-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
---
# AgentType is CLUSTER-scoped, so ensuring it needs a ClusterRole. The name is
# namespace-qualified so staging + every ephemeral PR preview get DISTINCT
# cluster-scoped names — no cross-install collision (same lesson as the
# controller's RBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-agenttypes-{{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: agentrun-api
rules:
- apiGroups: ["agent.leartech.io"]
  resources: ["agenttypes"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-agenttypes-{{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: agentrun-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "leartech-automated-agent.fullname" . }}-agenttypes-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "leartech-automated-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
