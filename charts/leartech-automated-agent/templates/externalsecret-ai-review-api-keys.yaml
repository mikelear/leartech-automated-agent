{{- /*
ExternalSecret materialising ai-review-api-keys in this chart's namespace.

Each cluster has its own backend store; both store the same logical values
(CLAUDE_API_KEY etc.) under different paths. The cluster-specific
jx-values.yaml in each GitOps repo sets `secrets.backend` to "gsm" (GCP)
or "vault" (AZ).

Pulls the same values ai-review uses — single source of truth per cluster.
See:
  - jx-build-cluster-gsm/charts/ai-inference-resources/templates/externalsecrets.yaml
  - jx-build-cluster-akv/charts/cluster-config/templates/externalsecret-ai-review.yaml
*/}}
{{- if eq .Values.secrets.backend "gsm" }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.anthropicApiKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.secrets.gsm.projectId }}
  data:
    - name: CLAUDE_API_KEY
      key: claude-api-key
      version: latest
  template:
    type: Opaque
{{- else if eq .Values.secrets.backend "vault" }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.anthropicApiKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
spec:
  backendType: vault
  vaultMountPoint: {{ .Values.secrets.vault.mountPoint }}
  vaultRole: {{ .Values.secrets.vault.role }}
  data:
    - name: CLAUDE_API_KEY
      key: secret/data/ai/claude
      property: apiKey
  template:
    type: Opaque
{{- end }}
