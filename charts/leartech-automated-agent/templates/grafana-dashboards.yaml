{{- /*
Grafana dashboards shipped WITH the agent chart so they version alongside the
agent and deploy into whatever namespace the chart runs in. Each dashboards/*.json
becomes a ConfigMap labelled `jenkins-x.io/grafana-dashboard`, which the cluster
Grafana's sidecar (searchNamespace: ALL) auto-imports — no per-cluster gitops
wiring. Same proven pattern as leartech-evm-network's chart. The dashboards query
the in-cluster Loki datasource (uid: loki) provisioned by the observability stack.

`.Files.Get` embeds the JSON verbatim (NOT Helm-templated) so Grafana's own
`{{label}}` legend syntax survives. Gated + folder-annotated like evm's.
*/}}
{{- if .Values.grafanaDashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leartech-automated-agent.fullname" $ }}-dashboard-{{ $name }}
  labels:
    jenkins-x.io/grafana-dashboard: "1"
    app.kubernetes.io/part-of: leartech-automated-agent
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # Group these under one Grafana folder (sidecar reads this annotation).
    grafana_folder: {{ $.Values.grafanaDashboards.folder | quote }}
data:
  {{ $name }}.json: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
