{{- /*
ExternalSecret materialising the admin-token Secret in this chart's namespace.

Phase B V2 plumbing — gates `POST /admin/cleanup`. The token value flows
from each cluster's central secret store (GSM on GCP, Vault on AZ) into
the in-namespace Secret name `.Values.adminToken.secretName`; deployment.yaml
mounts it via secretKeyRef with `optional: true` so previews on clusters
without the ESO toggle still start cleanly.

Same per-cluster toggle pattern as templates/externalsecret-postgres-db.yaml:
- materialisation is gated on `.Values.adminToken.enabled` AND the cluster's
  ESO backend (`externalSecrets.gcp.enabled` or `externalSecrets.azure.enabled`).
- Bootstrap (seeding the source value) is operator-side. The chart never
  creates the upstream entry. See the PR body of the
  chart-plumb-admin-token-env initiative for the exact `gcloud secrets
  create` / `vault kv put` commands.

Why not extend `externalSecrets.{gcp,azure}.secrets`? The list-iterator in
templates/externalsecret-ai-review-api-keys.yaml is shared across every
secret the chart needs simultaneously — it has no per-secret toggle. A
dedicated template gives admin-token its own enable/disable lever so an
operator can roll the chart out without materialising the secret yet
(deployment still works thanks to `optional: true`), then flip the toggle
once the upstream is seeded.

Memory: feedback_secret_materialization_pattern.
*/}}
{{- if .Values.adminToken.enabled }}
{{- if .Values.externalSecrets.gcp.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminToken.secretName }}
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.externalSecrets.gcp.projectId }}
  data:
    - name: {{ .Values.adminToken.secretKey }}
      key: {{ .Values.adminToken.gcp.key }}
      version: latest
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- if .Values.externalSecrets.azure.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminToken.secretName }}
spec:
  backendType: vault
  vaultMountPoint: {{ .Values.externalSecrets.azure.vaultMountPoint }}
  vaultRole: {{ .Values.externalSecrets.azure.vaultRole }}
  data:
    - name: {{ .Values.adminToken.secretKey }}
      key: {{ .Values.adminToken.azure.key }}
      property: {{ .Values.adminToken.azure.property }}
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- end }}
{{- if and .Values.adminToken.enabled .Values.externalSecrets.eso.enabled }}
{{- $src := .Values.externalSecrets.eso.source | default "azure" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminToken.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.eso.storeName | default "leartech-secrets" }}
  target:
    name: {{ .Values.adminToken.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          secret.jenkins-x.io/replica-source: "true"
  data:
    - secretKey: {{ .Values.adminToken.secretKey }}
      remoteRef:
        key: {{ (index .Values.adminToken $src).key | trimPrefix "secret/data/" | replace "/" "-" }}
        {{- with (index .Values.adminToken $src).property }}
        property: {{ . }}
        {{- end }}
{{- end }}
