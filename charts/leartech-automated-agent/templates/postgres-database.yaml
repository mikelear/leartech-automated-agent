{{/*
CNPG Database CR — provisions the `leartech_automated_agent` database
inside the shared `leartech-staging` CNPG cluster. The cluster itself
lives in cnpg-system; this Database CR is cross-namespace and CNPG
resolves it by cluster name alone.

The role + role password are owned by leartech-platform-postgres
(managed.roles[] on the Cluster). The DSN the workload reads is
materialised separately by templates/externalsecret-postgres-db.yaml
(NOT the CNPG-auto secret — see that template's comment for why).

Mirrors leartech-auth-service/templates/postgres-database.yaml.

Toggle: .Values.postgresql.enabled (default false) — so previews and
clusters without CNPG don't try to provision a Database CR they can't
reconcile.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
spec:
  cluster:
    name: {{ .Values.postgresql.clusterName }}
  name: {{ .Values.postgresql.databaseName }}
  owner: {{ .Values.postgresql.databaseName }}
{{- end }}
