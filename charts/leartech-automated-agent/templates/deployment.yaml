apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech-automated-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leartech-automated-agent.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.anthropicApiKey.secretName }}
              key: {{ .Values.secrets.anthropicApiKey.secretKey }}
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.ghToken.secretName }}
              key: {{ .Values.secrets.ghToken.secretKey }}
        - name: LEARTECH_REPO_ROOT
          value: {{ .Values.leartechRepoRoot | quote }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
