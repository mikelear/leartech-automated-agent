apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech-automated-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leartech-automated-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.jobs.enabled }}
      # Use the dedicated API ServiceAccount so the RoleBinding in
      # templates/job-runner-rbac.yaml grants `batch/jobs create` to THIS
      # pod (Phase D.3+ Job-per-run spawn primitive). Without this line the
      # pod would fall back to the namespace `default` SA, which the
      # RoleBinding does not target.
      serviceAccountName: {{ include "leartech-automated-agent.fullname" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if and .Values.postgresql.enabled .Values.postgresql.runMigrations }}
      # Phase D loose-end fix — schema migrations as an initContainer
      # instead of a Helm post-install/post-upgrade hook.
      #
      # Helm hooks don't fire reliably under JX3's helmfile-based apply
      # path: D.4's runtime+job_name migration (0003) didn't apply on
      # the first cascade and the API CrashLooped on a missing column
      # until manual `kubectl exec psql` recovered it. Running the
      # migrations as an initContainer means EVERY pod start re-applies
      # them — the SQL files are idempotent (CREATE TABLE IF NOT EXISTS
      # / ADD COLUMN IF NOT EXISTS) so repeated runs are safe and cheap.
      #
      # The ConfigMap with the .sql payload is rendered alongside this
      # Deployment by templates/migrations-configmap.yaml, gated on the
      # same toggle so disabling postgres skips both.
      initContainers:
      - name: migrations
        image: ghcr.io/cloudnative-pg/postgresql:17.2
        # psql is user-agnostic — UID 1000 from the pod-level
        # securityContext is fine; explicit here so the
        # `runAsNonRoot: true` admission check has no ambiguity.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        # DSN flows via the in-namespace Secret materialised by the
        # chart's ExternalSecret (Vault on AZ / GSM on GCP). Same
        # secret + key the main container reads — single source of
        # truth per cluster.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.dsn.secretName }}
              key: {{ .Values.postgresql.dsn.secretKey }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          # Wait for DB to accept connections — covers fresh-install
          # cases where CNPG is still provisioning the Database CR
          # alongside this pod's first rollout.
          for i in $(seq 1 60); do
            if psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            echo "[$(date -u +%H:%M:%S)] waiting for database (try $i/60)"
            sleep 5
          done
          # Apply migrations in lexical order. -1 wraps each file in a
          # single transaction so a partial apply rolls back cleanly.
          for f in /migrations/*.sql; do
            echo "==> applying $f"
            psql "$DATABASE_URL" -1 -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "==> migrations complete"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        # Downward API — agent's job_runner.py reads POD_NAMESPACE to know
        # which namespace to spawn Jobs into (D.4's Job-per-run path).
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # D.4.4: Job-pod image registry derived from the API image so no
        # per-cluster hardcoded registry default lives in the chart.
        # release.yaml kaniko-mirrors leartech-agent-runtime to the cluster's
        # home registry + ghcr; pulling URL is built by stripping the API
        # image's `/leartech-automated-agent` suffix and appending
        # `/leartech-agent-runtime:{Chart.Version}` to the prefix.
        # `.Values.jobs.defaultImage`, if set, wins outright — Phase E.1
        # will use it for per-language variants.
        - name: LEARTECH_INITIATIVE_DEFAULT_IMAGE
          value: {{ default (printf "%s/leartech-agent-runtime:%s" (trimSuffix "/leartech-automated-agent" .Values.image.repository) .Chart.Version) .Values.jobs.defaultImage | quote }}
        # E.1: language-aware image routing. The picker composes
        # `<prefix>/leartech-agent-<lang>:<tag>` at spawn time for runs
        # whose initiative carries a `language:` hint or whose primary
        # repo's root manifests reveal one. The prefix is derived from
        # the API image (same stripping rule as the default image above);
        # the tag is the Chart.Version so per-language images move
        # together with the API release. When either env is unset the
        # picker degrades to LEARTECH_INITIATIVE_DEFAULT_IMAGE.
        - name: LEARTECH_JOB_IMAGE_REGISTRY_PREFIX
          value: {{ trimSuffix "/leartech-automated-agent" .Values.image.repository | quote }}
        # Language images live in leartech-dockerfiles' own version stream
        # (e.g. leartech-agent-py:0.38.0), NOT the agent chart version. Default
        # to `latest` so spawns work out-of-the-box; pin via
        # `.Values.jobs.languageImageTag` in GitOps when reproducibility matters.
        - name: LEARTECH_JOB_IMAGE_TAG
          value: {{ default "latest" .Values.jobs.languageImageTag | quote }}
        {{- if .Values.agent.aiGateway.baseUrl }}
        # Gateway repoint (Phase 1). When set, the Claude Agent SDK + raw
        # `anthropic` SDK helpers send /v1/messages to leartech-ai-gateway
        # instead of api.anthropic.com — metered, budgeted, allowlisted,
        # centrally routed (same pattern the ai-review-worker already uses).
        # The `ANTHROPIC_API_KEY` secretKeyRef below then carries a gateway
        # VIRTUAL key (sk-lt-…), not a raw Anthropic key. Left unset →
        # direct-Anthropic (unchanged), so this is safe to merge before the
        # per-cluster GitOps overlay + ESO virtual-key secret land.
        # See AI-GATEWAY-AND-PORTABILITY.md + docs/AI-GATEWAY-MIGRATION-PLAN.md.
        - name: ANTHROPIC_BASE_URL
          value: {{ .Values.agent.aiGateway.baseUrl | quote }}
        {{- end }}
        # Env NAME is ANTHROPIC_API_KEY — fixed by the Anthropic / Claude Agent
        # SDK contract (the SDK reads exactly this name; renameable only in
        # Phase 3 when we own the runtime). Its VALUE is a gateway virtual key
        # once agent.aiGateway.baseUrl is set. The SOURCE secret is now
        # provider-neutral: leartech-ai-gateway-key / AI_GATEWAY_API_KEY.
        # `optional: true` so an ESO overlay-lag or a preview namespace without
        # the secret degrades to the code-level "ANTHROPIC_API_KEY not set"
        # guard rather than crashlooping the pod in CreateContainerConfigError
        # (memory: feedback_chart_secretref_must_be_optional_for_previews).
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.aiGatewayKey.secretName }}
              key: {{ .Values.secrets.aiGatewayKey.secretKey }}
              optional: true
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.ghToken.secretName }}
              key: {{ .Values.secrets.ghToken.secretKey }}
        # Forward the GH_TOKEN secret-NAME + KEY to spawned plan-runner Job
        # pods so the Job-spawn code in app/routers/initiatives.py can build
        # the Job pod's GH_TOKEN secretKeyRef from the live values instead of
        # falling back to its hardcoded `tekton-git/password` default. Mirrors
        # the leartech-orchestrator chart's pattern. Without this, the per-bot
        # identity (LeartechAgentBot) plumbed in `secrets.ghToken` only lands
        # in the API pod — spawned Job pods would still auth as the universal
        # pipeline bot via tekton-git.
        - name: LEARTECH_JOB_GH_TOKEN_SECRET_NAME
          value: {{ .Values.secrets.ghToken.secretName | quote }}
        - name: LEARTECH_JOB_GH_TOKEN_SECRET_KEY
          value: {{ .Values.secrets.ghToken.secretKey | quote }}
        {{- if .Values.adminToken.enabled }}
        # Phase B (B.3+B.4) V2: admin-token gate for POST /admin/cleanup.
        # When `.Values.adminToken.enabled` (default: true) the env is
        # rendered with `optional: true` — the Secret is materialised by
        # templates/externalsecret-admin-token.yaml only on clusters whose
        # ESO toggle is on. `optional: true` is MANDATORY: without it
        # preview namespaces (jx-<repo>-pr-<N>) get stuck in
        # CreateContainerConfigError because no ExternalSecret materialises
        # the referenced Secret in their isolated namespace.
        # Memory: feedback_chart_secretref_must_be_optional_for_previews.
        #
        # When the Secret is absent the env stays unset and
        # `_check_admin_token` falls into the closed-by-default 401 branch
        # — admin endpoints reject every request until a cluster actually
        # has the secret materialised. Operator + GitOps PRs (out of band)
        # flip on the per-cluster externalSecrets toggle to make it active.
        - name: LEARTECH_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adminToken.secretName }}
              key: {{ .Values.adminToken.secretKey }}
              optional: true
        {{- end }}
        - name: LEARTECH_REPO_ROOT
          value: {{ .Values.leartechRepoRoot | quote }}
        # V5 D2.1 — threshold for the stale-progress detector in
        # gate/agent/run_driver.py::detect_pod_stuck_image_pull. See the
        # values.yaml entry for the full rationale; default 600s, lowered
        # to 60s in preview-deploy integration tests.
        {{- if .Values.agent.staleProgressThresholdSeconds }}
        - name: STALE_PROGRESS_THRESHOLD_S
          value: {{ .Values.agent.staleProgressThresholdSeconds | quote }}
        {{- end }}
        - name: VERSION
          value: {{ .Chart.Version | quote }}
        {{- if .Values.agent.model }}
        - name: LEARTECH_AGENT_MODEL
          value: {{ .Values.agent.model | quote }}
        {{- end }}
        # OIDC bearer validation (v7-P1 step 2, hardened to permanent by C1
        # 2026-07). Auth is ALWAYS on — every cluster + preview boots
        # fail-closed; the former `agent.auth.enabled`/`required` toggles were
        # removed once C1 made anonymous mode dead everywhere. Issuer is shared
        # Hydra (same as orchestrator); audience is agent-specific (different
        # from orchestrator's so a token issued for one service can't be
        # replayed at the other). The middleware still defaults fail-closed in
        # code, so this is belt-and-braces.
        - name: LEARTECH_AUTH_REQUIRED
          value: "true"
        {{- if .Values.agent.auth.issuer }}
        - name: LEARTECH_AUTH_ISSUER
          value: {{ .Values.agent.auth.issuer | quote }}
        {{- end }}
        {{- if .Values.agent.auth.audience }}
        - name: LEARTECH_AUTH_AUDIENCE
          value: {{ .Values.agent.auth.audience | quote }}
        {{- end }}
        {{- if .Values.agent.auth.tenantClaim }}
        - name: LEARTECH_AUTH_TENANT_CLAIM
          value: {{ .Values.agent.auth.tenantClaim | quote }}
        {{- end }}
        {{- if .Values.agent.auth.jwksTtlSeconds }}
        - name: LEARTECH_AUTH_JWKS_TTL
          value: {{ .Values.agent.auth.jwksTtlSeconds | quote }}
        {{- end }}
        {{- if .Values.postgresql.enabled }}
        # DB-backed initiative catalog DSN — flows from the in-namespace
        # Secret materialised by templates/externalsecret-postgres-db.yaml
        # (sourced from Vault/GSM, not the CNPG-auto secret which lives in
        # cnpg-system and can't be referenced cross-namespace). App startup
        # reads this env var via app/db.is_db_enabled(); absence triggers
        # filesystem-only mode.
        - name: LEARTECH_INITIATIVE_DB_DSN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.dsn.secretName }}
              key: {{ .Values.postgresql.dsn.secretKey }}
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: workspace
          mountPath: {{ .Values.leartechRepoRoot | quote }}
      volumes:
      - name: workspace
        emptyDir: {}
      {{- if and .Values.postgresql.enabled .Values.postgresql.runMigrations }}
      # Mounted into the `migrations` initContainer above. Same lifecycle
      # gate so disabling postgres elides both the volume and the
      # initContainer cleanly.
      - name: migrations
        configMap:
          name: {{ .Release.Name }}-migrations
      {{- end }}
