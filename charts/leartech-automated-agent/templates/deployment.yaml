apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech-automated-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leartech-automated-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.jobs.enabled }}
      # Use the dedicated API ServiceAccount so the RoleBinding in
      # templates/job-runner-rbac.yaml grants `batch/jobs create` to THIS
      # pod (Phase D.3+ Job-per-run spawn primitive). Without this line the
      # pod would fall back to the namespace `default` SA, which the
      # RoleBinding does not target.
      serviceAccountName: {{ include "leartech-automated-agent.fullname" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if and .Values.postgresql.enabled .Values.postgresql.runMigrations }}
      # Phase D loose-end fix — schema migrations as an initContainer
      # instead of a Helm post-install/post-upgrade hook.
      #
      # Helm hooks don't fire reliably under JX3's helmfile-based apply
      # path: D.4's runtime+job_name migration (0003) didn't apply on
      # the first cascade and the API CrashLooped on a missing column
      # until manual `kubectl exec psql` recovered it. Running the
      # migrations as an initContainer means EVERY pod start re-applies
      # them — the SQL files are idempotent (CREATE TABLE IF NOT EXISTS
      # / ADD COLUMN IF NOT EXISTS) so repeated runs are safe and cheap.
      #
      # The ConfigMap with the .sql payload is rendered alongside this
      # Deployment by templates/migrations-configmap.yaml, gated on the
      # same toggle so disabling postgres skips both.
      initContainers:
      - name: migrations
        image: ghcr.io/cloudnative-pg/postgresql:17.2
        # psql is user-agnostic — UID 1000 from the pod-level
        # securityContext is fine; explicit here so the
        # `runAsNonRoot: true` admission check has no ambiguity.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        # DSN flows via the in-namespace Secret materialised by the
        # chart's ExternalSecret (Vault on AZ / GSM on GCP). Same
        # secret + key the main container reads — single source of
        # truth per cluster.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.dsn.secretName }}
              key: {{ .Values.postgresql.dsn.secretKey }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          # Wait for DB to accept connections — covers fresh-install
          # cases where CNPG is still provisioning the Database CR
          # alongside this pod's first rollout.
          for i in $(seq 1 60); do
            if psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            echo "[$(date -u +%H:%M:%S)] waiting for database (try $i/60)"
            sleep 5
          done
          # Apply migrations in lexical order. -1 wraps each file in a
          # single transaction so a partial apply rolls back cleanly.
          for f in /migrations/*.sql; do
            echo "==> applying $f"
            psql "$DATABASE_URL" -1 -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "==> migrations complete"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        # Downward API — agent's job_runner.py reads POD_NAMESPACE to know
        # which namespace to spawn Jobs into (D.4's Job-per-run path).
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Phase F: runtime is always 'job' now (in-code constant); the env
        # var is rendered for observability + back-compat with any operator
        # tooling that reads it, but it no longer influences the spawn path.
        # Empty/unset is fine — the code ignores it.
        {{- if .Values.agent.runtime }}
        - name: LEARTECH_INITIATIVE_RUNTIME
          value: {{ .Values.agent.runtime | quote }}
        {{- end }}
        # D.4.4: Job-pod image registry derived from the API image so no
        # per-cluster hardcoded registry default lives in the chart.
        # release.yaml kaniko-mirrors leartech-agent-runtime to the cluster's
        # home registry + ghcr; pulling URL is built by stripping the API
        # image's `/leartech-automated-agent` suffix and appending
        # `/leartech-agent-runtime:{Chart.Version}` to the prefix.
        # `.Values.jobs.defaultImage`, if set, wins outright — Phase E.1
        # will use it for per-language variants.
        - name: LEARTECH_INITIATIVE_DEFAULT_IMAGE
          value: {{ default (printf "%s/leartech-agent-runtime:%s" (trimSuffix "/leartech-automated-agent" .Values.image.repository) .Chart.Version) .Values.jobs.defaultImage | quote }}
        # E.1: language-aware image routing. The picker composes
        # `<prefix>/leartech-agent-<lang>:<tag>` at spawn time for runs
        # whose initiative carries a `language:` hint or whose primary
        # repo's root manifests reveal one. The prefix is derived from
        # the API image (same stripping rule as the default image above);
        # the tag is the Chart.Version so per-language images move
        # together with the API release. When either env is unset the
        # picker degrades to LEARTECH_INITIATIVE_DEFAULT_IMAGE.
        - name: LEARTECH_JOB_IMAGE_REGISTRY_PREFIX
          value: {{ trimSuffix "/leartech-automated-agent" .Values.image.repository | quote }}
        # Language images live in leartech-dockerfiles' own version stream
        # (e.g. leartech-agent-py:0.38.0), NOT the agent chart version. Default
        # to `latest` so spawns work out-of-the-box; pin via
        # `.Values.jobs.languageImageTag` in GitOps when reproducibility matters.
        - name: LEARTECH_JOB_IMAGE_TAG
          value: {{ default "latest" .Values.jobs.languageImageTag | quote }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.anthropicApiKey.secretName }}
              key: {{ .Values.secrets.anthropicApiKey.secretKey }}
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.ghToken.secretName }}
              key: {{ .Values.secrets.ghToken.secretKey }}
        {{- if and .Values.secrets.adminToken.secretName .Values.secrets.adminToken.secretKey }}
        # Phase B (B.3+B.4): admin-token gate for POST /admin/cleanup.
        # When both secretName + secretKey are set the env is rendered
        # and the endpoint authenticates against it. Empty values (the
        # safe default) skip the env entirely, so the endpoint's
        # `_check_admin_token` falls into the "auth not configured" 401
        # branch — closed by default until the materialising Secret
        # exists on this cluster.
        - name: LEARTECH_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.adminToken.secretName }}
              key: {{ .Values.secrets.adminToken.secretKey }}
        {{- end }}
        - name: LEARTECH_REPO_ROOT
          value: {{ .Values.leartechRepoRoot | quote }}
        - name: VERSION
          value: {{ .Chart.Version | quote }}
        {{- if .Values.agent.model }}
        - name: LEARTECH_AGENT_MODEL
          value: {{ .Values.agent.model | quote }}
        {{- end }}
        {{- if .Values.postgresql.enabled }}
        # DB-backed initiative catalog DSN — flows from the in-namespace
        # Secret materialised by templates/externalsecret-postgres-db.yaml
        # (sourced from Vault/GSM, not the CNPG-auto secret which lives in
        # cnpg-system and can't be referenced cross-namespace). App startup
        # reads this env var via app/db.is_db_enabled(); absence triggers
        # filesystem-only mode.
        - name: LEARTECH_INITIATIVE_DB_DSN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.dsn.secretName }}
              key: {{ .Values.postgresql.dsn.secretKey }}
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: workspace
          mountPath: {{ .Values.leartechRepoRoot | quote }}
      volumes:
      - name: workspace
        emptyDir: {}
      {{- if and .Values.postgresql.enabled .Values.postgresql.runMigrations }}
      # Mounted into the `migrations` initContainer above. Same lifecycle
      # gate so disabling postgres elides both the volume and the
      # initContainer cleanly.
      - name: migrations
        configMap:
          name: {{ .Release.Name }}-migrations
      {{- end }}
