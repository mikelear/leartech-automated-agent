{{- if .Values.jobs.enabled }}
# ServiceAccount used by initiative-runner Job pods spawned by job_runner.py
# (Phase D.3+). One SA per chart release, shared across all initiative Jobs
# in the namespace. RBAC granting batch/jobs + pods + tekton.dev read is in
# templates/job-runner-rbac.yaml (same release-name basis).
#
# Phase D.2 (this chart) provisions the SA + RBAC so D.3's job_runner.py
# only needs to write the spawn primitive — the cluster surface is ready.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}-job-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: job-runner
---
# ServiceAccount used by the API pod (Deployment). Bound as a second
# subject in the job-runner RoleBinding so the API process can spawn
# initiative Jobs via the Kubernetes batch API. Previously the API pod
# used the namespace `default` SA — explicit SA is cleaner for audit and
# lets RBAC target only the API pod, not every workload in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leartech-automated-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: api
{{- end }}
