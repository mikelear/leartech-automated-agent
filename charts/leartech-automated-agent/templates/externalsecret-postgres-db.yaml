{{- /*
ExternalSecret materialising the Postgres DSN in this chart's namespace.

Pulled from GSM (GCP) / Vault (AZ) by the same per-cluster toggle the
chart uses for ai-review-api-keys. The DSN value carries the role
password embedded — that password MUST match what
`leartech-platform-postgres` uses for its CNPG managed.roles[] entry,
otherwise the workload connects but auth fails. No auto-rotation today;
both sources are populated manually during bootstrap.

Why not the CNPG-auto secret? CNPG writes its `<cluster>-<role>-app`
secret into cnpg-system (the cluster's namespace). K8s Secrets are
namespace-scoped — a Deployment in jx-staging cannot reference a Secret
in cnpg-system. The standard leartech pattern (auth-service precedent)
is to keep a parallel DSN in the central secret store and let ESO sync
it locally. The CNPG-auto secret stays unused.

Gated on .Values.postgresql.enabled — the same toggle that activates
the Database CR, migrations-job, and the deployment env-from-secret
reference. Disabling all four together leaves no dangling references.
*/}}
{{- if .Values.postgresql.enabled }}
{{- if .Values.externalSecrets.gcp.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.dsn.secretName }}
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.externalSecrets.gcp.projectId }}
  data:
    - name: {{ .Values.postgresql.dsn.secretKey }}
      key: {{ .Values.postgresql.dsn.gcp.key }}
      version: latest
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- if .Values.externalSecrets.azure.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.dsn.secretName }}
spec:
  backendType: vault
  vaultMountPoint: {{ .Values.externalSecrets.azure.vaultMountPoint }}
  vaultRole: {{ .Values.externalSecrets.azure.vaultRole }}
  data:
    - name: {{ .Values.postgresql.dsn.secretKey }}
      key: {{ .Values.postgresql.dsn.azure.key }}
      property: {{ .Values.postgresql.dsn.azure.property }}
  template:
    type: Opaque
    metadata:
      labels:
        secret.jenkins-x.io/replica-source: "true"
{{- end }}
{{- end }}
