{{/*
Postgres schema migrations Helm hook.

Runs as `post-install,post-upgrade` (after the Database CR is applied +
CNPG provisions the database + the in-namespace DSN Secret is
materialised by the ExternalSecret in this chart). The container polls
the DSN until reachable, then pipes files/migrations/*.sql through psql
in lexical order. CREATE TABLE IF NOT EXISTS makes it idempotent.

Gated on .Values.postgresql.enabled AND .Values.postgresql.runMigrations
— same toggle that flips on the DB endpoints. Disabling either skips the
hook entirely.

Mirrors leartech-auth-service/templates/migrations-job.yaml. Schema files
in files/migrations/ are the authoritative source — to add a migration,
drop a new `NNNN_<name>.sql` next to 0001_initial.sql.
*/}}
{{- if and .Values.postgresql.enabled .Values.postgresql.runMigrations }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $path, $_ := .Files.Glob "files/migrations/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: psql
        image: ghcr.io/cloudnative-pg/postgresql:17.2
        env:
        # DSN flows via the in-namespace Secret materialised by the chart's
        # ExternalSecret (Vault on AZ / GSM on GCP). Same secret + key the
        # main Deployment reads — single source of truth per cluster.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.dsn.secretName }}
              key: {{ .Values.postgresql.dsn.secretKey }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          # Wait for DB to accept connections (CNPG provisions Database asynchronously
          # alongside this Job at hook time).
          for i in $(seq 1 60); do
            if psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            echo "[$(date -u +%H:%M:%S)] waiting for database (try $i/60)"
            sleep 5
          done
          # Apply migrations in lexical order. Each is wrapped in BEGIN/COMMIT
          # via psql's -1 single-transaction mode for atomicity per file.
          for f in /migrations/*.sql; do
            echo "==> applying $f"
            psql "$DATABASE_URL" -1 -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "==> migrations complete"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      volumes:
      - name: migrations
        configMap:
          name: {{ .Release.Name }}-migrations
{{- end }}
