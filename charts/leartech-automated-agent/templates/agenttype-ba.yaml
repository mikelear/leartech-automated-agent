{{- /*
AgentType manifest — `leartech-agent-ba`.

Registers the BA (Business Analyst) agent as a first-class AgentType so a
Plan step with `agentType: leartech-agent-ba` spawns the BA agent's Python
entrypoint (`gate.agent.ba_agent.main`) inside a per-run K8s Job. The Go
control-plane controller (`leartech-orchestrator-controller`) reads this
resource and builds the Job pod spec at AgentRun-create time.

## Shape mirrors leartech-agent-infra

Same pattern as the infra AgentType: reuse the shared `leartech-agent-py`
runtime image (Dockerfile.runtime, per-language variant built by
`leartech-dockerfiles`) and override the container entrypoint to the BA-
specific role. Nothing else about the base image changes — Python venv, uv,
gh, git, kubectl, ffmpeg are already baked in.

The initiative's *goal* line:

    image = the agent-py image, entrypoint override = ba_agent

## Cluster-scoped resource — install ONCE per cluster

AgentType is a cluster-scoped CR (see
tests/testdata/crds/agent.leartech.io_agenttypes.yaml). Multiple Helm
releases in the same cluster (staging + each PR preview namespace) would
otherwise CONFLICT on the resource name. We gate rendering on
`.Values.baAgent.registerAgentType` (default false, so previews stay clean)
and flip it to `true` only on the ONE canonical release per cluster
(typically staging, via `configs/leartech-automated-agent.yaml` in the
cluster's GitOps repo).

## Secret refs / preview safety

The BA pod's LLM credential flows via the CRD's `anthropicSecretName` +
`anthropicSecretKey` fields (whose k8s env-var contract is fixed to
`ANTHROPIC_API_KEY` by the Anthropic / Claude Agent SDK — see
docs/AI-GATEWAY-MIGRATION-PLAN.md "Naming"). The controller's Job-spec
builder is responsible for stamping `optional: true` on the resulting
secretKeyRef so a preview cluster (whose ESO backend hasn't materialised
`leartech-ai-gateway-ba-key`) doesn't CrashLoop with
CreateContainerConfigError. This is the same
`feedback_chart_secretref_must_be_optional_for_previews` invariant the API
deployment already honours via literal `optional: true` markers.

## Env plumbed here (non-secret, dict[string]string per CRD)

- ANTHROPIC_BASE_URL: the in-cluster ai-gateway. Every LLM call the BA agent
  makes flows through it (metered + governed + allowlisted). Same pattern
  the ai-review-worker already runs on and the API pod uses when
  `.Values.agent.aiGateway.baseUrl` is set.
- LEARTECH_BA_AGENT_MODEL: logical model name (the gateway resolves the
  provider). Defaults to `claude` here so a `model_allowlist` rotation on
  the virtual key can pick the concrete Claude backend without a chart
  bump. The BA module code pins Opus as a floor when unset, so `claude`
  here is a config-not-code choice.

## Web research through the gateway (defence in depth vs. blanket egress)

The BA agent's web-research surface is the `leartech-ai-gateway-web`
in-process MCP (see `gate.mcp_servers.ai_gateway_web_server`), which POSTs
`/v1/search` and `/v1/fetch` at the same gateway URL wired below. Together
with `templates/networkpolicy-ba.yaml` (which restricts BA pod egress to
gateway + internal MCP + k8s API only), this means blanket internet access
never leaves the cluster: search/fetch flow through the gateway which
enforces the same tenant + allowlist rules as LLM calls.
*/}}
{{- if .Values.baAgent.registerAgentType }}
apiVersion: agent.leartech.io/v1alpha1
kind: AgentType
metadata:
  name: leartech-agent-ba
  labels:
    {{- include "leartech-automated-agent.labels" . | nindent 4 }}
    leartech.io/component: ba-agent
    # Track which release last claimed this cluster-scoped resource so an
    # operator eyeballing `kubectl get at leartech-agent-ba -o yaml` can
    # trace it back to the responsible Helm release without spelunking.
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  # Image = the per-language `leartech-agent-py` runtime, composed the same
  # way `LEARTECH_INITIATIVE_DEFAULT_IMAGE` is in deployment.yaml. Explicit
  # override via `.Values.baAgent.image` wins if set (e.g. pinning a
  # specific rc build). Otherwise: strip the API image's
  # `/leartech-automated-agent` suffix and append `/leartech-agent-py:<tag>`.
  # Tag defaults to `.Values.jobs.languageImageTag` (chart-wide agent-py
  # pin) so BA + infra + dev agents move together.
  image: {{ default (printf "%s/leartech-agent-py:%s" (trimSuffix "/leartech-automated-agent" .Values.image.repository) (default "latest" .Values.jobs.languageImageTag)) .Values.baAgent.image | quote }}
  # Entrypoint override — run the BA module directly. Mirrors the
  # leartech-agent-infra pattern (`python -m gate.agent.infra_agent`); no
  # extra pyproject console-script entry needed because the module already
  # has an `if __name__ == '__main__': main()` guard.
  entrypoint:
    - python
    - -m
    - gate.agent.ba_agent
  # The CRD spec has dedicated fields for the LLM credential secret — the
  # controller builds the pod's `ANTHROPIC_API_KEY` secretKeyRef from these.
  # Point them at the BA-specific gateway virtual key (its own secret so
  # rotation / model-allowlist changes don't ripple into other agents).
  anthropicSecretName: {{ .Values.baAgent.secrets.aiGatewayKey.secretName | quote }}
  anthropicSecretKey: {{ .Values.baAgent.secrets.aiGatewayKey.secretKey | quote }}
  # ServiceAccount the spawned BA Job pod runs as. Defaults to the shared
  # job-runner SA (which has the read-only RBAC the BA needs to list plans
  # / runs via the k8s API). Override via GitOps when a per-agent SA is
  # provisioned with its own trust-boundary.
  serviceAccountName: {{ default (printf "%s-job-runner" (include "leartech-automated-agent.fullname" .)) .Values.baAgent.serviceAccountName | quote }}
  env:
    # Gateway repoint — every LLM call from this pod goes through the
    # in-cluster ai-gateway (same URL the API pod uses when
    # `.Values.agent.aiGateway.baseUrl` is set). Hardcoded to the internal
    # in-cluster URL so the value doesn't need to be re-plumbed per cluster;
    # override via `.Values.baAgent.aiGateway.baseUrl` if a cluster ever
    # runs the gateway under a different name/port.
    ANTHROPIC_BASE_URL: {{ .Values.baAgent.aiGateway.baseUrl | quote }}
    # Logical model name — the gateway's virtual key resolves this against
    # its `model_allowlist` at request time. Default `claude` lets the
    # gateway pick the current-best Claude backend without a chart bump;
    # pin explicitly (e.g. `claude-opus-4-8`) via GitOps when
    # reproducibility matters.
    LEARTECH_BA_AGENT_MODEL: {{ .Values.baAgent.model | quote }}
    # Cluster identity — surfaces in obslog / retrospect output so a run's
    # provenance is unambiguous.
    CLUSTER: {{ .Values.baAgent.cluster | default (env "CLUSTER") | default "unknown" | quote }}
    # Version stamp — matches the chart release so a BA run's logs
    # cross-reference the exact agent-image lineage.
    VERSION: {{ .Chart.Version | quote }}
  {{- with .Values.baAgent.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.baAgent.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.baAgent.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
{{- end }}
