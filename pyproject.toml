[project]
name = "leartech-automated-agent"
version = "0.2.0"
description = "Criteria-driven agent runner for leartech — deployed as a long-running FastAPI service exposing initiative + lessons APIs. Mirrors the leartech-ai-classifier pattern."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "claude-agent-sdk>=0.1.72",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    # GCS client, baked into the runtime venv so it is inherited by EVERY agent
    # image (go/ng/rust/py are all FROM the runtime base) with no per-language
    # install. Consumes GOOGLE_APPLICATION_CREDENTIALS (materialised by
    # gate.agent.gcp_credentials) so an agent told to read a private gs://
    # artifact uses `python3 -c "from google.cloud import storage"`
    # deterministically instead of pip-installing it mid-run (fragile: needs
    # egress, silently degradable) — observed on the first artifact-driven plan.
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
    # Standard MCP client/server library — the agent's stdio↔http MCP bridge
    # (gate/mcp_servers/stdio_bridge.py) imports it directly. Already resolved
    # transitively via claude-agent-sdk; pinned explicitly now that we own an
    # MCP client (Phase 2, provider-portability direction).
    "mcp>=1.20",
    "kubernetes-asyncio~=32.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "bandit>=1.7",
    "mypy>=1.13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-json-report>=1.5",
    "coverage>=7.4",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0",
    "aiosqlite>=0.22.1",
    "jsonschema>=4.20",  # CRD-contract test (tests/test_agentrun_crd_contract.py)
]

[project.scripts]
gate = "gate.cli:main"
agent = "gate.agent.main:main"
initiative = "gate.agent.initiative:main"
lessons = "gate.agent.lessons.cli:main"
leartech-agent = "app.agent_cli.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".lighthouse", "charts", "preview"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S", "N"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's canonical idiom is ``Depends(...)`` / ``Query(...)`` etc. as
# argument defaults — the framework interprets the "call" as a dependency
# marker, not a live invocation. Marking them immutable-in-defaults quiets
# the B008 false positive without disabling the rule globally (real B008
# hits — like ``arg: list = []`` — still surface).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S603", "S607"]  # S105/S106/S107: fake tokens/secrets in test fixtures/helpers are not real credentials
"gate/criteria/**/*" = ["S101"]
"gate/tools/*" = ["S603", "S607"]
"gate/cli.py" = ["S603", "S607"]
"gate/mcp_servers/*" = ["S603", "S607"]
"gate/agent/initiative.py" = ["S603", "S607"]  # shells out to `gh repo clone` for cluster-mode consumer-repo bootstrap
"app/routers/initiatives.py" = ["S603", "S607"]  # shells out to `gh api` for Phase E.1 language detection
"gate/admin/cleanup.py" = ["S603", "S607"]  # shells out to `gh api` for PR HEAD lookup (Phase B.4)
"gate/agent/job_reconciler.py" = ["S603", "S607"]  # shells out to `gh pr list` for D.5.1.1 PR fallback lookup
"app/main.py" = ["S104"]
# Operator CLI deliberately shells out to mmdc / pbcopy for Mermaid rendering.
"app/agent_cli/*" = ["S108", "S603", "S607"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# kubernetes-asyncio ships no type stubs (issue #146 upstream). Without
# this override, every import of `kubernetes_asyncio.{client,config}`
# trips mypy strict's `ignore_missing_imports`-equivalent. Same pattern
# leartech-ai-classifier uses for the kubernetes sync client.
[[tool.mypy.overrides]]
module = ["kubernetes_asyncio.*"]
ignore_missing_imports = true

# prompt_toolkit ships type info as `py.typed` only in 3.0.50+; older
# versions (pinned via uv.lock at run time) trip the import-not-found
# check. The CLI's chat REPL uses just two symbols and we wrap them
# behind a thin facade in `commands/chat.py`, so silencing the imports
# costs nothing.
[[tool.mypy.overrides]]
module = ["prompt_toolkit", "prompt_toolkit.*"]
ignore_missing_imports = true

# python-jose ships type stubs as `types-python-jose` in a separate dist,
# but their JWT helpers' overloads are loose; the strict-mode wrapper in
# app/auth/middleware.py narrows the call sites we use, so silencing the
# imports avoids dragging in another dev-only dep just for strict mypy.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

# The stdio MCP bridge uses the low-level `mcp` Server decorators
# (@server.list_tools / @server.call_tool). Those decorators aren't typed to
# mypy-strict's satisfaction (untyped decorator + untyped call), which would
# otherwise force noisy per-line ignores. Scope the relaxation to that one
# module; the rest of the file stays strict.
[[tool.mypy.overrides]]
module = ["gate.mcp_servers.stdio_bridge"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
# The generic downstream helper (_with_downstream runs an untyped op(session))
# returns Any; the typed call sites are correct by construction.
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["gate/criteria", "tests"]
addopts = "--tb=short -ra"
asyncio_mode = "auto"
markers = [
    "shared: cross-cutting criteria applied to every repo",
    "unit: tier 1 — language-native unit tests",
    "integration: tier 2 — mock-based integration tests",
    "e2e: tier 3 — end2end/run.sh style scripts",
    "playwright: tier 4 — UI browser tests with artifact analysis",
    "dashboards: opt-in dashboard↔Loki contract test (needs live Loki; gated by LOKI_ENABLE_DASHBOARD_CONTRACT_TEST=1)",
]

[tool.coverage.run]
# Branch coverage is enabled so the D3 state-machine gate (in
# `scripts/check_state_machine_coverage.py`) can read per-file branch
# rates from `coverage.xml`. Existing global gate (`fail_under` below)
# is recalibrated to account for branch denominators.
branch = true
source = ["gate", "app"]
omit = [
    "gate/criteria/*",
    "gate/cli.py",
    "gate/mcp_servers/*",
    # D3: keep `gate/agent/job_reconciler.py` and `gate/agent/job_runner.py`
    # measured — these are the V5-D1/D2 state-machine modules gated by
    # the per-file coverage check. Other `gate/agent/*` files are
    # orchestration paths exercised via integration, not unit-tested,
    # so they stay omitted.
    "gate/agent/__init__.py",
    "gate/agent/calibrations/*",
    "gate/agent/crash_sticky.py",
    "gate/agent/initiative.py",
    "gate/agent/initiative_prompt.py",
    "gate/agent/lessons/*",
    "gate/agent/main.py",
    "gate/agent/mcp_catalog.py",
    "gate/agent/self_retrospect.py",
    "gate/agent/step_failure_diagnosis.py",
    "gate/agent/system_prompt.py",
    "gate/initiatives/loader.py",
    "tests/*",
]

[tool.coverage.report]
# Global floor — independent of the per-file state-machine gate
# (85/70) enforced by `scripts/check_state_machine_coverage.py`.
fail_under = 60
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "app"]

[tool.bandit]
# SAST gate (medium+ severity in the pipeline). Tests excluded; the two B108
# hardcoded-/tmp findings are intentional service-internal paths, suppressed
# inline with # nosec + justification.
exclude_dirs = ["tests"]

