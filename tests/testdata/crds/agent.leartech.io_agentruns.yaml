---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentruns.agent.leartech.io
spec:
  group: agent.leartech.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentType
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.iteration
      name: Iter
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is one job-spawned agent run of an AgentType.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentRunSpec is the desired state for one agent run.

              JOB-SPAWN: the controller looks up AgentType and spawns its image as a K8s Job
              to run this initiative to completion. It does NOT call a service.
            properties:
              agentType:
                description: AgentType names the cluster-scoped AgentType (the per-language
                  runtime).
                type: string
              budgetIter:
                default: 5
                description: BudgetIter caps iterations (respawns) before the run
                  is failed.
                type: integer
              inputs:
                description: |-
                  Inputs is the run payload (validated against the AgentType's InputSchema),
                  projected into the agent Job.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              repo:
                description: |-
                  Repo, when set (mikelear/X or X), is cloned by a git initContainer into the
                  shared workspace before the agent runs (the initiative worker requires the
                  repo pre-checked-out). Empty = no clone (e.g. smoke runs).
                type: string
              sourcePR:
                description: SourcePR is the PR number when triggered from a PR comment.
                type: string
              tenant:
                description: Tenant is the tenant identity carried into the Job.
                type: string
              triggeredBy:
                description: TriggeredBy records the origin (user email | "agent"
                  | "cron").
                type: string
            required:
            - agentType
            - inputs
            type: object
          status:
            description: AgentRunStatus is the observed state of an AgentRun.
            properties:
              completionTime:
                description: CompletionTime is when the run reached a terminal phase.
                format: date-time
                type: string
              iteration:
                description: Iteration counts how many agent Jobs have been spawned
                  for this run.
                type: integer
              jobName:
                description: JobName is the currently-owned agent Job.
                type: string
              lastResult:
                description: LastResult is the terminal result summary once terminal.
                type: string
              message:
                description: Message is a human-readable status detail.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              startTime:
                description: StartTime is when the first Job was spawned.
                format: date-time
                type: string
              targetPR:
                description: TargetPR is the PR the agent opened, once known.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
