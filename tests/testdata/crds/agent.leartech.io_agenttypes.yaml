---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agenttypes.agent.leartech.io
spec:
  group: agent.leartech.io
  names:
    kind: AgentType
    listKind: AgentTypeList
    plural: agenttypes
    shortNames:
    - at
    singular: agenttype
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentType is a cluster-scoped agent runtime template (per-language image + how
          to run it). AgentRuns reference it by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTypeSpec declares a reusable agent RUNTIME — the image + how to run it.
              One AgentType per language/framework (leartech-agent-{py,go,ng,rust,…}) is the
              per-language image selection: an AgentRun references an AgentType by name.
            properties:
              activeDeadlineSeconds:
                default: 14400
                description: ActiveDeadlineSeconds is the Job's hard wall-clock cap.
                format: int64
                type: integer
              anthropicSecretKey:
                type: string
              anthropicSecretName:
                description: AnthropicSecretName/Key source ANTHROPIC_API_KEY (default
                  ai-review-api-keys/CLAUDE_API_KEY).
                type: string
              args:
                description: Args are appended to the entrypoint.
                items:
                  type: string
                type: array
              entrypoint:
                description: Entrypoint overrides the container entrypoint.
                items:
                  type: string
                type: array
              env:
                additionalProperties:
                  type: string
                description: |-
                  Env forwards non-secret agent config into the Job (e.g. LEARTECH_AGENT_MODEL,
                  VERSION, CLUSTER). A key here overrides the controller-set defaults.
                type: object
              githubSecretKey:
                type: string
              githubSecretName:
                description: GitHubSecretName/Key source GH_TOKEN (default tekton-git/password).
                type: string
              image:
                description: Image is the agent container image to run (per-language,
                  set per cluster).
                type: string
              inputSchema:
                description: InputSchema is a JSON Schema an AgentRun's inputs are
                  validated against.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              mcps:
                description: MCPs the agent is granted (injected as MCP_REGISTRY into
                  the Job).
                items:
                  description: MCPConfig declares an MCP server the spawned agent
                    should have access to.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      type: string
                    name:
                      type: string
                    transport:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                  - transport
                  type: object
                type: array
              preflight:
                description: Preflight gates run before the Job is created.
                items:
                  description: |-
                    PreflightCheck is a deterministic gate the controller runs before spawning the
                    Job (e.g. secret-present, quota-headroom). Config is check-specific.
                  properties:
                    config:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      type: string
                  required:
                  - type
                  type: object
                type: array
              resources:
                description: Resources for the agent Job pod.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serviceAccountName:
                description: ServiceAccountName the agent Job runs as.
                type: string
              ttlSecondsAfterFinished:
                default: 86400
                description: TTLSecondsAfterFinished GCs the Job after completion.
                format: int32
                type: integer
            required:
            - image
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
