name: ai-review-add-mcp-config-review-rule
description: |
  Surfaced 2026-06-11. Yesterday's PR #88 and earlier PRs shipped the
  Orch chat surface with a 405-causing MCP path bug AND no startup
  health check. The ai-review pipeline reviewed these PRs and didn't
  flag either issue. Mike's framing: "surprised the review didn't pick
  that up".

  The reason: the ai-review calibration rules don't yet treat MCP
  registration as a reviewable surface. This init adds the rules
  needed to catch the class of bug at PR time, before code ships.

repo: leartech-dockerfiles
branch: agent/add-mcp-config-review-rule
base: main

goal: |
  Add two ai-review rules + sample diff fixtures so future MCP-related
  PRs get reviewed properly.

  ## 1. Read first

  - leartech-dockerfiles repo (ai-review-worker subdirectory)'s existing rule structure
  - Memory: `feedback_check_other_agent_before_building` — agent side
    already established mcp_status.py pattern (the standard)
  - The chat_tools.py path-bug PR (this same plan) — use the diff
    as a regression fixture

  ## 2. Two new rules

  ### Rule: mcp_url_hardcoded
  Trigger: PR adds an MCP base URL inline in source code without a
  chart-values or env-var fallback. E.g.:
    httpx.post("https://leartech-platform-mcps-jx-staging...")
  Should fail review with: "MCP URL hardcoded. Use chart values + env
  var. See gate/orch/chat_tools.py for the correct pattern."

  Edge case: env-var-with-fallback is OK ONLY if the fallback URL is
  internal/local. External fallbacks should fail review.

  ### Rule: mcp_registered_without_startup_check
  Trigger: PR adds a new MCP server registration (Python module import,
  tool registration, or @tool wrapper) but doesn't add a corresponding
  entry in the service's startup health check. Detected by:
  - New file in `gate/<svc>/mcp_servers/` OR
  - New tool registration in `chat_tools.py` referencing an external URL
  - AND no new entry in `gate/<svc>/introspection/mcp_status.py`

  Should warn (not fail) with: "Registered MCP without startup probe.
  See gate/agent/introspection/mcp_status.py for the canonical pattern."

  ## 3. Sample fixtures

  Use two diffs from the leartech-orchestrator PR shipping the
  chat-platform-mcps-parity fix:
  - The path-bug-only fix (POST /sse → POST /messages)
  - The startup health check addition

  Both should be classified correctly by the new rules.

  ## 4. Test the rules in CI

  Run the ai-review-worker test harness with the new fixtures.
  Assert:
  - The pre-fix code triggers BOTH rules
  - The post-fix code triggers NEITHER

  ## 5. Lesson capture

  Save to orchestration_lessons:
  - topic: mcp_config_review_rules
  - rule: "MCP registration in source without startup check OR
    hardcoded URL is a finding"
  - provenance: this PR + chat-platform-mcps-parity PR

  ## 6. JX3 conventions

  Standard. Pure-rule update, no behavioral change to the worker
  beyond new pattern detection.

  ## 7. Conventional commit

  `feat(rules): flag MCP config in source + missing startup health check`

gate_marks: [unit, integration]
max_iterations: 8
