name: orchestrator-add-post-deploy-smoke-test
description: |
  Surfaced 2026-06-11 17:00 UTC after the duplicate-tool-name bug shipped
  to orch 0.0.60 and broke /chat completely. Discovered when operator
  tried to verify v5j. Would have been caught at deploy time by a 60s
  smoke test that POSTs to /chat.

  Mike's principle: "we should have a smoke test Init with new features
  and integration type testing after every Orch or Agent release. We
  can do one now knowing what it will need but we also need to
  understand that it will change if we add a new or change a new
  feature."

  This init adds the smoke test as a LIVING contract:
  - Runs as last step of release pipeline (post-deploy)
  - Tests current platform surface end-to-end
  - Each PR adding new tools/endpoints/MCPs MUST update the smoke test
  - AI review rule (separate init) enforces "added feature, no smoke
    test update = finding"

repo: leartech-orchestrator
branch: agent/add-post-deploy-smoke-test
base: main

goal: |
  Add a runnable smoke test that exercises the platform end-to-end
  against a deployed instance, and wire it into the release pipeline.

  ## 1. Read first

  - `tests/test_e2e_script.py` — existing single-process e2e test
  - `scripts/e2e.sh` — existing container-boot e2e (init #5)
  - `gate/orch/chat_tools.py` for the current TOOL_NAMES tuple
  - `app/routers/health.py` for /healthz current shape
  - Memory: `feedback_smoke_test_after_every_deploy`
  - Memory: `feedback_agent_should_check_repo_has_e2e_when_changing_image_shape`

  ## 2. Smoke test directory + structure

  `tests/smoke/` directory marked with `pytest.ini` mark `smoke`:

  ```
  tests/smoke/
    conftest.py          # fixtures: target URL, auth, retry helpers
    test_healthz.py      # /healthz shape + all expected checks
    test_chat.py         # /chat reachable, tool names unique, exercise each
    test_plans.py        # POST /plans preflight, recover endpoint
    test_initiatives.py  # POST /initiatives inline_body
    test_background.py   # reconcilers running (kubectl probe)
    test_get_version_state.py  # deploy/release skew
    test_e2e_fire_init.py  # fire smoke init, verify PR opens
  ```

  Configurable via env vars:
  - `LEARTECH_SMOKE_TARGET_URL` (default https://leartech-orchestrator-jx-staging...)
  - `LEARTECH_SMOKE_TARGET_AGENT_URL` (default https://leartech-automated-agent-jx-staging...)
  - `LEARTECH_SMOKE_TIMEOUT` (default 30s)

  ## 3. Specific smoke tests for current platform

  ### test_chat.py (most important — would have caught today's bug)

  ```python
  async def test_chat_endpoint_reachable():
      """POST /chat with trivial prompt; expect 200 + conversation_id.
      Catches 'Tool names must be unique' + any tool-registration breaks."""
      resp = httpx.post(f"{URL}/chat", json={"message": "hello"})
      assert resp.status_code == 200
      data = resp.json()
      assert 'conversation_id' in data
      assert 'turn' in data
      # Verify no 'Tool names must be unique' or similar in response
      content = data['turn']['content']
      assert all(b.get('type') != 'error' for b in content)

  async def test_all_declared_chat_tools_callable():
      """For each name in TOOL_NAMES, send a prompt that should trigger
      it; verify executor doesn't crash."""
      ...
  ```

  ### test_plans.py (V5i preflight)

  ```python
  async def test_post_plans_with_catalog_miss_returns_422():
      """Known-bad init name → 422 preflight_blocked."""
      ...

  async def test_post_plans_with_good_inline_init_returns_201():
      """Known-good plan body → 201."""
      ...

  async def test_plans_recover_endpoint_validates_mode():
      """Invalid mode → 422; valid mode + missing plan → 404."""
      ...
  ```

  ### test_healthz.py

  Asserts the FULL shape including v5h's MCP block + any future
  chat_tools block (post-v5j). When fields are added, this test must
  be updated as part of the same PR.

  ## 4. Pipeline integration

  New Tekton task `post-deploy-smoke-test` in leartech-pipeline-catalog:
  - Runs after Helm deploy succeeds
  - `pytest tests/smoke/ -m smoke -v --target-url=<deployed-url>`
  - Fail → release pipeline marks deploy as failed, ops alert
  - Pass → proceed to promote (or next pipeline stage)

  Optional: cron job that runs nightly against staging — catches drift
  outside of deploys (config changes, dependency upgrades, etc.).

  ## 5. Living-contract enforcement

  Add a test that asserts every chat tool in `TOOL_NAMES` has at least
  one smoke test entry exercising it. When agent adds a new tool, this
  test fails until smoke test is updated. Same shape for endpoints.

  ## 6. AI review calibration update (separate init, future)

  `ai-review-add-smoke-test-coverage-rule`:
  - "PR adds chat tool / endpoint / MCP but no corresponding
    `tests/smoke/` update = finding"
  - Fixture: chat-tools.py diff that adds tool but no smoke test

  Not in this init's scope — separate init in leartech-dockerfiles
  ai-review-worker subdirectory.

  ## 7. Tests for the smoke tests themselves

  - `tests/test_smoke_runner_handles_target_url.py` — URL config flows
  - `tests/test_smoke_assertion_helpers.py` — retry / timeout helpers
  - `tests/test_smoke_tools_iteration.py` — the iteration over TOOL_NAMES
    works against a fixture orch

  ## 8. JX3 conventions

  Standard. New tests directory, new Tekton task (separate PR in
  pipeline-catalog).

  ## 9. Conventional commit

  `feat(smoke): add post-deploy smoke test suite — runs after release, catches API regressions`

gate_marks: [unit, integration]
max_iterations: 10
