name: orch-add-stale-progress-detector
description: |
  V5 plan V4. Same stale-progress detector as V3, but inside Orch's
  plan-runner per-step wait loop. Uses `k8s_mcp` via W2 catalog
  registration. On detection, transitions `plan_step.status` to
  `failed` AND posts to `plan_decisions` with stall classification.

repo: leartech-orchestrator
branch: agent/v4-stale-progress-detector
base: main

goal: |
  Plan-runner converges plans even when downstream Jobs get stuck in
  image-pull failures — no operator kubectl required.

  ## 1. Read the pattern first

  Read these in `leartech-orchestrator`:

  - `gate/orch/plan_runner.py` — the per-step wait loop.
  - `gate/orch/models.py` — `PlanStep`, `PlanDecision`, `AgentRun`
    shapes.
  - `gate/orch/chat_tools.py` — the W2 catalog registration that adds
    `k8s_mcp`.

  Cross-reference:
  - `leartech-automated-agent/gate/agent/run_driver.py` after V3 lands
    — for the canonical detector shape (this init mirrors V3 at the
    plan-runner level).
  - `leartech-platform-mcps/src/leartech_platform_mcps/k8s_mcp/`
    server.py (F5) for `get_pod_state` schema.

  ## 2. Implementation

  In the per-step wait loop, after polling `agent_run.status`:

  ```python
  STALE_THRESHOLD_S = int(os.environ.get('PLAN_STALE_PROGRESS_THRESHOLD_S', 600))
  IMAGE_PULL_FAILURE_REASONS = {
      'ImagePullBackOff',
      'CreateContainerConfigError',
      'ErrImagePull',
      'InvalidImageName',
  }

  if (
      agent_run.status == 'running'
      and agent_run.started_executing_at is None
      and (utcnow() - agent_run.created_at).total_seconds() > STALE_THRESHOLD_S
  ):
      pod = await k8s_mcp.get_pod_state(
          name=agent_run.pod_name,
          namespace=agent_run.namespace,
      )
      reason = pod.get('waiting_reason')
      if reason in IMAGE_PULL_FAILURE_REASONS:
          await mark_step_failed(
              plan_step.id,
              error=f'pod_stuck_{reason}',
          )
          await append_decision(
              sess,
              plan_id,
              kind='stale_progress_detected',
              meta={
                  'plan_step_id': str(plan_step.id),
                  'agent_run_id': str(agent_run.id),
                  'waiting_reason': reason,
                  'pod_state': pod,
              },
          )
          return
  ```

  `k8s_mcp.get_pod_state` is accessed via the catalog adapter from W2,
  not by reaching directly into kubernetes_asyncio (Orch must NOT add
  in-cluster K8s read code — that surface lives in platform-mcps now).

  ## 3. Config knobs

  - `PLAN_STALE_PROGRESS_THRESHOLD_S` (default 600) — env var; chart
    `values.yaml` plumbs it through.

  ## 4. JX3 conventions

  - `set -e` in script steps. Memory:
    `feedback_pr_pytest_step_must_set_e`.
  - Tests use `asyncio.Event`, not `sleep`. Memory:
    `feedback_async_tests_need_event_not_sleep`.
  - Read retrospect Issue between initiatives. Memory:
    `feedback_read_retrospect_issue_before_next_init`.

  ## 5. Tests

  Unit (mock k8s-mcp + frozen time):
  - `test_detector_fails_step_on_image_pull_backoff_stall`
  - `test_detector_appends_decision_with_classification`
  - `test_detector_uses_started_executing_at_not_turns`
  - `test_detector_ignores_when_step_already_terminal`
  - `test_detector_respects_threshold`
  - `test_detector_handles_each_image_pull_failure_reason` (parametrize)

  Integration (preview-deploy):
  - Fire a 1-step plan whose init image is deliberately broken.
  - Assert `plan_steps.status` transitions to `failed` AND a row in
    `plan_decisions` with `kind='stale_progress_detected'` exists
    within `THRESHOLD + 30s` (use 60s threshold in test).
  - Assert plan-runner's wait loop exits cleanly (no zombie task).

  ## 6. Conventional commit
  `feat(plan-runner): add stale-progress detector — fail step on pod_stuck_ImagePullBackOff via k8s-mcp`

gate_marks: [unit, integration]
max_iterations: 12
