name: agent-reconciler-detect-job-deleted
description: |
  V5 plan V1. Background reconciler inside the agent service that flips
  `initiative_runs.status` from `running` to `orphaned` when no Job
  with the matching `leartech.io/run-id` label exists in K8s. Replaces
  today's manual debug-pod UPDATE. Memory:
  `feedback_orch_cant_see_pod_problems`.

repo: leartech-automated-agent
branch: agent/v1-reconciler-detect-job-deleted
base: main

goal: |
  Detect externally-deleted Jobs and converge DB state automatically.

  ## 1. Read the pattern first

  Read these in `leartech-automated-agent`:

  - `gate/agent/reconciler.py` (or wherever the existing reconciler
    lives — if absent, create `gate/agent/job_reconciler.py` mirroring
    the orch-side `gate/orch/job_reconciler.py` pattern).
  - `gate/agent/models.py` — `initiative_runs` shape.
  - `app/main.py` lifespan — for hooking the background task alongside
    any existing reconciler.
  - `tests/agent/test_run_driver_state_machine.py` (D2) — the test
    that this PR makes pass.

  ## 2. Implementation

  New (or extended) module `gate/agent/job_reconciler.py`:

  ```python
  async def reconcile_loop(stale_threshold: int = 120, interval: int = 30):
      while True:
          try:
              async with session_factory() as sess:
                  rows = await fetch_running_runs(sess)
              for row in rows:
                  job_exists = await job_exists_for_run(
                      run_id=row.id,
                      namespace=row.namespace,
                  )
                  if job_exists:
                      continue
                  age = (utcnow() - row.last_seen_at).total_seconds()
                  if age < stale_threshold:
                      continue
                  async with session_factory() as sess:
                      await mark_orphaned(
                          sess,
                          row.id,
                          reason='job_deleted_externally',
                      )
          except Exception:
              _logger.exception("agent job-reconciler iteration failed")
          await asyncio.sleep(interval)

  async def job_exists_for_run(run_id: str, namespace: str) -> bool:
      api = client.BatchV1Api()
      resp = await api.list_namespaced_job(
          namespace=namespace,
          label_selector=f'leartech.io/run-id={run_id}',
          limit=1,
      )
      return len(resp.items) > 0
  ```

  `mark_orphaned` MUST be idempotent — guard with `WHERE status='running'`
  so a concurrent termination doesn't get overwritten.

  ## 3. Lifespan integration

  Edit `app/main.py`:
  ```python
  reconciler_task = asyncio.create_task(
      reconcile_loop(),
      name='agent-job-reconciler',
  )
  ```
  Cancel + await on shutdown.

  ## 4. Config knobs

  - `RECONCILER_STALE_THRESHOLD_SECONDS` (default 120) — env var.
  - `RECONCILER_INTERVAL_SECONDS` (default 30) — env var.
  Plumb via the chart's `values.yaml` + `deployment.yaml`.

  ## 5. JX3 conventions

  - `set -e` in any multi-line script. Memory:
    `feedback_pr_pytest_step_must_set_e`.
  - `kubernetes_asyncio.config.load_incluster_config()` is SYNC.
    Memory: `feedback_kubernetes_asyncio_load_incluster_is_sync`.
  - Use `asyncio.Event` in tests, not `sleep`. Memory:
    `feedback_async_tests_need_event_not_sleep`.

  ## 6. Tests

  Unit:
  - `test_reconciler_flips_to_orphaned_when_job_missing` — mock
    BatchV1Api list returning empty; assert row.status == 'orphaned',
    error contains 'job_deleted_externally'.
  - `test_reconciler_respects_stale_threshold` — row last_seen 30s ago
    + threshold 120s → not flipped.
  - `test_reconciler_is_idempotent` — call mark_orphaned twice; second
    call no-ops because WHERE guard.
  - `test_reconciler_does_not_touch_already_terminal` — row in
    `complete` / `failed` / `orphaned` left alone.
  - `test_reconciler_survives_per_iteration_exceptions` — make
    list_namespaced_job raise once; loop continues next iteration.

  Integration (preview-deploy):
  - Spawn a run; `kubectl delete job -n jx-staging
    -l leartech.io/run-id=<id>`; assert row flips within 60s
    (interval=30 + threshold=120 → up to ~150s; pick a deterministic
    integration window).

  Acceptance: D2's `test_job_deleted_externally_flips_to_orphaned`
  passes against this implementation.

  ## 7. Conventional commit
  `feat(agent): add job reconciler — flip running→orphaned when Job deleted externally`

