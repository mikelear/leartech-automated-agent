name: orchestrator-chat-session-retrospect-and-lesson-capture
description: |
  Today Orch chat made a correct diagnosis, got pushed back on, and
  acknowledged the correction. That correction is locked in conversation
  f481a23ff6f1 and lost to all future chat sessions. The
  orchestration_lessons table exists; it's just not being populated from
  chat retrospects.

  This init adds a "chat session retrospect" path: when a conversation
  ends OR on operator command, the LLM reviews the thread + extracts
  durable lessons, writes them to orchestration_lessons. Every new chat
  loads relevant lessons into the system prompt context.

  Mirrors `agent-self-retrospect-v2-tooling-axis` which does the same
  for agent runs.

repo: leartech-orchestrator
branch: agent/chat-session-retrospect
base: main

goal: |
  Make Orch get smarter from chat conversations.

  ## 1. Read first

  - `app/routers/chat.py` — current chat endpoint
  - `gate/orch/chat_tools.py` — chat tools surface
  - `gate/orch/plan_retrospect.py` — existing per-plan retrospect; mirror this shape
  - `gate/agent/self_retrospect.py` (in leartech-automated-agent) — agent-side equivalent
  - `app/models.py` — orchestration_lessons schema

  ## 2. Retrospect trigger paths

  ### Path A — explicit operator command
  `leartech-agent ops retrospect-chat --conversation <id>` posts a
  retrospect request. Endpoint:
  ```
  POST /chat/{conversation_id}/retrospect
  → runs the LLM over conversation history
  → returns extracted lessons
  → user confirms or rejects each
  → confirmed ones land in orchestration_lessons
  ```

  ### Path B — automatic on natural session end
  If a conversation has > N turns AND has been idle > M minutes,
  auto-trigger a background retrospect job. User sees a notification
  on next access showing the extracted lessons for review.

  ### Path C — auto on operator pushback
  When the operator's message starts with "actually..." or "wait..." or
  pushes back on a prior response, the next assistant turn writes a
  candidate lesson (still requires operator confirmation).

  Pick A + C for v1 (B is heavier; defer).

  ## 3. Lesson shape

  Extended orchestration_lessons schema (add columns if missing):
  ```
  topic         VARCHAR(64)   -- e.g. "same_repo_serialization"
  rule          TEXT          -- the durable guidance
  provenance    JSONB         -- {conversation_id, turn_index, user_message_excerpt}
  applies_to    VARCHAR(64)   -- which chat surface: "plan-analysis", "release-failure-diagnosis", etc.
  confirmed_by  VARCHAR(255)  -- operator login who confirmed
  confirmed_at  TIMESTAMPTZ
  superseded_by BIGINT REFERENCES orchestration_lessons(id)
  ```

  ## 4. System prompt loading

  When /chat is invoked:
  - Load all `confirmed_at IS NOT NULL AND superseded_by IS NULL`
    lessons relevant to the question's topic
  - Inject as a `<lessons>` block in the system prompt
  - LLM consults them before forming answers

  Cap at e.g. 50 lessons / 5K tokens to avoid context bloat.

  ## 5. Operator surface

  CLI subcommands:
  ```
  leartech-agent lessons list                   # all confirmed lessons
  leartech-agent lessons show <id>               # one lesson detail
  leartech-agent lessons retrospect <conversation_id>
  leartech-agent lessons confirm <lesson_id>
  leartech-agent lessons supersede <old_id> <new_id>
  ```

  ## 6. Tests

  - test_retrospect_extracts_lesson_from_pushback: simulated thread
    with user correction → retrospect surfaces it as a candidate
  - test_confirmed_lesson_loads_in_next_chat: confirm a lesson →
    next /chat invocation includes it in system prompt
  - test_lesson_cap_token_budget: 100 confirmed lessons → only top-N
    by relevance loaded
  - test_superseded_lesson_not_loaded: superseded entries excluded

  ## 7. JX3 conventions

  Standard.

  ## 8. Conventional commit
  `feat(chat): session retrospect + lesson capture, smarter on each conversation`

gate_marks: [unit, integration]
max_iterations: 10
