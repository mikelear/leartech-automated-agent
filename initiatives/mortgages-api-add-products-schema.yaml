  ## Files to NOT TOUCH

  - `cmd/server/main.go` — no HTTP wiring in this PR
  - `internal/handlers/*` — handlers come in the next initiative
  - `internal/config/config.go` — DB DSN is already configured
  - `migrations/20260416000001_initial.sql` — leave the placeholder for now; a later cleanup initiative can drop the `example` table
  - `charts/leartech-mortgages-api/*` — no chart changes needed; the existing migrations Job runs goose against the new file automatically
  - `docs/` — openapi gen runs against the handler annotations; with no new endpoints, no doc changes

  ## Constraints

  - **Pure data layer.** No HTTP endpoints, no MCP wiring, no Hydra
    interaction. Pure SQL + Go structs + repo CRUD.
  - **goose format strictly.** Filename `<UTC-timestamp>_<descriptive-name>.sql`,
    Up + Down sections, StatementBegin/End around multi-statement bodies.
  - **No new dependencies** unless `pgtype` / `uuid` / `squirrel` aren't
    already in go.mod. Check first; reuse what's there.
  - **Match the test pattern** already in `internal/handlers/example_test.go` —
    don't introduce a different DB-test approach.
  - **All CHECK constraints in the schema.** Don't move validation to the
    Go layer that the DB can enforce.
  - **Index everything that ListProducts filters on.** Lender, class, rate_type,
    LTV bands, dates. JSONB attributes get a GIN index for future jsonb-path
    queries.
  - **Argon2 hashing is NOT in this PR.** `lender_api_keys.key_hash` stores
    a TEXT — the actual argon2 work lands in
    `mortgages-api-add-lender-api-keys-schema` (Phase 2). This initiative
    just creates the table shape.
  - Conventional commit: `feat(db): add products + lenders + lender_api_keys schema`
  - Always post `/hold` immediately after opening the PR.

  ## Pre-push validation (per the calibration lesson)

  Before pushing the branch:

      gofmt -l .                # must be empty
      golangci-lint run ./...   # all green
      go test ./...             # all green
      govulncheck ./...         # if available

  ## What this is NOT

  - Not the read API. That's `mortgages-api-add-read-endpoints`.
  - Not the write API. That's `mortgages-api-add-lender-write-endpoints`.
  - Not the API-key auth middleware. That's `mortgages-api-add-api-key-middleware`.
  - Not the seed data. That's `mortgages-api-seed-product-data` (with
    env-gating to keep Mike Lear out of production).
  - Not a refactor of mortgages-gw — the swap from mockproducts to the
    SDK is `mortgages-gw-swap-mockproducts-for-sdk` and lands after the
    SDK is published.
  - Not the chart migrations Job wiring. The existing helm chart's
    migrations Job already runs goose against `migrations/*.sql`; this
    PR's file is picked up automatically.

  ## Why this is split from the read API

  Two small PRs vs one large PR:
  - Schema design + repo + tests is one self-contained concern that's easy
    to review (no HTTP noise).
  - Read endpoints + openapi annotations + handler tests is a second
    concern with its own review surface.
  - Independent merge means schema can land + run in staging before
    endpoints come online — gives us a window to spot migration issues
    without a half-broken API.

  Expected pipeline outcome: 11 PR checks green; release cuts a minor
  bump (new feature).
  Expected agent behaviour: 4-6 turns. Mechanical schema + repo work
  with tests.

