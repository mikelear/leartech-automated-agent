# webcoder-ui-add-initiative-detail-page
#
# Adds the per-run detail page at /projects/:id/initiatives/:runId.
# Polls InitiativesApiAdapter.getRun + .streamLogs (mocked v1; real
# wiring lands with the privileged direct work). Also makes initiatives-list
# rows clickable so users can navigate to the detail page.
#
# Run with: `make initiative INITIATIVE=webcoder-ui-add-initiative-detail-page`

name: webcoder-ui-add-initiative-detail-page

description: |
  New route /projects/:id/initiatives/:runId with status header,
  iteration counter, linked PR card, log tail (polling), and kill button.
  Mock data only — adapter returns canned values for v1, real backend
  wires later when K8s Job spawn + SSE log streaming land via direct work.
  Also adds row-level routerLink in initiatives-list so list navigates
  to detail.

repo: webcoder-ui
branch: agent/add-initiative-detail-page
base: main

goal: |
  Build a self-contained `<app-initiative-detail>` component, add a new
  route, make existing list rows clickable to navigate to the detail page.

  ## Read first (no edits)

  - `src/app/initiatives/initiatives-api.adapter.ts` — `getRun()` and
    `streamLogs()` are already mocked. Component polls these.
  - `src/app/initiatives/initiatives-list.component.ts` — needs a small
    addition: make each row a `routerLink` to the detail page. Keep all
    other elements + data-testids unchanged.
  - `src/app/components/pr.component.ts` — reference pattern for a
    routed detail page reading `:id` + a second route param. Match the
    `toSignal(route.paramMap)` + `computed()` accessor pattern.
  - `src/app/initiatives/initiative-run.model.ts` — locked InitiativeRun
    type. Don't modify; just consume.
  - `src/app/app.routes.ts` — see existing route definitions to match
    the standalone-loadComponent style.

  Do NOT read or edit:
  - `auth/`, `charts/`, `.lighthouse/jenkins-x/`, `package.json`,
    `eslint.config.mjs`, tsconfigs.

  ## Files to create

  ### `src/app/initiatives/initiative-detail.component.ts`

  Standalone Angular component, inline template. Reads `:id` and
  `:runId` from route params. Polls `adapter.getRun(runId)` every 2s
  and `adapter.streamLogs(runId)` every 1s. ChangeDetectionStrategy.OnPush.

  - Selector: `app-initiative-detail`
  - Inject ActivatedRoute → toSignal(paramMap) → `slug` + `runId` computed signals
  - Inject `InitiativesApiAdapter`
  - Use `interval(2000).pipe(switchMap(() => adapter.getRun(runId())))` → toSignal for `run`
  - Use `interval(1000).pipe(scan((acc, chunk) => acc + chunk, ''))` for log accumulation → toSignal for `logTail`
  - Render layout:
    - **Header**: initiative name (large), state pill, iteration "N / M" counter, "back to project" link
    - **Meta block**: triggered-by, source PR (if set), created/last-update timestamps
    - **Linked PR card** (only if `run().targetPr`): clickable link styled as a card
    - **Log tail**: `<pre>` block with `logTail()` content, monospaced, fixed height with overflow-y scroll, auto-scroll to bottom on update
    - **Kill button** at the bottom: disabled if `run().state` is terminal (done/deferred/killed); calls `adapter.killRun(runId)` on click
  - Empty/loading states: if `run()` is `undefined` (still loading or 404), show a small loading message.

  ### `src/app/initiatives/initiative-detail.component.spec.ts`

  Unit tests:
  - Renders header with run name + state pill when adapter returns a run.
  - Renders empty/loading state when adapter returns `undefined`.
  - Renders target-PR card only when `run.targetPr` is set.
  - Kill button disabled when state is `'done'`, `'deferred'`, or `'killed'`.
  - Kill button enabled when state is `'running'` or `'iterating'`.
  - Click kill button → calls `adapter.killRun(runId)`.
  - Polling intervals don't accumulate / leak — verify with `fakeAsync` + `tick()`.

  Use `data-testid` selectors. Use a stub `InitiativesApiAdapter` (extend
  the real class with overridden methods returning canned `of(...)` values).

  ## Files to modify

  ### `src/app/app.routes.ts`

  Add a new route BEFORE the `**` catch-all:

  ```typescript
  {
    path: 'projects/:id/initiatives/:runId',
    canActivate: [AuthGuard],
    loadComponent: () =>
      import('./initiatives/initiative-detail.component').then((m) => m.InitiativeDetailComponent),
  },
  ```

  Match the indentation and style of existing route entries.

  ### `src/app/initiatives/initiatives-list.component.ts`

  Make each list row a `routerLink` to the new detail page.

  - Add `RouterLink` to component imports.
  - Wrap (or convert) each row's outer element so `routerLink` resolves
    to `['/projects', run.projectId, 'initiatives', run.runId]`.
  - Preserve ALL existing data-testids on the row + nested elements.
  - Keep the existing "View PR" link working (it should still go to
    `run.targetPr`, not the detail page) — use `event.stopPropagation()`
    on the PR link's click handler if needed to prevent the row's
    routerLink from triggering when the user clicks the inner link.

  Update `initiatives-list.component.spec.ts` to assert:
  - Each row has a routerLink to `/projects/<id>/initiatives/<runId>`.
  - Clicking the inner "View PR" link does NOT trigger the row navigation
    (verify by checking the link's stopPropagation or by inspecting
    the `routerLink` directive's recipient).

  ## Acceptance

  - `make all` + `make pre-push` pass.
  - New route reachable at `/projects/demo/initiatives/<any-mock-run-id>`.
  - Header renders with name + state pill + iteration counter.
  - Log tail polls and accumulates content (mock values are short strings
    — visible in browser).
  - Kill button enabled/disabled correctly per state.
  - Clicking a list row on `/projects/demo` navigates to its detail page.
  - "View PR" link inside a row still navigates to the GitHub URL, NOT
    to the detail page (event propagation correctly handled).

  ## data-testid contract

  - `initiative-detail-page` — outer container
  - `initiative-detail-name`
  - `initiative-detail-state-pill`
  - `initiative-detail-iteration`
  - `initiative-detail-triggered-by`
  - `initiative-detail-source-pr` (only if `run.sourcePr`)
  - `initiative-detail-target-pr-card` (only if `run.targetPr`)
  - `initiative-detail-log-tail`
  - `initiative-detail-kill-button`
  - `initiative-detail-loading` — empty/loading state
  - `initiative-detail-back-link`

  ## Constraints

  - **Playwright spec EXPECTED** — list-row click → detail page renders →
    kill button presents correctly per mock state. Spec_suggester fills
    via `agent-applies-spec-convention-when-gate-silent`.
  - **No new deps** — use built-in RxJS `interval`, `switchMap`, `scan`.
  - **DO NOT touch `auth/`, `charts/`, `.lighthouse/jenkins-x/`,
    `package.json`, `eslint.config.mjs`, tsconfigs.**
  - **Always post `/hold` immediately** (`agent-prs-must-be-held-pending-review`).
  - **Never post `/hold cancel`** — humans only.
  - **Use `mcp__leartech-pipeline__wait_for_terminal`** for pipelines.
    SDK crash during long waits = work is complete if PR is open + held +
    most checks ran (`agent-sdk-crash-during-long-initiative`).
  - **Run `make pre-push` LOCALLY before pushing.**
  - `git add <specific files>` only:
    - `src/app/initiatives/initiative-detail.component.ts`
    - `src/app/initiatives/initiative-detail.component.spec.ts`
    - `src/app/initiatives/initiatives-list.component.ts` (modified)
    - `src/app/initiatives/initiatives-list.component.spec.ts` (modified)
    - `src/app/app.routes.ts` (modified)
    - `end2end-ui/0N-initiative-detail-page.spec.ts` (spec_suggester)
  - Conventional commit: `feat(initiatives): add per-run detail page + clickable list rows`
  - Full-gate before posting "Ready for client review" sticky.

