# orchestrator-fix-job-spawn-test-async-race — gate the reconciler in tests.
#
# tests/test_plans_router_job_spawn.py::test_submit_plan_returns_500_when_image_unresolvable
# fails on GCP release pipeline (passes on AZ + locally) with:
#
#   WARNING reconciler: pass failed: (sqlite3.OperationalError)
#   cannot commit transaction - SQL statements in progress
#
# Root cause: the FastAPI test fixture brings up the full app lifespan
# which starts the background job_reconciler. Under GCP cluster
# contention, the reconciler's aiosqlite operations race the test's own
# sqlite session → OperationalError → test fails.
#
# Fix: gate the reconciler behind an env var the test sets. Cheapest
# narrow fix; memory-blessed pattern from
# `feedback_async_tests_need_event_not_sleep`.

name: orchestrator-fix-job-spawn-test-async-race

description: |
  Gate the job_reconciler background task behind
  `LEARTECH_RECONCILER_DISABLED` env var (default empty = enabled).
  Set the env var in the failing test's fixture. Resolves the
  GCP-cluster-only sqlite OperationalError.

repo: leartech-orchestrator
branch: agent/fix-job-spawn-test-async-race
base: main

goal: |
  Stop the GCP-only flake on `test_submit_plan_returns_500_when_image_unresolvable`.

  ## 1. Diagnose

  Read the test in `tests/test_plans_router_job_spawn.py`:

  ```bash
  grep -n "test_submit_plan_returns_500_when_image_unresolvable" tests/test_plans_router_job_spawn.py
  ```

  And the surrounding fixtures (likely in `conftest.py` or fixtures at
  the top of `test_plans_router_job_spawn.py`). Confirm the test
  brings up the full FastAPI app via TestClient — which starts the
  job_reconciler background task per `app/main.py` lifespan.

  ## 2. Gate the reconciler in app/main.py

  In `app/main.py`'s lifespan, ADD a check before starting the
  reconciler task:

  ```python
  if os.environ.get('LEARTECH_RECONCILER_DISABLED'):
      _logger.info('reconciler explicitly disabled via LEARTECH_RECONCILER_DISABLED')
  elif settings.pod_namespace and is_db_enabled():
      # existing path — start reconciler
      ...
  ```

  Default behaviour unchanged. Only when the env var is non-empty does
  the reconciler skip startup.

  ## 3. Set the env var in the failing test's fixture

  Find the fixture that builds the TestClient for the failing test
  (e.g., a `client_with_spawn` fixture in `tests/test_plans_router_job_spawn.py`
  or in `tests/conftest.py`). Set the env var BEFORE the app starts:

  ```python
  @pytest.fixture
  def client_with_spawn(monkeypatch):
      monkeypatch.setenv('LEARTECH_RECONCILER_DISABLED', '1')
      # existing fixture body
  ```

  Or via `os.environ['LEARTECH_RECONCILER_DISABLED'] = '1'` + cleanup
  in a teardown — match whatever pattern the file already uses.

  Apply the SAME env-var gate to OTHER tests in this file if they ALSO
  hit the same OperationalError under contention. Read the file — if
  there's a shared fixture, gate it once.

  ## 4. Add a comment + memory reference

  In `app/main.py` near the env-var check, add a one-line comment:

  ```python
  # Test fixtures set LEARTECH_RECONCILER_DISABLED=1 to avoid
  # aiosqlite OperationalError races against the reconciler's
  # background poll. Memory: feedback_async_tests_need_event_not_sleep.
  ```

  ## 5. Verify

  ```bash
  uv run ruff check
  uv run ruff format --check
  uv run pytest -q --no-cov
  ```

  All must pass. Run the specific failing test 5x to verify
  no-longer-flaky:

  ```bash
  uv run pytest -q tests/test_plans_router_job_spawn.py::test_submit_plan_returns_500_when_image_unresolvable -- -p no:randomly --count=5
  ```

  (If `--count` isn't available — pytest-repeat — just run it twice
  manually.)

  ## 6. Commit + push

  Conventional commit:
  `fix(tests): gate reconciler in tests to avoid sqlite OperationalError race on GCP`

  Single commit. Push.

  ## Constraints

  - Don't change the reconciler's actual logic — just gate startup.
  - Don't reformat unrelated files.
  - Don't introduce sleep-based test sync ANYWHERE in this change.
  - If the failing test depends on the reconciler being running (e.g.,
    explicitly tests reconciler-driven status transition), this fix is
    WRONG — read the test carefully first. Only disable when the test
    doesn't need the reconciler.

  ## What this is NOT

  - NOT fixing the broader test isolation pattern across the test
    suite. Just this one race.
  - NOT changing production behaviour. The env var default-empty means
    production keeps starting the reconciler.

gate_marks:
  - unit

max_iterations: 4
