name: agent-add-command-queue-with-injection
description: |
  Today the agent spawns to do a task and runs to terminal — no way to
  interrupt, redirect, or talk to it mid-flight. This init adds a
  command queue that the SDK loop polls between turns, supporting:
  - cancel (graceful shutdown with reason)
  - pause / resume
  - inject_guidance (append a UserMessage to the conversation)

  Uses claude-agent-sdk's existing UserMessage injection — no new LLM
  infrastructure, no Redis/NATS. Just a DB table + endpoint + loop poll.

repo: leartech-automated-agent
branch: agent/command-queue
base: main

goal: |
  Make agent runs bidirectional — operator can interrupt + guide in
  flight.

  ## 1. Read first

  - `gate/agent/run_driver.py` — the SDK loop
  - `app/db/models.py` — initiative_runs schema
  - The agent-add-comprehensive-failure-diagnostics init (V5d) — same
    schema-evolution shape

  ## 2. Layer 1 — schema

  New table:
  ```
  CREATE TABLE agent_run_commands (
    id BIGSERIAL PRIMARY KEY,
    run_id VARCHAR(64) NOT NULL REFERENCES initiative_runs(id),
    command_type VARCHAR(32) NOT NULL CHECK (command_type IN
      ('cancel','pause','resume','inject_guidance')),
    payload JSONB,
    submitted_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    acked_at TIMESTAMPTZ,
    ack_message TEXT
  );
  CREATE INDEX ix_agent_run_commands_unacked ON agent_run_commands(run_id, submitted_at)
    WHERE acked_at IS NULL;
  ```

  ## 3. Layer 2 — endpoint

  ```
  POST /initiatives/{run_id}/commands
  body: { command_type: "cancel|pause|resume|inject_guidance", payload: {...} }
  returns: { command_id, submitted_at }

  GET /initiatives/{run_id}/commands?unacked_only=true
  returns: list of pending commands
  ```

  ## 4. Layer 3 — SDK loop integration

  Between every turn (just after a tool response), the agent calls:
  ```python
  unacked = await db.get_unacked_commands(run_id)
  for cmd in unacked:
      if cmd.type == 'cancel':
          await self.graceful_shutdown(reason=cmd.payload.get('reason'))
      elif cmd.type == 'pause':
          await self.pause_until_resume()
      elif cmd.type == 'inject_guidance':
          self.conversation.append_user_message(cmd.payload['text'])
      await db.ack_command(cmd.id, success=True)
  ```

  Polling latency = one turn boundary (~5-15s). Acceptable for v1.

  ## 5. Layer 4 — integrate with comprehensive diagnostics

  On cancel:
  - error column = `cancelled_by_operator: <reason>`
  - decision log records cancel event
  - conversation snapshot persisted

  ## 6. CLI extension (in scope for THIS init's PR)

  Add to leartech-agent:
  ```
  leartech-agent ops inject --run <id> "<text>"
  leartech-agent ops cancel --run <id> --reason "<text>"
  leartech-agent ops pause --run <id>
  leartech-agent ops resume --run <id>
  ```

  ## 7. Tests

  - test_cancel_command_terminates_gracefully: inject cancel mid-turn →
    agent writes reason + snapshot, exits without crashing
  - test_pause_resume: pause command → next turn waits; resume →
    continues
  - test_inject_guidance_appears_in_next_turn: inject "stop using
    ghcr" → agent's next turn sees it as a UserMessage
  - test_command_ack_recorded: cmd processed → acked_at set
  - test_multiple_unacked_commands_processed_in_order: queue of 3
    commands → all processed

  ## 8. Conventional commit
  `feat(agent): add bidirectional command queue (cancel/pause/inject)`

gate_marks: [unit, integration]
max_iterations: 14
