name: investigate-V1-real-cause
description: |
  V1 (agent-reconciler-detect-job-deleted) failed in V5 but unlike F1/D3/R1
  pattern (agent reports failed but PR shipped), V1 has NO PR and NO error
  captured. Orch's view-synthesis flagged it as possibly a real code/agent
  issue rather than the race pattern. This init investigates the run record,
  the init body, and either fixes a real issue OR documents that retry is
  safe.

repo: leartech-automated-agent
branch: agent/investigate-V1-cause
base: main

goal: |
  Diagnose why V1 (agent-reconciler-detect-job-deleted, run id
  37a118eaf143) failed without producing diagnostics.

  ## 1. Forensic read

  Read these directly:
  - `initiatives/agent-reconciler-detect-job-deleted.yaml` — the init
    body — is the goal reachable?
  - `gate/agent/run_driver.py` — what path leads to failed status with
    no PR + no error?
  - Memory `feedback_orch_cant_see_pod_problems` — closely related
  - `gate/agent/job_runner.py` — V1 was meant to ADD a reconciler;
    confirm it's not blocked by needing what we're adding

  ## 2. Decide outcome — agent must produce one of:

  ### Outcome A — Init body has a bug
  Fix the init body. Document the bug in the PR. V1 can be re-fired
  cleanly via the operator.

  ### Outcome B — Agent SDK loop has a bug for this init shape
  Identify the specific path (e.g. the init body asks for behavior the
  agent can't deliver). File a separate orch/agent code-fix PR.

  ### Outcome C — It's a race pattern same as F1/D3/R1
  Document why it was misclassified. Note that retry-via-operator is
  safe.

  ### Outcome D — Init is already obsolete given V5 work
  Document overlap with R2/R3/V4 functionality. Mark init as
  `superseded`. No retry needed.

  ## 3. Output

  PR that updates either the init body OR fixes the code path OR
  documents the outcome. Acceptance: the operator + Orch chat both
  know what to do next.

  ## 4. Conventional commit
  `fix(initiatives): clarify V1 agent-reconciler-detect-job-deleted` (or whatever the outcome dictates)

gate_marks: [unit]
max_iterations: 8
