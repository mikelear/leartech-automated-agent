name: auth-ui-add-about-page

description: |
  Adds a static About page (component + route + data-testid anchors). Like
  PR #39's profile demo, this deliberately omits the Playwright spec so the
  coverage-gap criterion fires and the agent applies the AI-drafted suggestion
  back into the same PR. Close-out validation of today's slice.

repo: leartech-auth-ui
branch: agent/add-about-page
base: main

goal: |
  Add a static About page accessible at `/about`. Three deliverables only — keep
  the change small.

  ## Files to create

  ### `src/app/about/about.component.ts`

  - `@Component({ standalone: false, selector: 'app-about', templateUrl: './about.component.html' })`
  - Class `AboutComponent` — no constructor injection needed (purely static content).
  - No `ngOnInit` body required; the page is static.

  ### `src/app/about/about.component.html`

  Four `data-testid` anchors:

      <div class="about-page" data-testid="about-page">
        <h2 data-testid="about-heading">About leartech</h2>
        <p data-testid="about-description">
          The leartech authentication UI is part of the modern leartech platform.
        </p>
        <button data-testid="contact-button">Contact us</button>
      </div>

  ## Wire into the app

  - Add `AboutComponent` to the appropriate NgModule's `declarations` (mirror how
    `HomeComponent` / `LoginComponent` / `ProfileComponent` are declared today —
    note PR #39 already added `ProfileComponent`, so use that as the closest pattern).
  - Add a route entry `{ path: 'about', component: AboutComponent }` to the routing
    module, in the same array as the existing routes.

  ## Constraints

  - **DO NOT add a Playwright spec.** The whole point is to demonstrate the
    coverage-gap criterion firing. Apply the AI-drafted spec from the gate's
    failure message verbatim.
  - **Always post `/hold` immediately after opening the PR** (per the calibration
    lesson `agent-prs-must-be-held-pending-review`). Don't apologise for it in
    the PR description — state plainly: "Held pending human review (`/hold` posted)."
  - **Never post `/hold cancel`** — humans only.
  - Use `npm install --legacy-peer-deps` if any npm operations are needed.
  - `git add <specific files>` only (never `-A`).
  - Conventional commits.
  - Do a *full-gate* run (no mark filter) before posting "Ready for client review"
    sticky — final-pass verification per `full-gate-verification-before-sticky` lesson.

gate_marks: []   # Full gate from the start.

max_iterations: 7
