name: fix-cosign-sign-idempotent-on-rekor-409
description: |
  Cosign-sign step in the python release task fails hard on Rekor
  HTTP 409 (transparency log entry already exists). When two release
  pipelineruns fire near-simultaneously for the same image digest, the
  first signs successfully, the second 409s, the whole pipeline fails.
  Hit on orchestrator main release 2026-06-10 (digest 0.0.43).
  Cosign-sign should treat 409 as "already signed, fine" not "fail."

repo: jx3-pipeline-catalog
branch: agent/cosign-idempotent-on-409
base: main

goal: |
  Make the cosign-sign step in `tasks/python/release.yaml` idempotent
  on Rekor 409 (and similar transparency-log "already exists" errors).

  ## 1. Read first

  - `tasks/python/release.yaml` — find the `step-cosign-sign` script
  - Memory `feedback_failed_release_must_not_propagate_pin` — adjacent
    failure mode (release fails mid-pipeline but downstream still runs)
  - Memory `feedback_pr_pytest_step_must_set_e` — the `set -e` discipline
    that's relevant to scripting any wrapper logic

  ## 2. Fix shape

  Wrap the cosign invocation:
  ```sh
  set -e

  # Capture cosign output; treat 409 / "already exists" as success
  if ! cosign_output=$(cosign sign ... 2>&1); then
    if echo "$cosign_output" | grep -qE "(409|already exists|equivalent entry)"; then
      echo "WARNING: cosign 409 — image already signed in transparency log. Treating as success."
      echo "$cosign_output" | head -10
      # exit 0 (success)
    else
      echo "$cosign_output" >&2
      exit 1
    fi
  fi
  ```

  Same fix applies to `tasks/<other-language>/release.yaml` if they
  use the same cosign pattern — only python/release.yaml is
  current scope.

  ## 3. Tests

  Manual test sequence (no in-pipeline test exists for this):
  - Trigger two near-simultaneous releases on a real repo (e.g. push
    empty commit + immediately push another) — second one should pass
    instead of fail.

  ## 4. Conventional commit
  `fix(python/release): cosign-sign idempotent on Rekor 409 conflict`

gate_marks: [unit]
max_iterations: 6
