name: platform-mcps-host-k8s-job
description: |
  V5 plan F6. Lift the near-duplicate `_build_job_manifest` + `submit_job`
  code from BOTH leartech-automated-agent/gate/agent/job_runner.py AND
  leartech-orchestrator/gate/orch/job_runner.py into a single hosted
  MCP server. ~470 LOC dedup across two repos. Ship LAST in Phase 1 —
  highest blast radius.

repo: leartech-platform-mcps
branch: agent/f6-host-k8s-job
base: main

goal: |
  Host the canonical Kubernetes Job spawn/poll/log surface as
  `k8s_job_mcp` so both agent and orch can stop carrying duplicates.

  ## 1. Read the pattern first

  Read these BEFORE writing any code:

  - `leartech-automated-agent/gate/agent/job_runner.py` lines 61-160 —
    `_build_job_manifest` + `submit_job` (the canonical agent side).
  - `leartech-orchestrator/gate/orch/job_runner.py` lines 50-140 — the
    near-duplicate orch side.
  - `leartech-platform-mcps/src/leartech_platform_mcps/registry.py` —
    the F2 register decorator.
  - `leartech-platform-mcps/src/leartech_platform_mcps/tekton_mcp/`
    server.py (F4) — shape for in-cluster batch/v1 access.
  - `leartech-platform-mcps/src/leartech_platform_mcps/k8s_mcp/`
    server.py (F5) — RBAC pattern + load_incluster_config call style.

  Diff the two job_runner.py files side-by-side. Pick the agent side
  as canonical (more recent, has the `LEARTECH_INITIATIVE_DEFAULT_IMAGE`
  env support). Note any orch-specific knobs and parametrize them.

  ## 2. Files to create

  - `src/leartech_platform_mcps/k8s_job_mcp/__init__.py`
  - `src/leartech_platform_mcps/k8s_job_mcp/server.py` — registers via
    F2 with scopes `['jobs:write', 'jobs:read', 'pods:read',
    'pods/log:read']`.
  - `src/leartech_platform_mcps/k8s_job_mcp/manifest.py` — the lifted
    `_build_job_manifest` helper.
  - `src/leartech_platform_mcps/k8s_job_mcp/runner.py` — spawn / poll /
    logs helpers.
  - `tests/test_k8s_job_mcp.py` — unit tests with mocked BatchV1Api.
  - `tests/smoke/test_k8s_job_mcp_e2e.sh` — sleep-Job smoke.

  ## 3. Tools to expose

  - `spawn_job_from_manifest(manifest: dict, namespace: str) ->
    {name, uid, created_at}` — POST to BatchV1Api.create_namespaced_job.
  - `list_jobs_by_label(namespace: str, label_selector: str) ->
    [{name, labels, status}]` — overlaps with F5 by design; keep both
    so callers can scope to job-write contexts.
  - `get_job_status(name: str, namespace: str) -> {active, succeeded,
    failed, conditions, start_time?, completion_time?}`.
  - `read_job_pod_logs(name: str, namespace: str, tail: int = 100) ->
    str` — finds the pod via job-name label, reads logs. Tail-capped
    at 10_000 lines.
  - `poll_job_until_terminal(name: str, namespace: str, timeout: int =
    600) -> {final_status, terminal_reason}` — uses
    `kubernetes_asyncio.watch` with timeout. Returns on Job conditions
    `Complete` or `Failed`.

  ## 4. Manifest schema (lifted, parametrized)

  `_build_job_manifest` MUST take all of these as args and produce a
  manifest with:
  - label `leartech.io/run-id: <run_id>` (mandatory; used by V1 + F5
    for lookups).
  - label `leartech.io/initiative: <initiative_name>` (mandatory).
  - env `LEARTECH_INITIATIVE_DEFAULT_IMAGE` propagated if set on the
    caller side (memory: chart override pattern from
    `project_session_2026_06_07` / phantom-pin recovery).
  - `backoffLimit: 0` (one-shot; no retries — Orch/agent orchestrate
    retries at a higher level).
  - `ttlSecondsAfterFinished` configurable (default 86400).
  - `restartPolicy: Never`.
  - Service account name + image from args (caller decides).

  ## 5. RBAC

  Extend `charts/leartech-platform-mcps/templates/rbac.yaml`:
  - Add verbs `create`, `delete` on `jobs` in `jx-staging` +
    `jx-production`.
  - Add `get`, `list`, `watch` on `pods` + `pods/log` (already on F5
    for read; ensure namespace coverage matches).
  - Document in the chart NOTES.txt that this MCP is write-capable —
    consumers must be scoped accordingly.

  ## 6. JX3 conventions

  - `set -e` in every multi-line script step. Memory:
    `feedback_pr_pytest_step_must_set_e`.
  - `kubernetes_asyncio.config.load_incluster_config()` is SYNC.
    Memory: `feedback_kubernetes_asyncio_load_incluster_is_sync`.
  - Async tests use `asyncio.Event`, not `sleep`. Memory:
    `feedback_async_tests_need_event_not_sleep`.

  ## 7. What this PR does NOT do

  - Does NOT delete the local copies in agent/orch — that's W1 and W2.
    F6 lands and bakes in preview FIRST; W1/W2 only fire once F6's
    e2e is green in preview-deploy.

  ## 8. Tests

  Unit:
  - `test_build_job_manifest_includes_run_id_label`
  - `test_build_job_manifest_propagates_default_image_env`
  - `test_build_job_manifest_backoff_limit_is_zero`
  - `test_spawn_job_from_manifest_creates_namespaced_job`
  - `test_get_job_status_summarises_conditions`
  - `test_read_job_pod_logs_finds_pod_by_label`
  - `test_poll_job_until_terminal_returns_on_complete`
  - `test_poll_job_until_terminal_returns_on_failed`
  - `test_poll_job_until_terminal_times_out`

  E2E (`tests/smoke/test_k8s_job_mcp_e2e.sh`, wired into `scripts/e2e.sh`):
  - Spawn a sleep Job (`image: busybox`, `command: ['sleep', '5']`).
  - Poll until terminal — assert `final_status == 'Complete'`.
  - Read logs — assert non-empty (busybox prints nothing, so use
    `command: ['sh', '-c', 'echo hello && sleep 5']`).
  - Cleanup.

  ## 9. Conventional commit
  `feat(k8s-job-mcp): host Job spawn/poll/log surface (dedups ~470 LOC across agent+orch)`

gate_marks: [unit, integration]
max_iterations: 12
