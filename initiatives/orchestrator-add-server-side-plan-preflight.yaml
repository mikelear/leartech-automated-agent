name: orchestrator-add-server-side-plan-preflight
description: |
  Server-side guarantee that a plan can fire before it ever leaves
  POST /plans. Today: plan submitted → marked running → plan-runner
  Job spawned → discovers catalog/repo/branch miss → escalates +
  exits + marks plan complete:failed. That's a ~3-5 min cycle (Job
  startup overhead) for what should be a 50ms validation.

  This init moves verify_plan_firability into POST /plans as a
  mandatory preflight. If any blocking_issue surfaces, return 422 with
  the specifics; plan never gets to submitted.

  Sister to orchestrator-chat-split-summarise-verify (which makes the
  verify primitive available to chat).

repo: leartech-orchestrator
branch: agent/add-server-side-plan-preflight
base: main

goal: |
  Make POST /plans preflight every plan against catalog + repos +
  branches before accepting submission.

  ## 1. Read first

  - `app/routers/plans.py` — current POST /plans handler, where the
    new preflight call inserts
  - `gate/orch/chat_tools.py` (post split-summarise-verify merge) —
    the verify_plan_firability implementation to factor out for
    server-side reuse
  - Memory: `feedback_plan_runner_pr_number_capture_gap` and related —
    the diagnostic surface that's been growing

  ## 2. Endpoint behavior change

  ### Before
  ```
  POST /plans
  body: { plan_body | plan }
  → 201 {plan_id, status: 'submitted'} immediately
  → plan-runner Job spawns
  → may fail 5 min later with catalog miss
  ```

  ### After
  ```
  POST /plans
  body: { plan_body | plan, skip_preflight?: bool }
  → server runs verify_plan_firability synchronously
  → if blocking_issues empty: 201 {plan_id, status: 'submitted', preflight: {...}}
  → if blocking_issues present: 422 with full check breakdown
  ```

  `skip_preflight: true` lets the operator bypass for unusual cases.
  Default false. Decision logged to plan_decisions (kind='preflight_skipped').

  ## 3. Failure modes

  ### Catalog miss
  ```
  422 {
    "error": "preflight_blocked",
    "blocking_issues": [
      {"kind":"catalog_miss","initiative":"X","detail":"Not in catalog. Add via PR or fire as inline_body."}
    ],
    "checks": {...}
  }
  ```

  ### Repo not found
  Surfaces equivalently. Includes the inferred default_branch + a
  suggestion ("did you mean leartech-mortgages-gw?")

  ### Branch conflict
  Detects branches already in use by an open PR. Returns the existing
  PR # so operator knows where to look.

  ## 4. Decision logging

  Every preflight run logs to plan_decisions:
  - kind='preflight_pass' for accepts
  - kind='preflight_blocked' for rejects with blocking_issues
  - kind='preflight_skipped' when skip_preflight=true was used

  Lets operator audit "why was that plan accepted?" / "why was this
  one rejected?" via the existing decision-log view.

  ## 5. CLI surface (no new commands needed)

  The existing `leartech-agent fire-plan <yaml>` and equivalent already
  POST to /plans — automatically inherits the new preflight.

  Optional flag: `--skip-preflight` for operator bypass; otherwise
  errors are surfaced and rendered in CLI in human-readable form.

  ## 6. Tests

  - `tests/test_post_plans_blocks_on_catalog_miss.py` — submit plan
    referencing missing init → 422 with blocking_issues
  - `tests/test_post_plans_blocks_on_repo_not_found.py`
  - `tests/test_post_plans_blocks_on_branch_conflict.py`
  - `tests/test_post_plans_skip_preflight_logs_decision.py`
  - `tests/test_post_plans_passes_when_all_checks_green.py`
  - `tests/test_preflight_returns_5xx_doesnt_block_submission.py` —
    if verify_plan_firability itself errors (DB down, etc.), DO NOT
    block submission. Log decision='preflight_error', proceed. Don't
    let infrastructure issues turn into operator UX issues.

  ## 7. Compatibility note

  Existing POST /plans clients (CLI, chat, scripts) keep working
  without code change — they just get 422 instead of 201 for malformed
  plans. The 422 response is structured so CLI can render it
  human-readably. No breaking change.

  ## 8. JX3 conventions

  Standard. New router code, decision logging extension, tests.

  ## 9. Conventional commit

  `feat(plans): server-side preflight on POST /plans (422 on catalog/repo/branch miss)`

depends_on: [orchestrator-chat-split-summarise-verify]
gate_marks: [unit, integration]
max_iterations: 10
