name: platform-mcps-add-mcp-registry-pattern
description: |
  Plug-in MCP registry pattern. Drop a module in `app/mcp_servers/`
  and it's auto-registered at `/mcp/<name>/sse`. Makes adding future
  MCPs trivial — no boilerplate, just write the server module.

repo: leartech-platform-mcps
branch: agent/add-mcp-registry
base: main

goal: |
  ## 1. Registry — `app/mcp_servers/__init__.py`

  At app startup, scan `app/mcp_servers/` for any module that exposes
  `build_mcp_server() -> MCPServer`. For each one, mount it at
  `/mcp/<module_name>/sse` via the SSE transport.

  Reference shape (mqube-mcp-connector pattern, per memory
  `reference_mqube_mcp_pattern.md`):

  ```python
  # app/mcp_servers/__init__.py
  from importlib import import_module
  from pathlib import Path
  from mcp.server.sse import SseServerTransport

  def discover_servers():
      base = Path(__file__).parent
      for module_path in base.glob('*.py'):
          if module_path.stem.startswith('_'): continue
          mod = import_module(f'app.mcp_servers.{module_path.stem}')
          if hasattr(mod, 'build_mcp_server'):
              yield (module_path.stem, mod.build_mcp_server())
  ```

  ## 2. Mount each at `/mcp/<name>/sse` — `app/main.py`

  In FastAPI startup, iterate `discover_servers()`, create an SSE
  transport per server, mount on the FastAPI app:

  ```python
  for name, server in discover_servers():
      transport = SseServerTransport(f'/mcp/{name}/sse/')
      app.mount(f'/mcp/{name}/sse', transport.handle_sse)
  ```

  ## 3. Register list endpoint — `GET /mcps`

  Returns all hosted MCPs + their tool names. Useful for catalog
  discovery + health checks:

  ```json
  [{"name": "tekton", "tools": ["list_pipelineruns_for_pr", "step_status", "step_logs"]}, ...]
  ```

  ## 4. Empty placeholder MCP — `app/mcp_servers/_example.py`

  Underscore-prefix so it's not auto-loaded. Documents the shape any
  contributor needs:

  ```python
  """Template for new MCP servers. Copy + rename, remove underscore."""
  from mcp.server import Server

  def build_mcp_server() -> Server:
      app = Server('example')
      @app.tool()
      async def my_tool(arg: str) -> dict:
          return {'echo': arg}
      return app
  ```

  ## 5. Tests — `tests/test_mcp_registry.py`

  - discover_servers finds modules in mcp_servers/
  - underscore-prefixed modules excluded
  - GET /mcps returns the right shape
  - Each mounted SSE endpoint responds (smoke; no full MCP handshake)

  ## 6. Conventional commit
  `feat(mcp): add plugin registry — drop module in mcp_servers/ → auto-mounted at /mcp/<name>/sse`

gate_marks: [unit]
max_iterations: 6
