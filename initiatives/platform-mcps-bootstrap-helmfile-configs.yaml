name: platform-mcps-bootstrap-helmfile-configs
description: |
  Add per-cluster GitOps helmfile configs so the platform-mcps chart
  can deploy on first release. Without these, jx-promote has no
  target to open a GitOps PR against → chart image gets built but
  never deploys.

  Mirrors the leartech-automated-agent helmfile config pattern. One
  PR per cluster (GCP first; AZ as a sibling follow-up if scoped
  separately). Critical blocker for W1+W2 — registering platform-mcps
  in consumer catalogs before the service is reachable would brick
  both agent and orch.

repo: jx-build-cluster-gsm
branch: agent/platform-mcps-helmfile-config-gcp
base: main

goal: |
  Add helmfile config for leartech-platform-mcps on GCP cluster so
  jx-promote can target it for chart deployment.

  ## 1. Read the pattern first

  Read these files in jx-build-cluster-gsm/:

  - `helmfiles/jx-staging/configs/leartech-automated-agent.yaml` — the
    canonical multi-cluster service pattern (after the 2026-06-09
    cleanup)
  - `helmfiles/jx-staging/configs/leartech-orchestrator.yaml` — even
    simpler (no per-cluster overrides)
  - `helmfiles/jx-staging/source-config.yaml` — where the chart entry
    points are registered
  - `helmfiles/jx-staging/jx-apps.yml` — wiring (if used)

  Read platform-mcps repo (clone if needed) to understand the chart
  shape and what values are needed:
  - `leartech-platform-mcps/charts/leartech-platform-mcps/Chart.yaml`
  - `leartech-platform-mcps/charts/leartech-platform-mcps/values.yaml`

  ## 2. Files to create / edit

  - `helmfiles/jx-staging/configs/leartech-platform-mcps.yaml` —
    minimal values config (mirrors leartech-orchestrator's simplicity
    since platform-mcps has no DB initially):

    ```yaml
    # leartech-platform-mcps — GCP jx-staging values.
    image:
      repository: us-central1-docker.pkg.dev/product-first/oci/leartech-platform-mcps
      pullPolicy: IfNotPresent

    # platform-mcps has no DB; only ESO toggle for LEARTECH_PLATFORM_MCPS_GH_TOKEN
    # (used by github-mcp pushed in F3).
    externalSecrets:
      gcp:
        enabled: true
        secrets:
          - name: leartech-platform-mcps-gh-token
            data:
              - name: token
                key: leartech-platform-mcps-gh-token
      azure:
        enabled: false
    ```

  - `helmfiles/jx-staging/source-config.yaml` — add entry pointing at
    mikelear/leartech-platform-mcps:main with the chart path

  - `helmfiles/jx-staging/configs/leartech-platform-mcps.yaml` ALSO
    references LEARTECH_PLATFORM_MCPS_GH_TOKEN as an env source — the
    GSM key must be operator-seeded BEFORE this lands (document in PR
    body).

  ## 3. JX3 conventions per memory

  - `optional: true` on any secretKeyRef OR use ExternalSecret
    materialization (memory: feedback_chart_secretref_must_be_optional_for_previews)
  - Mirrors AZ helmfile (no override pattern unless needed)
  - The GitOps repo accepts direct admin-merge for small config
    additions (you've authorized this pattern this session)

  ## 4. Operator-side prerequisites (document in PR body)

  Before this PR merges, the operator must:
  - GCP: `gcloud secrets create leartech-platform-mcps-gh-token` with
    a PAT that has package:write on ghcr.io (use LeartechKeeperBot for
    consistency with tekton-git pattern)
  - Same on AZ side as a sibling init (`platform-mcps-bootstrap-helmfile-config-az`)

  ## 5. Tests

  - PR-time: helmfile config valid YAML (likely no real CI runs on
    GitOps repo)
  - Post-merge: jx-boot reconciles + verify
    `helmfiles/jx-staging/configs/leartech-platform-mcps.yaml` is in
    the rendered config-root

  ## 6. Conventional commit
  `chore(platform-mcps): add helmfile config for GCP jx-staging deploy`

gate_marks: [unit]
max_iterations: 8
