# mortgages-gw-add-changelog-stub — proof-of-pipeline test initiative
#
# First initiative against leartech-mortgages-gw (cloned from
# leartech-go-service-template on 2026-05-19 as Phase 0 of the mortgages-MCP
# spike). Smallest viable change — adds CHANGELOG.md at repo root.
#
# Sister initiative of `mortgages-api-add-changelog-stub`. Both can fire in
# parallel since each targets a different repo with zero cross-dependencies.
#
# Run with: `make initiative INITIATIVE=mortgages-gw-add-changelog-stub`

name: mortgages-gw-add-changelog-stub

description: |
  Add a CHANGELOG.md stub at repo root of leartech-mortgages-gw. One new
  markdown file. No code changes.

  Proves the 11-check presubmit + 5-SDK release chain runs cleanly on the
  freshly-bootstrapped gateway repo. Parallel-safe with
  `mortgages-api-add-changelog-stub`.

repo: leartech-mortgages-gw
branch: agent/add-changelog-stub
base: main

goal: |
  Create a single new file: `CHANGELOG.md` at the repo root.

  ## File content

  Use Keep-a-Changelog format. Exact body:

      # Changelog

      All notable changes to leartech-mortgages-gw are documented here.

      Format: [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).

      ## [Unreleased]

      ### Added

      - Stub CHANGELOG.md (this file).

      ## [0.0.1] — 2026-05-19

      ### Added

      - Initial bootstrap from `leartech-go-service-template` (Phase 0 of the
        mortgages-MCP spike). Golden Service spine inherited verbatim. The
        gateway will host two ingress protocols once Phase 2 lands: `/mcp`
        (Model Context Protocol over Streamable HTTP, consumed by Claude /
        ChatGPT / any MCP-compliant client) and `/api/v1/*` (REST surface for
        future SPA / mobile / partner clients). Both share a single auth /
        audit / rate-limit middleware stack. Downstream calls go to
        `leartech-mortgages-api` via its auto-generated Go SDK.

  ## Constraints

  - **Single new file only.** Do not modify ANY other file.
  - Conventional commit: `docs: add CHANGELOG.md`
  - Open PR with a one-paragraph description referencing Phase 0 of the
    mortgages-MCP spike.
  - Do NOT add Markdown formatters, linters, or pre-commit hooks for the
    new file. Just write the markdown.

  ## What this is NOT

  - Not a docs audit. Don't survey other docs.
  - Not an opportunity to expand the version history beyond v0.0.1.
  - Not a code change. No Go edits, no MCP handler wiring (that's Phase 2,
    a separate initiative).
  - Not a chance to rewrite existing files like README.md or CLAUDE.md.

  ## Why this initiative exists

  leartech-mortgages-gw was bootstrapped from the canonical Go template on
  2026-05-19 and v0.0.1 was seeded. No PR has been opened against the repo
  yet. This trivial initiative is the proof-of-pipeline. If green, every
  subsequent Phase 2 initiative (`mortgages-gw-wire-mcp-handler`,
  `mortgages-gw-add-tool-search-products`, etc.) inherits the same chain.

  Expected pipeline outcome: all 11 checks pass; postsubmit release cuts
  `v0.0.2-{gcp,az}`; openapi-generation publishes
  `@mikelear/leartech-mortgages-gw-{angular,typescript}` + Go/Python/Rust
  mono-repo PRs for the first time.
  Expected agent behaviour: ~2 turns.

gate_marks:
  - unit

max_iterations: 4
