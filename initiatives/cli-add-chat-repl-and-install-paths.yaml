name: cli-add-chat-repl-and-install-paths
description: |
  Operator should be able to:
  1. Run the leartech-agent CLI WITHOUT cloning the repo (pipx/pip install)
  2. Point the CLI at any cluster's orchestrator (staging today, prod
     tomorrow) via env/flag — no source code edit
  3. Enter an interactive chat REPL: `leartech-agent chat` opens a
     persistent conversation with Orch /chat, REPL maintains the
     conversation_id across turns

  The Orch /chat endpoint is ALREADY DEPLOYED at POST /chat with
  conversation_id continuity proven this session ($0.015/turn, persists
  context across questions). This init lights up the operator-facing
  doorway.

repo: leartech-automated-agent
branch: agent/cli-chat-repl-and-install
base: main

goal: |
  Ship the CLI as an installable, URL-configurable, chat-capable
  operator surface.

  ## 1. Read first

  - `app/agent_cli/` — current Click subcommand skeleton (from PR #95)
  - `app/agent_cli/transport.py` — current HTTP transport layer
  - `app/agent_cli/main.py` — entry point
  - `app/routers/chat.py` — Orch's /chat endpoint we'll relay to (in the
    leartech-orchestrator repo)

  ## 2. Three pieces of work

  ### Piece A — `leartech-agent chat` REPL subcommand

  Add `app/agent_cli/commands/chat.py`:

  ```python
  @click.command()
  @click.option('--continue', 'continue_id', help='Resume a prior conversation by id')
  @click.option('--cluster', type=click.Choice(['gcp','az']), default='gcp')
  def chat(continue_id: str | None, cluster: str) -> None:
      """Open an interactive chat REPL with Orch."""
      conv_id = continue_id
      while True:
          msg = prompt_session.prompt("you> ")
          if msg.strip() in ('exit', 'quit', ':q'): break
          response = transport.post('/chat', json={
              'message': msg,
              'conversation_id': conv_id,
          })
          conv_id = response['conversation_id']
          render_reply(response['turn'])
  ```

  Use `prompt_toolkit` for REPL (history, edit, paste). Rich for
  rendering responses. Slash commands inside the REPL:
  - `:exit` / `:q` → leave
  - `:save` → write transcript to file
  - `:new` → start fresh conversation
  - `:cost` → show conversation total cost

  ### Piece B — configurable URL (env + flag, no code edit)

  CLI transport reads orchestrator URL from (in priority order):
  1. `--orch-url` flag
  2. `LEARTECH_ORCH_URL` env var
  3. `~/.config/leartech-agent/config.yaml` (a `clusters:` map with
     names like `gcp-staging`, `az-staging`, `gcp-prod`)
  4. Default to staging URL for the chosen cluster

  Same shape needed for the future MCP-for-Claude surface — the
  config file should be reusable.

  Example config:
  ```yaml
  default_cluster: gcp-staging
  clusters:
    gcp-staging:
      orch_url: https://leartech-orchestrator-jx-staging.jx.leartech.com
      agent_url: https://leartech-automated-agent-jx-staging.jx.leartech.com
    az-staging:
      orch_url: https://leartech-orchestrator-jx-staging.az.leartech.com
      agent_url: https://leartech-automated-agent-jx-staging.az.leartech.com
  ```

  CLI subcommand: `leartech-agent config set-cluster <name> --orch-url ...`
  CLI subcommand: `leartech-agent config show`
  CLI subcommand: `leartech-agent config use-cluster <name>`

  ### Piece C — installable via pipx (no repo clone)

  Two distribution paths:

  **Path 1 (immediate, no PyPI):**
  Document `pipx install git+https://github.com/mikelear/leartech-automated-agent.git#main`
  in the README. Operator runs that once; gets the CLI globally.

  **Path 2 (durable, PyPI):**
  Add a release-time step that publishes the wheel to PyPI as
  `leartech-agent` (private index acceptable). Add a release.yaml task
  for this; out of scope for THIS init unless straightforward.

  Verify both paths produce a working `leartech-agent` binary on PATH
  that can hit the staging orch with default config.

  ## 3. Updated recent-by-default behavior on subcommands

  While editing the CLI, ensure these defaults:
  - `leartech-agent runs list` → default `--since 24h`, `--all` flag to show history
  - `leartech-agent plans list` → default `status IN (running, submitted)`, `--all` to show all
  - `--since 7d` and `--since 2026-06-01` formats both accepted

  ## 4. Tests

  - test_chat_repl_continues_conversation: send 2 messages →
    second one references first context
  - test_config_priority_order: flag > env > config file > default
  - test_pipx_installable_smoke: scripts/e2e.sh extension that does
    `pipx install --force git+local-clone` then runs `leartech-agent --version`
  - test_runs_list_defaults_to_recent: confirm filter behavior
  - test_chat_handles_orch_down: graceful error when /chat unreachable

  ## 5. JX3 conventions

  - `set -e` everywhere
  - `--all` and `--since` flags are positional, not subcommand-style
  - Match Click + rich patterns already in app/agent_cli/

  ## 6. Conventional commit
  `feat(cli): chat REPL + installable + URL-configurable surface`

gate_marks: [unit, integration]
max_iterations: 12
