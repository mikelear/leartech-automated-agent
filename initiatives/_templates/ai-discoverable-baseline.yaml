# TEMPLATE: Make an Angular site AI-discoverable (baseline — Layers 1-3 + 5).
# Copy to initiatives/<service>-ai-baseline.yaml and replace the <PLACEHOLDERS>.
# Implements hub/shared-rules/ai-discoverable-websites.md baseline.
# Pairs with: ai-content-page.yaml (per-page JSON-LD) and mcp-advertise.yaml (Layer 4).

name: <SERVICE>-ai-baseline

description: |
  Apply the AI-Discoverable Websites baseline to <SERVICE>: prerendered HTML,
  AI-crawler-friendly robots.txt, sitemap, llms.txt, site-wide Schema.org
  JSON-LD, and Open Graph / Twitter Card meta. See
  hub/shared-rules/ai-discoverable-websites.md.

repo: <SERVICE>                              # e.g. leartech-mortgagesourcing-web
branch: agent/ai-baseline
base: main
language: angular

goal: |
  Make every public route crawlable and parseable by AI clients (GPTBot,
  ClaudeBot, PerplexityBot, etc.) WITHOUT a browser. Read the existing app
  first to match local conventions (standalone vs NgModule, routing file).

  ## 1. Enable prerendering / SSG (Layer 1 — Crawlable)

  - Add `@angular/ssr` and enable PRERENDER (static-site-generation), not
    per-request SSR. The build must emit one static `.html` per route into the
    browser dist that the `leartech-nginx` base image already serves. Do NOT
    add a Node runtime to the Dockerfile or chart.
  - In `angular.json`, set the production build to prerender all routes
    (`"prerender": true`, `"ssr": false` or `outputMode: static` per the
    installed Angular version). List every public route so each is emitted.
  - Verify locally: `npm run build` then confirm `dist/<app>/browser/<route>/index.html`
    contains real content (not an empty `<app-root>`).

  ## 2. Per-route titles + meta descriptions

  - Set a unique `<title>` and `<meta name="description">` per route using the
    Angular `Title` / `Meta` services (in each component's `ngOnInit`, or via
    route `data` + a small resolver). These must be present in the prerendered
    HTML.
  - Add `<link rel="canonical">` per route.

  ## 3. robots.txt (Layer 1) — create `public/robots.txt`

  - Explicitly ALLOW the AI crawlers and link the sitemap. Use:
      User-agent: GPTBot
      Allow: /
      User-agent: OAI-SearchBot
      Allow: /
      User-agent: ChatGPT-User
      Allow: /
      User-agent: ClaudeBot
      Allow: /
      User-agent: Claude-User
      Allow: /
      User-agent: anthropic-ai
      Allow: /
      User-agent: PerplexityBot
      Allow: /
      User-agent: Google-Extended
      Allow: /
      User-agent: Applebot-Extended
      Allow: /
      User-agent: CCBot
      Allow: /
      User-agent: *
      Allow: /
      Sitemap: https://<DOMAIN>/sitemap.xml
  - `public/` is baked into the build (angular.json assets), so it serves at root.

  ## 4. sitemap.xml (Layer 3) — create `public/sitemap.xml`

  - List every public route as `<url><loc>https://<DOMAIN>/<route></loc><lastmod>...</lastmod></url>`.

  ## 5. llms.txt (Layer 3) — create `public/llms.txt`

  - Markdown per llmstxt.org: an `# <Site name>` H1, a `>` blockquote one-line
    summary, then a section listing each key page as
    `- [Title](https://<DOMAIN>/<route>): one-line description`.
  - Include an `## MCP` section IF the site has an MCP server (otherwise omit;
    mcp-advertise.yaml adds it).

  ## 6. Site-wide JSON-LD + Open Graph (Layer 2)

  - Inject an `Organization` + `WebSite` Schema.org JSON-LD block into the
    prerendered HTML head (a shared component or index.html partial), with
    name, url, logo, and `sameAs`.
  - Add Open Graph + Twitter Card meta defaults (`og:title`, `og:description`,
    `og:type=website`, `og:url`, `og:image`, `twitter:card=summary_large_image`)
    overridable per route.

  ## Constraints
  - Use `npm install --legacy-peer-deps` for any npm operations.
  - Do NOT add a Node SSR server, Express, or change the runtime base image.
    SSG only — output stays static files for nginx.
  - Do NOT modify `.lighthouse/jenkins-x/`, the Helm chart, health probes, or
    the runtime ConfigMap wiring.
  - `git add <specific files only>` (never -A). Conventional commit
    `feat(ai): add AI-discoverability baseline`.
  - Always post /hold immediately after opening the PR per
    agent-prs-must-be-held-pending-review.

  ## What this is NOT
  - Not per-request SSR. Not a Node runtime. Static prerender only.
  - Not per-page content JSON-LD (FAQPage/HowTo) — that's ai-content-page.yaml.
  - Not the MCP setup page — that's mcp-advertise.yaml.
  - Not new product/marketing copy — only the discoverability scaffolding.

gate_marks: []

max_iterations: 8
