name: orchestrator-extend-healthz-to-cover-gh-tool-paths
description: |
  Surfaced 2026-06-11 during V5g delivery. After v5h-chat-platform-mcps-parity
  landed (PR #95), Orch chat's startup health check passes — it correctly
  probes platform-mcps `/healthz`. But chat's GH-API tools (view_live_pr_state,
  pr_get_diff, pr_get_metadata, post_pr_chatops) STILL return `pr_not_found`
  for PRs that demonstrably exist. The MCP-server probe doesn't verify the
  per-tool GH-API code path through the chat tools themselves.

  This init extends the existing mcp_status.py pattern with synthetic
  end-to-end probes for each chat tool that touches GitHub. Per-tool
  probes surface in `/healthz`. Operators (and Orch chat itself via
  diagnose_plan) get evidence-based failure classification when GH tools
  misbehave.

  Lesson: feedback_health_check_must_cover_actual_tool_paths.

repo: leartech-orchestrator
branch: agent/extend-healthz-gh-tool-paths
base: main

goal: |
  Make /healthz prove tool functionality, not just dependency reachability.

  ## 1. Read first

  - `gate/orch/introspection/mcp_status.py` — the existing v5h pattern
    (probes MCP servers via /healthz)
  - `gate/orch/chat_tools.py` — the chat tools that touch GitHub directly
    (separate from platform-mcps proxy tools)
  - `app/routers/health.py` — current /healthz surface
  - Memory: `feedback_health_check_must_cover_actual_tool_paths`
  - Memory: `feedback_orch_chat_gh_tool_access_still_broken_after_v5h`

  ## 2. New probe module: `gate/orch/introspection/chat_tool_probes.py`

  Mirror `mcp_status.py` shape. For each chat tool that touches GitHub,
  add a synthetic probe:

  ```
  async def probe_view_live_pr_state(client, gh_token) -> ProbeResult:
      """Read PR #1 in a known-test repo. Expect 200 + correct JSON shape."""
      ...

  async def probe_pr_get_metadata(client, gh_token) -> ProbeResult:
      """Same idea — metadata-only call against a stable test PR."""
      ...

  async def probe_post_pr_chatops(client, gh_token) -> ProbeResult:
      """POST a test comment to a sandbox PR + immediately DELETE it.
      Verifies write capability. Use repo mikelear/leartech-healthz-sandbox
      (or similar) as the target; create if doesn't exist."""
      ...
  ```

  Each probe:
  - Returns `{tool_name, status: ready|down|missing_auth, latency_ms, error?}`
  - 2-second timeout each (matches MCP probe convention)
  - Best-effort — never raises
  - Cache results for 30-60s to avoid hammering GitHub API

  ## 3. Sandbox/test repo for write probes

  Write probes need a target. Options:
  - Create `mikelear/leartech-healthz-sandbox` as a tiny repo with a
    pinned issue + auto-delete-after-7d cron
  - Use an existing low-traffic repo (e.g. leartech-platform-mcps's #1)
    that won't churn

  Specify in the init body which is preferred — operator decides at
  review time. Default to read-only probe of `mikelear/leartech-orchestrator`
  PR #1 (known to exist).

  ## 4. /healthz extension

  Current `/healthz` returns:
  ```
  { "status": "ok", "service": "leartech-orchestrator", "version": "0.0.X" }
  ```

  Extended:
  ```
  {
    "status": "ok" | "degraded",
    "service": "leartech-orchestrator",
    "version": "0.0.X",
    "checks": {
      "database": {"status": "ok"},
      "mcp_servers": {
        "tekton": {"status": "ready"},
        "pr_context": {"status": "ready"}
      },
      "chat_tools": {
        "view_live_pr_state": {"status": "ready", "latency_ms": 120},
        "pr_get_metadata": {"status": "ready", "latency_ms": 90},
        "post_pr_chatops": {"status": "missing_auth", "error": "GH_TOKEN_INVALID"}
      }
    }
  }
  ```

  `status` is `degraded` if any chat_tool is down/missing_auth. Service
  still serves non-affected requests; affected chat tools return their
  per-tool error.

  ## 5. Tests

  - `tests/test_chat_tool_probes_view_live_pr_state.py` — mock httpx;
    assert 200 → ready, 401 → missing_auth, 5xx → down, timeout → down
  - `tests/test_chat_tool_probes_handle_missing_token.py` — no GH_TOKEN
    env → all GH probes return missing_auth immediately, no HTTP call
  - `tests/test_chat_tool_probes_cached_results.py` — second call within
    cache window returns cached
  - `tests/test_healthz_surfaces_chat_tool_status.py` — /healthz includes
    chat_tools block + degraded status when any tool down
  - `tests/test_healthz_degraded_when_any_chat_tool_down.py` — partial
    failure → status='degraded' not 'down'

  ## 6. Integration with V5g version-visibility tool

  V5g shipped `get_version_state` (PR #108) that returns deployed image
  + release skew. Extend it to include the chat_tool probe results so
  diagnose_plan can correlate "chat says pr_not_found" with "your
  post_pr_chatops tool reports missing_auth".

  ## 7. JX3 conventions

  Standard. New module under `gate/orch/introspection/`. /healthz lives
  in `app/routers/health.py` (or `app/main.py` if no router).

  ## 8. Conventional commit

  `feat(healthz): add synthetic probes for chat GH-API tools — beyond MCP reachability`

gate_marks: [unit, integration]
max_iterations: 8
