# webcoder-ui-add-initiatives-tab
#
# First UI piece of the agent-dashboard arc. Adds an Initiatives section
# to the project-detail page (/projects/:id), powered by hardcoded mock
# data for v1. The data shape MUST match the locked contract from
# webcoder-service's internal/handlers/initiatives.go (InitiativeRun) so
# that swapping mock for real SDK calls later is a one-file change.
#
# Reference contract:
#   ~/.claude/projects/-Users-mikelear-leartech-webCoder/memory/project_agent_dashboard_eventing.md
#
# Run with: `make initiative INITIATIVE=webcoder-ui-add-initiatives-tab`

