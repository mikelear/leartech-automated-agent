  ## Files to create

  ### `src/app/initiatives/initiative-run.model.ts`

  Locked TypeScript interface mirroring webcoder-service's
  `internal/handlers/initiatives.go` `InitiativeRun` struct exactly. Field
  names use the JSON-tagged camelCase form (so direct JSON binding
  works when the SDK swap happens).

  ```typescript
  /**
   * Represents one agent-initiative run. Mirrors the locked label +
   * annotation contract on the K8s Job that backs each run; field
   * names match the JSON shape webcoder-service's GET /api/v1/
   * initiatives/:runId returns. Single source of truth for both the
   * mock data in <app-initiatives-list> AND any future SDK-driven
   * consumer — keep this model and the Go struct in lockstep.
   */
  export interface InitiativeRun {
    runId: string;
    initiative: string;
    tenant: string;
    projectId: string;
    state: InitiativeState;
    iteration: number;
    budgetIter: number;
    sourcePr?: string;
    triggeredBy: string;
    targetPr?: string;
    assets: InitiativeAssets;
    deferReason?: string;
    createdAt: string;       // RFC3339
    lastUpdate: string;      // RFC3339
  }

  export type InitiativeState =
    | 'queued'
    | 'running'
    | 'iterating'
    | 'awaiting-human'
    | 'done'
    | 'deferred'
    | 'killed';

  export interface InitiativeAssets {
    trace?: string;
    coverage?: string;
    stickyComment?: string;
  }
  ```

  ### `src/app/initiatives/initiatives-api.adapter.ts`

  Thin Angular service that wraps the SDK's `InitiativesService` with
  human-friendly method names. Consumers (components, future shared
  state) inject THIS adapter, never the raw SDK service. Reasons:
  - SDK method names are auto-derived from REST paths (e.g.
    `apiV1ProjectsProjectIdInitiativesPost`) — verbose, OpenAPI-shape
    sensitive. Adapter gives stable, ergonomic names.
  - Adapter is the natural mock-vs-real seam — initiative #2 returns
    mock arrays from the adapter; a follow-up flips it to delegate to
    `InitiativesService`. UI consumers don't change.
  - Centralizes any auth-header injection, error mapping, or
    Observable-to-Signal conversion in one file.

  Until SDK 0.1.5 lands in webcoder-ui's package.json, the adapter
  RETURNS HARDCODED MOCK DATA — the SDK import is added in a separate
  follow-up. So this initiative does NOT add `@mikelear/webcoder-service-angular`
  to package.json.

  ```typescript
  import { Injectable, signal } from '@angular/core';
  import { Observable, of, delay } from 'rxjs';
  import { InitiativeRun, InitiativeState } from './initiative-run.model';

  /**
   * Public-facing API for the initiatives feature. Components inject THIS
   * service, never the raw SDK service. Stable method names survive SDK
   * regen (auto-derived names like apiV1ProjectsProjectIdInitiativesPost
   * change with OpenAPI tweaks; these don't).
   *
   * v1: returns hardcoded MOCK_RUNS with simulated network latency.
   * Follow-up wires real `InitiativesService` from
   * @mikelear/webcoder-service-angular@0.1.5+ behind the same surface.
   */
  @Injectable({ providedIn: 'root' })
  export class InitiativesApiAdapter {
    /** List initiative runs for a project. */
    listForProject(projectId: string): Observable<InitiativeRun[]> {
      return of(MOCK_RUNS.filter((r) => r.projectId === projectId)).pipe(delay(150));
    }

    /** Get one run by id. */
    getRun(runId: string): Observable<InitiativeRun | undefined> {
      return of(MOCK_RUNS.find((r) => r.runId === runId)).pipe(delay(100));
    }

    /** Trigger a new run. (Stub — real wiring comes with SDK swap.) */
    triggerInitiative(_projectId: string, _initiativeYaml: string): Observable<{ runId: string; state: InitiativeState }> {
      return of({ runId: 'agent-init-mock-pending', state: 'queued' as InitiativeState }).pipe(delay(200));
    }

    /** Stream / fetch logs for a run. */
    streamLogs(_runId: string, _since?: number): Observable<string> {
      return of('(mock log output — real wiring comes with SDK swap)\n').pipe(delay(50));
    }

    /** Kill a running run. */
    killRun(_runId: string): Observable<void> {
      return of(undefined).pipe(delay(100));
    }
  }

  // MOCK_RUNS — 5–7 entries covering states (queued, running, iterating,
  // awaiting-human, done, deferred, killed). Move OUT of the component
  // into this file so all mock data lives in one place. Make at least 2
  // runs share projectId='demo' so the project-detail page renders rows.
  const MOCK_RUNS: InitiativeRun[] = [
    // ... agent fills in 5–7 realistic InitiativeRun objects
  ];
  ```

  Method-name contract for the adapter (matching the dashboard memo's API surface):

  | Adapter method | Underlying SDK method (when wired) |
  |---|---|
  | `listForProject(projectId)` | `apiV1ProjectsProjectIdInitiativesGet(projectId)` |
  | `getRun(runId)` | `apiV1InitiativesRunIdGet(runId)` |
  | `triggerInitiative(projectId, body)` | `apiV1ProjectsProjectIdInitiativesPost(projectId, body)` |
  | `streamLogs(runId, since)` | `apiV1InitiativesRunIdLogsGet(runId)` |
  | `killRun(runId)` | `apiV1InitiativesRunIdDelete(runId)` |

  ### `src/app/initiatives/initiatives-api.adapter.spec.ts`

  Unit tests covering each adapter method:
  - `listForProject('demo')` returns ≥2 entries (those tagged `projectId: 'demo'`).
  - `listForProject('non-existent')` returns `[]`.
  - `getRun(<known runId>)` returns the matching run.
  - `getRun('non-existent')` returns `undefined`.
  - `triggerInitiative` resolves with shape `{runId, state: 'queued'}`.
  - `streamLogs` resolves with a non-empty string.
  - `killRun` resolves to undefined.

  ### `src/app/initiatives/initiatives-list.component.ts`

  Standalone Angular component, inline template (match the rest of the
  app — pr.component.ts uses inline templates).

  - Selector: `app-initiatives-list`
  - Inputs: `runs = input<InitiativeRun[]>([])` (signal-based input).
  - Renders:
    - If `runs().length === 0`: empty-state element with `data-testid="initiatives-empty-state"` and message "No initiatives yet for this project."
    - Otherwise: list/grid of run cards.
  - Each run card carries `[data-testid]="'initiatives-list-row'"` AND a stable per-id testid `[data-testid]="'initiatives-list-row-' + run.runId"`.
  - Each run card displays:
    - Initiative name (`run.initiative`)
    - State pill — `[data-testid]="'initiatives-state-pill-' + run.state"` plus a class derived from state for colour (`pill-running`, `pill-done`, etc.)
    - Iteration: `"{{ run.iteration }} / {{ run.budgetIter }}"`
    - Triggered by: `run.triggeredBy`
    - If `run.targetPr` set: link "View PR" with `data-testid="initiatives-target-pr-link"` and `href` set to `run.targetPr`
    - Last update: relative time string (e.g., "2 minutes ago" — keep simple, format as ISO if relative formatting is heavy)
  - Component uses `ChangeDetectionStrategy.OnPush`.

  ### `src/app/initiatives/initiatives-list.component.spec.ts`

  - Standard Angular unit test — `TestBed.configureTestingModule({ imports: [InitiativesListComponent] })`.
  - At minimum:
    - Renders empty state when `runs = []`.
    - Renders one row per item when given 3 mock runs.
    - State pill has correct class for each state.
    - Target-PR link rendered only when `run.targetPr` set.
  - Use `data-testid` selectors throughout — never tag-name selectors.

