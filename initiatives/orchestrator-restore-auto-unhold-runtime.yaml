name: orchestrator-restore-auto-unhold-runtime
description: |
  PR #41 added auto_unhold field to Plan schema; plan v3 (3526c64313e3)
  validation accepted it but zero `/hold cancel` posts fired during the
  run. Runtime path missing or guarded. Memory:
  feedback_auto_unhold_did_not_fire.

repo: leartech-orchestrator
branch: agent/restore-auto-unhold-runtime
base: main

goal: |
  Make `auto_unhold: true` actually post /hold cancel on each step's PR
  after the agent run terminates.

  ## 1. Diagnose first

  Read `gate/orch/plan_runner.py` and `gate/orch/plan_prompt.py` for any
  existing auto_unhold logic. If absent: implement fresh per PR #41's
  spec. If present but gated incorrectly: identify the guard and remove
  or relax it.

  ## 2. Implementation

  After plan-runner observes a step's agent run terminate AND the
  agent's run record has pr_number populated (use the fix from sister
  init `orchestrator-fix-plan-runner-pr-link` for reliability):

  ```python
  if plan.auto_unhold and step.pr_number:
      await _post_hold_cancel(step.pr_repo, step.pr_number, gh_token=os.environ['LEARTECH_ORCH_GH_TOKEN'])
      await append_decision(sess, plan_id, kind='hold_cancel', meta={'pr_number': step.pr_number})
  ```

  Use `httpx.AsyncClient` to POST `/repos/{owner}/{repo}/issues/{n}/comments` with body `/hold cancel`. Tolerate 5xx with retry-once. Log warning on failure but don't fail the step.

  ## 3. Plan-runner prompt update

  Add to `gate/orch/plan_prompt.py`:
  > "If plan.auto_unhold is True and the just-completed step has a PR,
  > post `/hold cancel` as a comment via the gh API using
  > LEARTECH_ORCH_GH_TOKEN. Record kind='hold_cancel' in plan_decisions."

  ## 4. Tests

  - test_auto_unhold_posts_hold_cancel — mock httpx, assert POST call
  - test_auto_unhold_records_decision — assert plan_decisions row
  - test_auto_unhold_false_no_post — default behavior preserved
  - test_auto_unhold_no_pr_no_post — skip if pr_number is null
  - test_auto_unhold_swallows_5xx — failure logs warning, doesn't fail step

  ## 5. Conventional commit
  `fix(plans): restore auto_unhold runtime — post /hold cancel post-agent-terminal`

gate_marks: [unit]
max_iterations: 6
