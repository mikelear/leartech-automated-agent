# auth-ui-add-profile-page — DEMO of the full feedback loop.
#
# Adds a UI surface (component + route + data-testid attrs) WITHOUT writing a
# Playwright spec. Fires `test_ui_changes_have_playwright_coverage` which produces
# an AI-drafted suggested spec in its failure message. The agent then iterates by
# applying the suggestion, committing the spec, and re-running the gate.
#
# This is the worked example of qa-architecture's "AI coverage scanner" pattern —
# code change drives test surface drift, drift triggers AI-drafted coverage,
# coverage closes the gap.
#
# Run with: `make initiative INITIATIVE=auth-ui-add-profile-page`

name: auth-ui-add-profile-page

description: |
  Adds a minimal profile page (component + route + data-testid attrs) to demonstrate
  the Playwright coverage-gap criterion. The agent should:
  1. Add the component
  2. Push, run the full gate
  3. See test_ui_changes_have_playwright_coverage fail with an AI-drafted spec
  4. Commit the spec verbatim
  5. Re-run the gate, post sticky on green

repo: leartech-auth-ui
branch: agent/add-profile-page
base: main

goal: |
  Add a static profile page accessible at `/profile`. Three deliverables only — keep
  the change small.

  ## Files to create

  ### `src/app/profile/profile.component.ts`

  - `@Component({ standalone: false, selector: 'app-profile', templateUrl: './profile.component.html' })`
  - Class `ProfileComponent` with `email = ''`
  - In `ngOnInit`, populate `this.email` from `AuthService.getCurrentUser()?.email ?? ''`.
    Mirror the constructor-DI pattern used in `home.component.ts` and `login.component.ts` —
    inject `AuthService` via the constructor.
  - Don't wire any other behaviour. The Edit button (see template below) is a placeholder
    with no click handler.

  ### `src/app/profile/profile.component.html`

  Four `data-testid` anchors:

      <div class="profile-page" data-testid="profile-page">
        <h2 data-testid="profile-heading">Profile</h2>
        <p data-testid="profile-email">Email: {{ email }}</p>
        <button data-testid="edit-button">Edit</button>
      </div>

  ## Wire into the app

  - Add `ProfileComponent` to the appropriate NgModule's `declarations` (mirror
    how `HomeComponent` / `LoginComponent` are declared today).
  - Add a route entry `{ path: 'profile', component: ProfileComponent }` to the
    routing module, in the same array as the existing routes.

  ## Constraints

  - **DO NOT add a Playwright spec.** The goal of this initiative is to demonstrate
    the coverage-gap criterion firing and producing an AI-drafted spec.
    After the gate flags the gap and surfaces the suggested spec in its assertion
    message, copy that suggestion verbatim into `end2end-ui/03-profile-page.spec.ts`
    (or whatever filename the suggester recommends), commit it, and re-run the gate.
  - Use `npm install --legacy-peer-deps` if any npm operations are needed.
  - `git add <specific files>` only (never `-A`).
  - Conventional commits: `feat(profile): add profile page` for the component;
    `test(profile): add Playwright spec from AI suggestion` for the spec commit.
  - PR description must explain this is a demo of the coverage-gap criterion +
    cite which catalog/criterion auto-suggested the spec.

gate_marks: []  # Full gate — we want the playwright tier to fire so the coverage
                # criterion runs and produces the suggested spec.

max_iterations: 7  # Generous: 1 to add component + 1 for gate + 1 to add spec from suggestion
                   # + extra for any lint/test follow-ups.
