name: cli-fix-cluster-flag-name-mismatch
description: |
  Surfaced 2026-06-11 during operator first-use of the leartech-agent
  CLI shipped in PR #104. Contract mismatch:

  - `leartech-agent --cluster` flag accepts ONLY 'gcp' and 'az' (Click
    Choice enum)
  - Built-in cluster config defines them as 'gcp-staging' and
    'az-staging' (config show output)

  Result: passing `--cluster gcp-staging` (the actual name) fails with
  "Invalid value for '--cluster'", and passing `--cluster gcp` (the
  flag-accepted value) fails to find a matching config entry → DNS
  resolution error.

  Both forms should work. The simplest fix: accept the short form as a
  prefix match on cluster names (i.e. `gcp` → matches `gcp-staging`).
  Alternative: extend the Click Choice enum dynamically from the config
  cluster list.

repo: leartech-automated-agent
branch: agent/cli-fix-cluster-flag-name-mismatch
base: main

goal: |
  Make `leartech-agent --cluster <name>` work with both short and
  full cluster names.

  ## 1. Read first

  - `app/agent_cli/main.py` — the Click entry point and --cluster
    flag definition
  - `app/agent_cli/config.py` — the cluster config loader + built-in
    cluster names

  ## 2. The fix

  Two parallel options; pick whichever is cleaner once you've read
  the code:

  ### Option A — prefix match
  Drop the `click.Choice(['gcp', 'az'])` constraint. Accept any
  string. Resolve as:
    1. Exact match against configured cluster names → use that
    2. Prefix match (e.g. 'gcp' → 'gcp-staging') → use that
    3. No match → error with "Available clusters: [list]"

  ### Option B — dynamic enum
  Build the Click choice from config.list_clusters() at decorator
  time. Both 'gcp-staging' and 'gcp' (as an alias) get accepted.
  Requires alias support in config schema.

  Option A is simpler. Take A unless the codebase already has alias
  metadata.

  ## 3. Tests

  - `tests/test_cli_cluster_flag_accepts_full_name.py` —
    `--cluster gcp-staging` resolves to staging URL
  - `tests/test_cli_cluster_flag_accepts_short_name.py` —
    `--cluster gcp` also resolves (prefix match)
  - `tests/test_cli_cluster_flag_ambiguous_short_errors.py` — if two
    configured clusters share a prefix, error with disambiguation
    suggestion (defensive — there's only 2 clusters today, but matters
    when more land)
  - `tests/test_cli_cluster_flag_unknown_lists_available.py` — bad
    name → error message includes the list of valid names

  ## 4. JX3 conventions

  Standard. Pure-Python change, no chart impact.

  ## 5. Conventional commit

  `fix(cli): --cluster accepts both short ('gcp') and full ('gcp-staging') names`

gate_marks: [unit, integration]
max_iterations: 6
